name: Deploy Brick Phase 8D — isolated development qualification only

on:
  workflow_dispatch:
    inputs:
      cloudflare_account_id:
        description: 'Cloudflare account ID (optional if repository variable/secret configured)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: brick-v1-phase8-development-only
  cancel-in-progress: false

jobs:
  deploy-development:
    name: Test and deploy current isolated card-free development Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id || secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      BRICK_DEV_PARENT_ACCESS_TOKEN: ${{ secrets.BRICK_DEV_PARENT_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact audited development ref
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Node 24 and locked npm
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Preflight environment isolation, credentials and branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v1-p8d-backend-deep-audit" || { echo 'Only Phase 8D audit branch can deploy this isolated development Worker.' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Existing deployment-token secret missing.' >&2; exit 1; }
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[A-Fa-f0-9]{32}$ ]] || { echo 'Cloudflare account ID missing/invalid.' >&2; exit 1; }
          [[ "${BRICK_DEV_PARENT_ACCESS_TOKEN:-}" =~ ^[A-Za-z0-9_-]{43,128}$ ]] || { echo 'Development high-entropy parent access token missing/invalid (must be secret).' >&2; exit 1; }
          grep -F '"name": "brick-family-v1-dev"' wrangler.development.template.jsonc >/dev/null
          grep -F '"main": "src/worker-v10.ts"' wrangler.development.template.jsonc >/dev/null
          grep -F '"DEV_PARENT_AUTH_MODE": "d1-session-v1"' wrangler.development.template.jsonc >/dev/null
          ! grep -F 'DEV_PARENT_PIN_HASH' wrangler.development.template.jsonc
          ! grep -F 'DEV_PARENT_LOGIN_HASH' wrangler.development.template.jsonc
          ! grep -F '"r2_buckets"' wrangler.development.template.jsonc
          ! grep -F '"queues"' wrangler.development.template.jsonc
          ! grep -F 'CF_ACCESS_' wrangler.development.template.jsonc
          ! grep -F '"triggers"' wrangler.development.template.jsonc
          grep -F 'scripts/setup-v1-phase6-development-cardfree-v2.mjs' package.json >/dev/null
          echo "Approved for DEVELOPMENT ONLY at source SHA $GITHUB_SHA"
      - name: Install exact dependencies and verify Phase 8D contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node scripts/test-phase8d-config-parity.mjs
          node scripts/test-phase8d-cloudflare-readonly.mjs
          node scripts/test-phase8d-remediation-plan.mjs
          npm run build:parent-assets
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit
          npm audit --audit-level=high
          bash scripts/phase6-cloud-regression.sh
      - name: Provision and migrate DEVELOPMENT D1 only and deploy worker-v10
        run: npm run setup:development
      - name: Strictly verify development state and absence of production binding
        shell: bash
        run: |
          set -euo pipefail
          test -s setup-development-state.json
          test -s wrangler.development.jsonc
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s=JSON.parse(fs.readFileSync('setup-development-state.json','utf8'));
          const w=JSON.parse(fs.readFileSync('wrangler.development.jsonc','utf8'));
          if(s.sourceGitSha!==process.env.GITHUB_SHA)throw Error('Dev source SHA mismatch');
          if(s.environment!=='development'||s.workerName!=='brick-family-v1-dev'||s.workerEntry!=='src/worker-v10.ts')throw Error('Not isolated development Worker');
          if(s.storageMode!=='d1-chunked-no-r2'||s.queueMode!=='direct-synchronous-no-cloudflare-queue')throw Error('Production-like storage connected to dev');
          if(s.parentLoginMode!=='private-high-entropy-token-v2'||s.parentAuthMode!=='d1-session-v1-no-zero-trust')throw Error('Unsafe or obsolete dev parent auth');
          if(w.name!=='brick-family-v1-dev'||w.main!=='src/worker-v10.ts'||w.vars.APP_ENV!=='development')throw Error('Wrong deployed Worker');
          if(w.d1_databases?.length!==1||w.d1_databases[0].database_name!=='brick-family-v1-dev')throw Error('Wrong D1');
          if(w.queues||w.r2_buckets||w.triggers||w.vars.CF_ACCESS_TEAM_DOMAIN||w.vars.CF_ACCESS_AUD)throw Error('Development is not isolated');
          for(const name of ['PARENT_LOGIN_RATE','PARENT_HISTORY_RATE','PARENT_WS_RATE','PARENT_GEOCODE_RATE','PARENT_COMMUTE_RATE']){
            if(!w.ratelimits.some(x=>x.name===name))throw Error('Missing development rate binding '+name);
          }
          NODE
      - name: Confirm login boundary and reject forged sessions
        shell: bash
        run: |
          set -euo pipefail
          host="$(node --input-type=module -e "import fs from 'node:fs';console.log(JSON.parse(fs.readFileSync('setup-development-state.json','utf8')).workerHost)")"
          test -n "$host"
          parent="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://$host/parent")"
          case "$parent" in 301|302|303|307|308|401) ;; *) echo "Unexpected unauthenticated dev parent HTTP $parent"; exit 1;; esac
          forged="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://$host/parent" -H 'X-Brick-Dev-Parent-Verified: session-v1')"
          case "$forged" in 301|302|303|307|308|401) ;; *) echo "Forged dev parent header accepted: $forged"; exit 1;; esac
          login="$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://$host/parent/login")"
          test "$login" = "200" || { echo "Dev parent login page did not load: $login"; exit 1; }
      - name: Emit nonsecret development deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-phase8d-development-only-${{ github.sha }}
          path: setup-development-state.json
          if-no-files-found: warn
          retention-days: 14
