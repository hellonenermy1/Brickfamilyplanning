name: Brick V1 Phase 6C — Parent Beta CI

on:
  pull_request:
    branches: [v1-p6-device-control-cloud]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-parent-beta:
    name: Parent beta typecheck, regression, render and fully card-free isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify qualified Phase 6 cloud base is retained
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e4657294d1d5c377a41a32bd91c80d17a4e5a21b HEAD

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck and build same-origin parent assets
        shell: bash
        run: |
          set -euo pipefail
          npm run build:parent-assets
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit
          node --check scripts/setup-v1-phase6-development-free.mjs

      - name: Run retained Phase 2-6 cloud regression and privacy gates
        run: bash scripts/phase6-cloud-regression.sh

      - name: Render actual beta5 parent portal and verify browser contract
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild src/parent-v6d.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-parent-v6d.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m = await import('file:///tmp/brick-parent-v6d.mjs');
          const html = m.parentV6DHtml();
          const required = [
            'DEVELOPMENT BETA',
            'Development Beta 5',
            'Development diagnostics',
            'Live trust',
            'PORTAL CONNECTING',
            'Run self-check',
            'Copy beta report',
            'id="debugLog"',
            'id="portalLive"',
            'getPrivateMapStatus',
            'Map unavailable on this browser. Brick controls and device data are still available.'
          ];
          for (const value of required) if (!html.includes(value)) throw new Error(`missing parent beta UI contract: ${value}`);
          if (!html.includes('pairingQrDataUrl')) throw new Error('Phase 6 pairing QR support was lost');
          if (!html.includes('location-control')) throw new Error('Phase 6 GPS control support was lost');
          if (!html.includes('Revoke selected phone')) throw new Error('Phase 6 revocation UI support was lost');
          if (!html.includes('__brickFallback:true')) throw new Error('map-startup failure isolation was lost');
          if (/https:\/\/unpkg\.com/i.test(html)) throw new Error('beta portal reintroduced live third-party CDN assets');
          if (/positionLat|positionLon|exact coordinates/i.test(html) && /positionLat=|positionLon=|latitude=|longitude=/i.test(html)) {
            throw new Error('diagnostic report appears to expose exact coordinates');
          }
          const inline = html.match(/<script type="module">([\s\S]*?)<\/script>/);
          if (!inline) throw new Error('rendered parent inline browser module missing');
          fs.writeFileSync('/tmp/brick-parent-inline.mjs', inline[1]);
          console.log(`Rendered Phase 6C beta5 parent portal: ${html.length} bytes`);
          NODE
          node --check /tmp/brick-parent-inline.mjs

      - name: Verify fully card-free runtime and production isolation
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"name": "brick-family-v1-dev"' wrangler.development.template.jsonc >/dev/null
          grep -F '"main": "src/worker-v10.ts"' wrangler.development.template.jsonc >/dev/null
          grep -F '"database_name": "brick-family-v1-dev"' wrangler.development.template.jsonc >/dev/null
          grep -F '"BRICK_MAP_SOURCE": "__BRICK_MAP_SOURCE__"' wrangler.development.template.jsonc >/dev/null
          grep -F '"APP_ENV": "development"' wrangler.development.template.jsonc >/dev/null
          grep -F '"DEV_PARENT_AUTH_MODE": "d1-session-v1"' wrangler.development.template.jsonc >/dev/null
          grep -F '"DEV_PARENT_PIN_HASH": "931967fb6beab2e36f903438e73707c7e34bfec84c2492bb5cabc197e7bbc77d"' wrangler.development.template.jsonc >/dev/null
          grep -F '"name": "PARENT_LOGIN_RATE"' wrangler.development.template.jsonc >/dev/null
          grep -F '"CURRENT_APP_VERSION": "0.6.0-phase6c-beta5-cardfree"' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"r2_buckets"' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"queues"' wrangler.development.template.jsonc >/dev/null
          ! grep -F 'CF_ACCESS_' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"triggers"' wrangler.development.template.jsonc >/dev/null
          grep -F 'dev_object_store' schema/012_phase6c_free_runtime.sql >/dev/null
          grep -F 'dev_object_chunks' schema/012_phase6c_free_runtime.sql >/dev/null
          grep -F 'dev_parent_sessions' schema/012_phase6c_free_runtime.sql >/dev/null
          grep -F 'dev_maintenance_state' schema/013_phase6c_request_maintenance.sql >/dev/null
          grep -F 'developmentRuntimeEnv' src/worker-v10.ts >/dev/null
          grep -F 'parentV6DHtml' src/worker-v10.ts >/dev/null
          grep -F 'X-Brick-Portal", "phase6c-beta5' src/worker-v10.ts >/dev/null
          grep -F 'X-Brick-Storage", "d1-free-runtime' src/worker-v10.ts >/dev/null
          grep -F 'stripDevParentInternalHeader' src/worker-v10.ts >/dev/null
          grep -F 'authorizeDevParentRequest' src/worker-v10.ts >/dev/null
          grep -F 'PARENT_LOGIN_RATE' src/worker-v10.ts >/dev/null
          grep -F 'DEV_PARENT_PIN_HASH' src/worker-v10.ts >/dev/null
          grep -F 'reusable 6-digit beta access code' src/dev-parent-auth.ts >/dev/null
          ! grep -F 'consumed after the first successful login' src/dev-parent-auth.ts >/dev/null
          grep -F 'claimDevMaintenance' src/worker-v10.ts >/dev/null
          grep -F 'class D1ObjectBucket' src/dev-free-runtime.ts >/dev/null
          grep -F 'class DirectEventQueue' src/dev-free-runtime.ts >/dev/null
          grep -F 'class RemoteMapBucket' src/dev-free-runtime.ts >/dev/null
          grep -F 'setup-v1-phase6-development-free.mjs' package.json >/dev/null
          test ! -e .github/workflows/tmp-phase6c-cardfree-deploy.yml

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src = fs.readFileSync('src/worker-v10.ts','utf8');
          const strip = src.indexOf('const cleanReq = stripDevParentInternalHeader(req);');
          const auth = src.indexOf('authorizeDevParentRequest(cleanReq');
          if (!(strip >= 0 && auth > strip)) throw new Error('worker-v10 must strip the internal auth header before D1 session authorization');
          NODE

          # Production remains frozen on its original identities/entrypoint and Access/R2 design.
          grep -F '"name": "brick-family-v1"' wrangler.template.jsonc >/dev/null
          grep -F '"main": "src/worker-v9.ts"' wrangler.template.jsonc >/dev/null
          grep -F 'brick-v1-phase6-production' .github/workflows/deploy-brick.yml >/dev/null
          ! grep -F 'worker-v10' wrangler.template.jsonc >/dev/null

      - name: Verify development auth gate cannot affect production
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild src/access-auth.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-access-auth-beta.mjs
          node --input-type=module <<'NODE'
          const m = await import('file:///tmp/brick-access-auth-beta.mjs');
          const req = new Request('https://example.test/parent', { headers: { 'X-Brick-Dev-Parent-Verified': 'session-v1' } });
          const dev = await m.parentAuthorized(req, { APP_ENV:'development', DEV_PARENT_AUTH_MODE:'d1-session-v1' });
          if (!dev) throw new Error('development internal session marker was not accepted under the exact beta env gate');
          const wrongMode = await m.parentAuthorized(req, { APP_ENV:'development', DEV_PARENT_AUTH_MODE:'wrong' });
          if (wrongMode) throw new Error('development marker bypassed the exact auth-mode gate');
          const prod = await m.parentAuthorized(req, { APP_ENV:'production', DEV_PARENT_AUTH_MODE:'d1-session-v1' });
          if (prod) throw new Error('development marker bypassed production Cloudflare Access auth');
          NODE

      - name: Verify development worker with Wrangler dry-run bundler
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('wrangler.development.template.jsonc', 'utf8');
          const config = source
            .replace('__D1_DATABASE_ID__', '00000000-0000-0000-0000-000000000000')
            .replace('__BRICK_MAP_SOURCE__', 'https://build.protomaps.com/20261101.pmtiles');
          fs.writeFileSync('wrangler.development.dryrun.jsonc', config);
          NODE
          rm -rf /tmp/brick-worker-v10-dry
          npx wrangler deploy --dry-run --config wrangler.development.dryrun.jsonc --outdir /tmp/brick-worker-v10-dry
          test -d /tmp/brick-worker-v10-dry
          rm -f wrangler.development.dryrun.jsonc

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
