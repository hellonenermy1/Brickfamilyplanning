name: Check Brick Phase 6 Android Runtime Wiring

on:
  push:
    branches: [phase6-child-final-audit, phase6-integration, phase6-final]
  pull_request:
    branches: [phase6-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify BLE anchor runtime is actually wired
        shell: bash
        run: |
          set -euo pipefail
          service='app/src/main/java/com/brick/safety/location/BrickLocationService.kt'
          engine='app/src/main/java/com/brick/safety/location/BleAnchorEngine.kt'
          grep -F 'bleAnchorEngine = BleAnchorEngine(this) { config -> positionEngine.noteBleAnchor(config) }' "$service" >/dev/null
          grep -F 'BrickApi.sendHealth(baseUrl, deviceId, health)' "$service" >/dev/null
          grep -F '.onSuccess(::updateBleAnchorConfigs)' "$service" >/dev/null
          grep -F 'bleAnchorEngine.updateConfigs(mapped)' "$service" >/dev/null
          grep -F 'bleAnchorEngine.scanOnce()' "$service" >/dev/null
          grep -F 'bleAnchorEngine.stop()' "$service" >/dev/null
          grep -F 'BLE_SCAN_NORMAL_MS = 60_000L' "$service" >/dev/null
          grep -F 'BLE_SCAN_DEGRADED_MS = 30_000L' "$service" >/dev/null
          grep -F 'activity == ActivityMode.VEHICLE || activity == ActivityMode.BICYCLE || activity == ActivityMode.RUNNING' "$service" >/dev/null
          grep -F 'REQUIRED_DETECTIONS = 2' "$engine" >/dev/null
          grep -F 'MIN_RSSI = -95' "$engine" >/dev/null
          grep -F 'BLE_ANCHOR_MAX_AGE_MS = 90_000L' app/src/main/java/com/brick/safety/location/PositionEngine.kt >/dev/null
      - name: Verify restart-safe inertial step source
        shell: bash
        run: |
          set -euo pipefail
          motion='app/src/main/java/com/brick/safety/location/MotionEngine.kt'
          position='app/src/main/java/com/brick/safety/location/PositionEngine.kt'
          grep -F 'Sensor.TYPE_STEP_COUNTER' "$motion" >/dev/null
          grep -F 'usingStepCounter = stepCounter != null' "$motion" >/dev/null
          grep -F 'totalSteps.set(counter)' "$motion" >/dev/null
          grep -F 'hasActivityPermission()' "$motion" >/dev/null
          grep -F 'prefs.getLong("anchorStepTotal", 0L)' "$position" >/dev/null
          if grep -F '0L, ActivityMode.fromCode' "$position"; then
            echo 'Process-restart step watermark regression found.' >&2
            exit 1
          fi
      - name: Verify durability failures cannot vanish between heartbeats
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'FAILURE_HOLD_MS = 120_000L' app/src/main/java/com/brick/safety/data/Journal.kt >/dev/null
          grep -F 'freshPriorFailure' app/src/main/java/com/brick/safety/data/Journal.kt >/dev/null
          grep -F 'FAILURE_HOLD_MS = 120_000L' app/src/main/java/com/brick/safety/data/SafetyOutbox.kt >/dev/null
          grep -F 'freshPriorFailure' app/src/main/java/com/brick/safety/data/SafetyOutbox.kt >/dev/null
          grep -F '.put("bluetoothScanPermission", Build.VERSION.SDK_INT < 31 || granted(Manifest.permission.BLUETOOTH_SCAN))' app/src/main/java/com/brick/safety/reliability/HealthEvidence.kt >/dev/null
      - name: Verify Device Owner protects location and replay clock
        shell: bash
        run: |
          set -euo pipefail
          policy='app/src/main/java/com/brick/safety/managed/ManagedPolicy.kt'
          grep -F 'dpm.setLocationEnabled(admin, true)' "$policy" >/dev/null
          grep -F 'UserManager.DISALLOW_CONFIG_LOCATION' "$policy" >/dev/null
          grep -F 'dpm.setAutoTimeEnabled(admin, true)' "$policy" >/dev/null
          grep -F 'UserManager.DISALLOW_CONFIG_DATE_TIME' "$policy" >/dev/null
