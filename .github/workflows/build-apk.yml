name: Build Brick Child Phase 6

on:
  push:
    branches: [phase6-child-final-audit, phase6-final-hardening, phase6-integration, phase6-final]
  pull_request:
    branches: [phase6-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Audit Phase 6 Android contracts
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'firebase[-_ ]?analytics|google[-_ ]?analytics|googletagmanager|facebook.*pixel|meta.*pixel|mixpanel|amplitude|appsflyer|adjust\.com|doubleclick' app; then
            echo 'Analytics/ad tracker reference found in child app.' >&2
            exit 1
          fi
          if grep -RniE 'Log\.(v|d|i|w|e)\([^\n]*(latitude|longitude|coordinate|rawLat|rawLon|accuracyM)' app/src/main/java; then
            echo 'Coordinate-bearing Android log statement found.' >&2
            exit 1
          fi
          if grep -nE 'throwable\.(message|localizedMessage)|stackTraceToString|printStackTrace' app/src/main/java/com/brick/safety/reliability/CrashReporter.kt; then
            echo 'Crash reporter must not persist raw messages or stack traces.' >&2
            exit 1
          fi
          grep -F '.put("exceptionSignature", signature)' app/src/main/java/com/brick/safety/reliability/CrashReporter.kt >/dev/null
          grep -F 'MAX_PENDING_DIAGNOSTICS = 500' app/src/main/java/com/brick/safety/data/CrashOutbox.kt >/dev/null
          grep -F 'FAILURE_HOLD_MS = 120_000L' app/src/main/java/com/brick/safety/data/Journal.kt >/dev/null
          grep -F 'FAILURE_HOLD_MS = 120_000L' app/src/main/java/com/brick/safety/data/SafetyOutbox.kt >/dev/null
          grep -F 'putBoolean("journalWriteHealthy", healthy)' app/src/main/java/com/brick/safety/data/Journal.kt >/dev/null
          grep -F 'fun maxSequence(epoch: Int): Long' app/src/main/java/com/brick/safety/data/Journal.kt >/dev/null
          grep -F 'fun ackBatch(items: List<Pair<Int, Long>>): Boolean' app/src/main/java/com/brick/safety/data/Journal.kt >/dev/null
          grep -F 'db.beginTransaction()' app/src/main/java/com/brick/safety/data/Journal.kt >/dev/null
          grep -F 'journal.maxSequence(epoch)' app/src/main/java/com/brick/safety/BrickApplication.kt >/dev/null
          grep -F 'runCatching { RecoveryScheduler.ensureScheduled(this) }' app/src/main/java/com/brick/safety/BrickApplication.kt >/dev/null
          grep -F '.put("healthSequence", healthSequence)' app/src/main/java/com/brick/safety/reliability/HealthEvidence.kt >/dev/null
          grep -F '.put("bluetoothScanPermission", Build.VERSION.SDK_INT < 31 || granted(Manifest.permission.BLUETOOTH_SCAN))' app/src/main/java/com/brick/safety/reliability/HealthEvidence.kt >/dev/null
          grep -F 'putLong("safetySequence", eventSequence).commit()' app/src/main/java/com/brick/safety/reliability/SafetyDispatcher.kt >/dev/null
          grep -F 'eventSequence = eventSequence' app/src/main/java/com/brick/safety/reliability/SafetyDispatcher.kt >/dev/null
          grep -F 'sendLiveLocationPreview' app/src/main/java/com/brick/safety/network/BrickApi.kt >/dev/null
          grep -F 'sendLocationBatch' app/src/main/java/com/brick/safety/network/BrickApi.kt >/dev/null
          grep -F 'require(url.protocol.equals("https", ignoreCase = true))' app/src/main/java/com/brick/safety/network/BrickApi.kt >/dev/null
          grep -F 'previewNewestIfBacklogged' app/src/main/java/com/brick/safety/location/BrickLocationService.kt >/dev/null
          grep -F 'journal.nextPending(LOCATION_BATCH_SIZE)' app/src/main/java/com/brick/safety/location/BrickLocationService.kt >/dev/null
          grep -F 'journal.ackBatch(acked)' app/src/main/java/com/brick/safety/location/BrickLocationService.kt >/dev/null
          if grep -F 'sendOne(baseUrl, deviceId, newest)' app/src/main/java/com/brick/safety/location/BrickLocationService.kt; then
            echo 'Newest-first durable location ACK regression found.' >&2
            exit 1
          fi
          grep -F 'NET_CAPABILITY_VALIDATED' app/src/main/java/com/brick/safety/location/BrickLocationService.kt >/dev/null
          grep -F 'runCatching { RecoveryScheduler.scheduleSoon(this, 15) }' app/src/main/java/com/brick/safety/location/BrickLocationService.kt >/dev/null
          grep -F 'HEADING_STALE_NS = 10_000_000_000L' app/src/main/java/com/brick/safety/location/MotionEngine.kt >/dev/null
          grep -F 'prefs.getLong("anchorStepTotal", 0L)' app/src/main/java/com/brick/safety/location/PositionEngine.kt >/dev/null
          grep -F 'rawElapsed <= previous.elapsedMs' app/src/main/java/com/brick/safety/location/PositionEngine.kt >/dev/null
          grep -F 'SOS ACTIVE — alert sent' app/src/main/java/com/brick/safety/ui/MainActivity.kt >/dev/null
          if grep -F 'SOS ACTIVE — parent alerted' app/src/main/java/com/brick/safety/ui/MainActivity.kt; then
            echo 'Child UI must not claim the parent saw an SOS without delivery/read evidence.' >&2
            exit 1
          fi
          grep -F 'runCatching { dpm.setLocationEnabled(admin, true) }' app/src/main/java/com/brick/safety/managed/ManagedPolicy.kt >/dev/null
          grep -F 'runCatching { dpm.addUserRestriction(admin, UserManager.DISALLOW_CONFIG_LOCATION) }' app/src/main/java/com/brick/safety/managed/ManagedPolicy.kt >/dev/null
          grep -F 'runCatching { dpm.setAutoTimeEnabled(admin, true) }' app/src/main/java/com/brick/safety/managed/ManagedPolicy.kt >/dev/null
          grep -F 'runCatching { dpm.addUserRestriction(admin, UserManager.DISALLOW_CONFIG_DATE_TIME) }' app/src/main/java/com/brick/safety/managed/ManagedPolicy.kt >/dev/null
          grep -F 'Manifest.permission.BLUETOOTH_SCAN' app/src/main/java/com/brick/safety/managed/ManagedPolicy.kt >/dev/null
          grep -F 'android.permission.BLUETOOTH_SCAN' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:name=".BrickApplication"' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'versionName = "0.6.0-phase6-rc"' app/build.gradle.kts >/dev/null
          grep -F 'versionCode = 6' app/build.gradle.kts >/dev/null
          grep -F 'jvmTarget.set(JvmTarget.JVM_17)' app/build.gradle.kts >/dev/null
          grep -F 'android:id="@+id/fixButton"' app/src/main/res/layout/activity_main.xml >/dev/null
          grep -F 'ACTIVITY_STALE_MS = 2 * 60_000L' app/src/main/java/com/brick/safety/activity/ActivityEngine.kt >/dev/null
          grep -F 'GNSS_STALE_MS = 30_000L' app/src/main/java/com/brick/safety/location/GnssQualityMonitor.kt >/dev/null

      - name: Prepare optional stable release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BRICK_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BRICK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BRICK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BRICK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            keyfile="$RUNNER_TEMP/brick-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
            chmod 600 "$keyfile"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "BRICK_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
            echo "BRICK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BRICK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "BRICK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo 'Stable release signing secrets are not all configured; the release variant will still be built unsigned and audited.'
          fi

      - name: Verify exact committed Android dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test -s app/gradle.lockfile
          grep -F 'releaseRuntimeClasspath' app/gradle.lockfile >/dev/null
          grep -F 'debugRuntimeClasspath' app/gradle.lockfile >/dev/null
          before="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          gradle --no-daemon :app:dependencies --write-locks
          after="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          test "$before" = "$after"
          git diff --exit-code -- app/gradle.lockfile

      - name: Compile, lint, and build debug + release variants
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease --stacktrace

      - name: Record release dependency graph
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase6-apk-evidence
          cp app/gradle.lockfile phase6-apk-evidence/gradle.lockfile
          sha256sum app/gradle.lockfile > phase6-apk-evidence/gradle-lock-sha256.txt
          gradle --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > phase6-apk-evidence/release-runtime-dependencies.txt

      - name: Verify APK contents, signatures, and provenance
        shell: bash
        env:
          RELEASE_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          apkanalyzer_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          test -x "$apksigner_bin"
          test -x "$apkanalyzer_bin"
          mkdir -p phase6-apk-evidence

          debug_apk='app/build/outputs/apk/debug/app-debug.apk'
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -f "$debug_apk"
          test -n "$release_apk"
          test -f "$release_apk"

          "$apksigner_bin" verify --verbose --print-certs "$debug_apk" > phase6-apk-evidence/debug-signing.txt
          "$apkanalyzer_bin" apk summary "$debug_apk" > phase6-apk-evidence/debug-summary.txt
          "$apkanalyzer_bin" manifest permissions "$debug_apk" > phase6-apk-evidence/debug-permissions.txt
          "$apkanalyzer_bin" manifest print "$debug_apk" > phase6-apk-evidence/debug-manifest.xml

          {
            echo "source_git_sha=$source_sha"
            echo "github_event_sha=$GITHUB_SHA"
            echo "version_name=0.6.0-phase6-rc"
            echo "version_code=6"
            echo "build_type=debug"
            sha256sum "$debug_apk"
          } > phase6-apk-evidence/debug-provenance.txt

          "$apkanalyzer_bin" apk summary "$release_apk" > phase6-apk-evidence/release-summary.txt
          "$apkanalyzer_bin" manifest permissions "$release_apk" > phase6-apk-evidence/release-permissions.txt
          "$apkanalyzer_bin" manifest print "$release_apk" > phase6-apk-evidence/release-manifest.xml
          {
            echo "source_git_sha=$source_sha"
            echo "github_event_sha=$GITHUB_SHA"
            echo "version_name=0.6.0-phase6-rc"
            echo "version_code=6"
            echo "build_type=release"
            echo "stable_signing_available=$RELEASE_AVAILABLE"
            echo "gradle_lock_sha256=$(sha256sum app/gradle.lockfile | awk '{print $1}')"
            sha256sum "$release_apk"
          } > phase6-apk-evidence/release-provenance.txt

          if [[ "$RELEASE_AVAILABLE" == 'true' ]]; then
            "$apksigner_bin" verify --verbose --print-certs "$release_apk" > phase6-apk-evidence/release-signing.txt
          else
            echo 'UNSIGNED RELEASE CANDIDATE — stable production signing secrets were not configured.' > phase6-apk-evidence/release-signing.txt
            if "$apksigner_bin" verify "$release_apk" >/dev/null 2>&1; then
              echo 'Release unexpectedly verifies as signed while stable signing was unavailable.' >&2
              exit 1
            fi
          fi

      - name: Upload Phase 6 debug APK
        uses: actions/upload-artifact@v7
        with:
          name: brick-child-phase6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Phase 6 release-candidate APK
        uses: actions/upload-artifact@v7
        with:
          name: brick-child-phase6-release-candidate-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload stable-signed Phase 6 release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: brick-child-phase6-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android dependency lock used by APK build
        uses: actions/upload-artifact@v7
        with:
          name: brick-phase6-android-gradle-lock
          path: app/gradle.lockfile
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK provenance and inspection evidence
        uses: actions/upload-artifact@v7
        with:
          name: brick-child-phase6-apk-evidence
          path: phase6-apk-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brick-child-phase6-lint
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 30
