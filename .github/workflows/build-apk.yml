name: Build Brick Child APK

on:
  push:
    branches: [phase1-child-apk]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile, lint, and build debug APK
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: brick-child-phase1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-child-phase1-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
