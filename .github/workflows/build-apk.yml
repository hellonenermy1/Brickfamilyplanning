name: Brick — Build / Download APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brick-apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout APK source branch
        uses: actions/checkout@v5
        with:
          ref: apk-download

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify APK source branch and privacy contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "apk-download"
          test -s app/gradle.lockfile
          grep -F 'versionName = "0.6.0-phase6-rc"' app/build.gradle.kts >/dev/null
          grep -F 'versionCode = 6' app/build.gradle.kts >/dev/null
          grep -F 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:allowBackup="false"' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:dataExtractionRules="@xml/data_extraction_rules"' app/src/main/AndroidManifest.xml >/dev/null
          if grep -RniE 'firebase[-_ ]?analytics|google[-_ ]?analytics|googletagmanager|facebook.*pixel|meta.*pixel|mixpanel|amplitude|appsflyer|adjust\.com|doubleclick' app; then
            echo 'Analytics/ad tracker reference found in child app.' >&2
            exit 1
          fi

      - name: Prepare optional stable release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BRICK_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BRICK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BRICK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BRICK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            keyfile="$RUNNER_TEMP/brick-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
            chmod 600 "$keyfile"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "BRICK_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
            echo "BRICK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BRICK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "BRICK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo 'Stable signing secrets are incomplete; debug APK and unsigned release candidate will still be built.'
          fi

      - name: Verify exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          gradle --no-daemon :app:dependencies --write-locks
          after="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          test "$before" = "$after"
          git diff --exit-code -- app/gradle.lockfile

      - name: Build and lint debug + release APKs
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:assembleRelease :app:lintRelease --stacktrace

      - name: Verify APKs and write provenance
        shell: bash
        env:
          RELEASE_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          mkdir -p apk-evidence
          debug_apk='app/build/outputs/apk/debug/app-debug.apk'
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -f "$debug_apk"
          test -n "$release_apk"
          test -f "$release_apk"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          apkanalyzer_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer | sort | tail -n1)"
          test -x "$apksigner_bin"
          test -x "$apkanalyzer_bin"
          "$apksigner_bin" verify --verbose --print-certs "$debug_apk" > apk-evidence/debug-signing.txt
          "$apkanalyzer_bin" apk summary "$debug_apk" > apk-evidence/debug-summary.txt
          "$apkanalyzer_bin" manifest permissions "$debug_apk" > apk-evidence/debug-permissions.txt
          "$apkanalyzer_bin" manifest print "$debug_apk" > apk-evidence/debug-manifest.xml
          "$apkanalyzer_bin" apk summary "$release_apk" > apk-evidence/release-summary.txt
          "$apkanalyzer_bin" manifest permissions "$release_apk" > apk-evidence/release-permissions.txt
          "$apkanalyzer_bin" manifest print "$release_apk" > apk-evidence/release-manifest.xml
          {
            echo "source_branch=apk-download"
            echo "source_git_sha=$source_sha"
            echo "version_name=0.6.0-phase6-rc"
            echo "version_code=6"
            sha256sum "$debug_apk"
          } > apk-evidence/debug-provenance.txt
          {
            echo "source_branch=apk-download"
            echo "source_git_sha=$source_sha"
            echo "version_name=0.6.0-phase6-rc"
            echo "version_code=6"
            echo "stable_signing_available=$RELEASE_AVAILABLE"
            sha256sum "$release_apk"
          } > apk-evidence/release-provenance.txt
          if [[ "$RELEASE_AVAILABLE" == 'true' ]]; then
            "$apksigner_bin" verify --verbose --print-certs "$release_apk" > apk-evidence/release-signing.txt
          else
            echo 'UNSIGNED RELEASE CANDIDATE — configure stable signing secrets before production use.' > apk-evidence/release-signing.txt
            if "$apksigner_bin" verify "$release_apk" >/dev/null 2>&1; then
              echo 'Release unexpectedly verifies as signed while stable signing was unavailable.' >&2
              exit 1
            fi
          fi

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Brick-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release candidate APK
        uses: actions/upload-artifact@v7
        with:
          name: Brick-APK-release-candidate
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload stable-signed release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Brick-APK-production-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK evidence
        uses: actions/upload-artifact@v7
        with:
          name: Brick-APK-evidence
          path: apk-evidence/
          if-no-files-found: error
          retention-days: 30
