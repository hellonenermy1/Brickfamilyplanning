name: Check Brick Cloudflare Phase 6

on:
  push:
    branches: [phase6-cloud-final-audit, phase6-integration, phase6-final]
  pull_request:
    branches: [phase6-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Reject high-severity runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Syntax-check operational scripts
        run: |
          node --check scripts/setup.mjs
          node --check scripts/install-private-map.mjs
          node --check scripts/audit-privacy.mjs
          node --check scripts/test-phase5c.mjs
          node --check scripts/test-phase6-access.mjs
          node --check scripts/codespaces-check.mjs
          node -e "JSON.parse(require('fs').readFileSync('.devcontainer/devcontainer.json','utf8')); console.log('devcontainer JSON OK')"

      - name: Enforce Phase 6 Cloudflare architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"r2_buckets"' wrangler.template.jsonc >/dev/null
          grep -F '"binding": "HISTORY"' wrangler.template.jsonc >/dev/null
          grep -F '"binding": "MAPS"' wrangler.template.jsonc >/dev/null
          grep -F '"binding": "EVENTS"' wrangler.template.jsonc >/dev/null
          grep -F '"dead_letter_queue": "brick-family-v1-dlq"' wrangler.template.jsonc >/dev/null
          grep -F '"max_concurrency": 1' wrangler.template.jsonc >/dev/null
          grep -F '"CF_ACCESS_TEAM_DOMAIN": "__CF_ACCESS_TEAM_DOMAIN__"' wrangler.template.jsonc >/dev/null
          grep -F '"CF_ACCESS_AUD": "__CF_ACCESS_AUD__"' wrangler.template.jsonc >/dev/null
          grep -F '/access/apps' scripts/setup.mjs >/dev/null
          grep -F '/r2/buckets' scripts/setup.mjs >/dev/null
          grep -F '/queues' scripts/setup.mjs >/dev/null
          grep -F 'brick-family-v1-dlq' scripts/setup.mjs >/dev/null
          grep -F 'verifyAccessRequest' src/access-auth.ts >/dev/null
          grep -F 'header.alg !== "RS256"' src/access-auth.ts >/dev/null
          grep -F 'reserveHealthReplay' src/worker-v5b.ts >/dev/null
          grep -F 'validateSafetyReplayWindow' src/worker-v5b.ts >/dev/null
          grep -F 'device_replay_state' schema/007_phase5c_hardening.sql >/dev/null
          grep -F 'SEGMENT_MS = 15 * 60 * 1000' src/history-store.ts >/dev/null
          grep -F 'segmentMinutes: "15"' src/history-store.ts >/dev/null
          grep -F 'history/raw/' src/history-store.ts >/dev/null
          grep -F 'history/trusted/' src/history-store.ts >/dev/null
          grep -F "script-src 'self' 'nonce-" src/worker-v5b.ts >/dev/null
          grep -F "import { maplibregl, createBrickMap, resolveBrickPlace, getPrivateMapStatus } from '/brick-map.mjs';" src/parent-v5b.ts >/dev/null
          if grep -E 'D1MapBucket|withD1ObjectStores|MAP_DB|D1QueueProducer' src/worker-v5b.ts wrangler.template.jsonc; then
            echo 'Temporary D1 R2/Queue compatibility layer leaked into Phase 6 production runtime.' >&2
            exit 1
          fi
          if grep -F 'BRICK_PARENT_PASSWORD' src/worker-v5b.ts wrangler.template.jsonc scripts/setup.mjs; then
            echo 'Custom password session must not replace Cloudflare Access in Phase 6.' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('wrangler.template.jsonc','utf8');
          const m=text.match(/"crons"\s*:\s*\[([^\]]+)\]/s);
          if(!m) throw new Error('cron configuration missing');
          const crons=[...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]);
          for(const cron of crons){
            const fields=cron.trim().split(/\s+/);
            if(fields.length!==5) throw new Error(`Cloudflare cron must have 5 fields: ${cron}`);
          }
          console.log('Cron syntax shape OK:', crons.join(', '));
          NODE

      - name: Reject browser injection primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '\.innerHTML\s*=|\.outerHTML\s*=|insertAdjacentHTML\s*\(|document\.write\s*\(|\beval\s*\(|new[[:space:]]+Function\s*\(' src/parent-v5.ts src/parent-v5b.ts web; then
            echo 'Unsafe browser DOM/code execution primitive found.' >&2
            exit 1
          fi

      - name: Type-check Worker and browser modules
        run: |
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit

      - name: Build same-origin parent assets
        run: npm run build:parent-assets

      - name: Verify private map browser assets and endpoints
        shell: bash
        run: |
          set -euo pipefail
          test -s public/brick-map.mjs
          test -s public/maplibre-gl.css
          test -s public/maplibre-gl-worker.mjs
          grep -F '/parent/map/basemap.pmtiles' public/brick-map.mjs >/dev/null
          if grep -E 'unpkg\.com|demotiles\.maplibre\.org|nominatim\.openstreetmap\.org|maps\.googleapis\.com|maps\.google\.com|api\.mapbox\.com' public/brick-map.mjs; then
            echo 'External live map/geocoder endpoint found in browser bundle.' >&2
            exit 1
          fi

      - name: Audit privacy and external trackers
        run: node scripts/audit-privacy.mjs

      - name: Cryptographically test Cloudflare Access JWT validation
        run: |
          npx esbuild src/access-auth.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-access-auth.mjs
          node scripts/test-phase6-access.mjs file:///tmp/brick-access-auth.mjs

      - name: Validate Phase 5C crash privacy contract
        run: |
          npx esbuild src/phase5c.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5c.mjs
          node scripts/test-phase5c.mjs file:///tmp/brick-phase5c.mjs

      - name: Render and parse parent dashboard module
        run: node scripts/check-parent-module.mjs

      - name: Validate health classification
        run: |
          npx esbuild src/phase5-ops.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5-ops.mjs
          node scripts/test-phase5-ops.mjs /tmp/brick-phase5-ops.mjs

      - name: Validate history delta/gzip codec
        run: |
          npx esbuild src/history-codec.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-history-codec.mjs
          node scripts/test-history-codec.mjs /tmp/brick-history-codec.mjs

      - name: Validate D1 schemas and privacy columns
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          db = sqlite3.connect(':memory:')
          for name in ['001_init.sql','002_phase2_health.sql','003_phase4_safety.sql','004_phase5_operations.sql','007_phase5c_hardening.sql']:
              db.executescript(pathlib.Path('schema', name).read_text())
              print('OK', name)
          cols=[r[1] for r in db.execute('PRAGMA table_info(crash_reports)').fetchall()]
          assert 'latitude' not in cols and 'longitude' not in cols and 'stack_trace' not in cols
          replay=[r[1] for r in db.execute('PRAGMA table_info(device_replay_state)').fetchall()]
          assert replay == ['device_id','last_health_sequence','updated_at'], replay
          print('OK privacy-safe crash schema + replay state')
          db.close()
          PY

      - name: Validate Phase 6 release truthfulness
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const CURRENT_APP_VERSION = '0.6.0-phase6-rc'" scripts/setup.mjs >/dev/null
          grep -F '"CURRENT_APP_VERSION": "0.6.0-phase6-rc"' wrangler.template.jsonc >/dev/null
          grep -F "releaseState: 'candidate-not-real-device-qualified'" scripts/setup.mjs >/dev/null
          grep -F 'Private Singapore basemap installed' scripts/install-private-map.mjs >/dev/null
          grep -F 'Strict-Transport-Security' src/worker-v5b.ts >/dev/null
          grep -F "script-src 'self' 'nonce-" src/worker-v5b.ts >/dev/null
