name: Check Brick Cloudflare Phase 5C Hardening

on:
  push:
    branches: [phase5c-hardening-audit]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Codespaces configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('.devcontainer/devcontainer.json','utf8')); console.log('devcontainer JSON OK')"
          node --check scripts/codespaces-check.mjs
      - name: Syntax-check setup, map installer, and audits
        run: |
          node --check scripts/setup.mjs
          node --check scripts/install-private-map.mjs
          node --check scripts/audit-privacy.mjs
          node --check scripts/test-phase5c.mjs
      - name: Guard cardless Cloudflare configuration
        run: |
          if grep -F '"base_path"' wrangler.template.jsonc; then
            echo 'Non-root assets.base_path is not allowed in the no-card deployment.' >&2
            exit 1
          fi
          if grep -F '/access/' scripts/setup.mjs; then
            echo 'Cloudflare Access dependency reintroduced into cardless setup.' >&2
            exit 1
          fi
          if grep -E 'R2_BUCKET|r2_buckets|queues|dead_letter|brick-family-v1-history' wrangler.template.jsonc scripts/setup.mjs; then
            echo 'Billing-gated R2/Queue dependency reintroduced into cardless runtime.' >&2
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('wrangler.template.jsonc','utf8');
          const m=text.match(/"crons"\s*:\s*\[([^\]]+)\]/s);
          if(!m) throw new Error('cron configuration missing');
          const crons=[...m[1].matchAll(/"([^"]+)"/g)].map(x=>x[1]);
          for(const cron of crons){
            const fields=cron.trim().split(/\s+/);
            if(fields.length!==5) throw new Error(`Cloudflare cron must have 5 fields: ${cron}`);
          }
          console.log('Cron syntax shape OK:', crons.join(', '));
          NODE
      - name: Type-check private map browser module
        run: npx tsc -p tsconfig.web.json --noEmit
      - name: Build self-hosted parent assets
        run: npm run build:parent-assets
      - name: Verify private map browser assets
        run: |
          test -s public/brick-map.mjs
          test -s public/maplibre-gl.css
          test -s public/maplibre-gl-worker.mjs
          grep -F '/parent/map/basemap.pmtiles' public/brick-map.mjs >/dev/null
          grep -F '/maplibre-gl-worker.mjs?v=6.16.0' public/brick-map.mjs >/dev/null
          if grep -F '/parent-assets/' public/brick-map.mjs; then
            echo 'Old non-root parent-assets path found in browser bundle.' >&2
            exit 1
          fi
          if grep -E 'unpkg\.com/maplibre-gl|demotiles\.maplibre\.org|nominatim\.openstreetmap\.org|maps\.googleapis\.com|maps\.google\.com' public/brick-map.mjs; then
            echo 'External live map endpoint found in self-hosted bundle.' >&2
            exit 1
          fi
      - name: Audit privacy and external trackers
        run: node scripts/audit-privacy.mjs
      - name: Type-check Worker
        run: npm run typecheck
      - name: Validate cardless parent authentication
        run: |
          npx esbuild src/parent-auth.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-parent-auth.mjs
          node scripts/test-parent-auth.mjs file:///tmp/brick-parent-auth.mjs
      - name: Validate Phase 5C crash privacy contract
        run: |
          npx esbuild src/phase5c.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5c.mjs
          node scripts/test-phase5c.mjs file:///tmp/brick-phase5c.mjs
      - name: Render and parse Phase 5C parent dashboard
        run: node scripts/check-parent-module.mjs
      - name: Validate Phase 5 health classification
        run: |
          npx esbuild src/phase5-ops.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5-ops.mjs
          node scripts/test-phase5-ops.mjs /tmp/brick-phase5-ops.mjs
      - name: Validate history delta and gzip codec
        run: |
          npx esbuild src/history-codec.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-history-codec.mjs
          node scripts/test-history-codec.mjs /tmp/brick-history-codec.mjs
      - name: Validate main D1 schemas and BLOB append semantics
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          db = sqlite3.connect(':memory:')
          for name in ['001_init.sql','002_phase2_health.sql','003_phase4_safety.sql','004_phase5_operations.sql','005_d1_blob_storage.sql','007_phase5c_hardening.sql']:
              db.executescript(pathlib.Path('schema', name).read_text())
              print('OK', name)
          db.execute("INSERT INTO history_hours(device_id,hour_start,raw_blob,trusted_blob,point_count,raw_expires_at,trusted_expires_at,updated_at) VALUES('d',1,?, ?,1,9,9,1)",(b'abc',b'123'))
          db.execute("UPDATE history_hours SET raw_blob=CAST(COALESCE(raw_blob,X'') || ? AS BLOB), trusted_blob=CAST(trusted_blob || ? AS BLOB), point_count=point_count+1 WHERE device_id='d' AND hour_start=1",(b'def',b'456'))
          row=db.execute("SELECT raw_blob,trusted_blob,point_count FROM history_hours").fetchone()
          assert row==(b'abcdef',b'123456',2), row
          crash_cols=[r[1] for r in db.execute('PRAGMA table_info(crash_reports)').fetchall()]
          assert 'latitude' not in crash_cols and 'longitude' not in crash_cols and 'stack_trace' not in crash_cols
          print('OK D1 BLOB append + privacy-safe crash schema')
          db.close()
          PY
      - name: Validate separate map D1 schema
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          db=sqlite3.connect(':memory:')
          db.executescript(pathlib.Path('schema/006_d1_map_storage.sql').read_text())
          db.execute("INSERT INTO map_chunks(chunk_index,body,byte_length,sha256_hex) VALUES(0,?,?,?)",(b'abc',3,'x'))
          db.execute("INSERT INTO map_manifest(id,total_bytes,chunk_bytes,chunk_count,sha256_hex,metadata_json,installed_at) VALUES(1,3,32768,1,'x','{}',1)")
          assert db.execute('SELECT total_bytes FROM map_manifest WHERE id=1').fetchone()[0]==3
          print('OK 006_d1_map_storage.sql')
          db.close()
          PY
      - name: Validate truthful map deployment state update
        run: |
          grep -F 'installed:true' scripts/install-private-map.mjs >/dev/null
          grep -F 'sha256:mapHash' scripts/install-private-map.mjs >/dev/null
          grep -F "CURRENT_APP_VERSION='0.5.1-phase5c'" scripts/setup.mjs >/dev/null
          grep -F '"CURRENT_APP_VERSION": "0.5.1-phase5c"' wrangler.template.jsonc >/dev/null
