name: Check Brick Cloudflare Phase 5

on:
  push:
    branches: [phase5-cloudflare-parent-ops]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check setup script
        run: node --check scripts/setup.mjs
      - name: Type-check Worker
        run: npm run typecheck
      - name: Parse parent dashboard module
        run: node scripts/check-parent-module.mjs
      - name: Validate Phase 5 health classification
        run: |
          npx esbuild src/phase5-ops.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5-ops.mjs
          node scripts/test-phase5-ops.mjs /tmp/brick-phase5-ops.mjs
      - name: Validate history delta and gzip codec
        run: |
          npx esbuild src/history-codec.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-history-codec.mjs
          node scripts/test-history-codec.mjs /tmp/brick-history-codec.mjs
      - name: Validate SQL schemas on fresh database
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          db = sqlite3.connect(':memory:')
          for name in ['001_init.sql', '002_phase2_health.sql', '003_phase4_safety.sql', '004_phase5_operations.sql']:
              sql = pathlib.Path('schema', name).read_text()
              db.executescript(sql)
              print('OK', name)
          db.close()
          PY
