name: Check Brick Cloudflare Phase 4

on:
  push:
    branches: [phase4-cloudflare-safety-history]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check setup script
        run: node --check scripts/setup.mjs
      - name: Type-check Worker
        run: npm run typecheck
      - name: Parse parent dashboard module
        run: node scripts/check-parent-module.mjs
      - name: Validate SQL schemas on fresh database
        run: |
          python - <<'PY'
          import sqlite3, pathlib
          db = sqlite3.connect(':memory:')
          for name in ['001_init.sql', '002_phase2_health.sql', '003_phase4_safety.sql']:
              sql = pathlib.Path('schema', name).read_text()
              db.executescript(sql)
              print('OK', name)
          db.close()
          PY
