name: Check Brick Cloudflare Phase 4

on:
  push:
    branches: [phase4-cloudflare-safety-history]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax-check setup script
        run: node --check scripts/setup.mjs
      - name: Type-check Worker
        run: npm run typecheck
