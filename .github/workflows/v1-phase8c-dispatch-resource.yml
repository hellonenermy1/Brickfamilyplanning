name: Brick V1 Phase 8C — Dispatch Resource Evidence

on:
  push:
    branches: [v1-p8c-android-deep-audit]
    paths:
      - '.github/workflows/v1-phase8c-dispatch-resource.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch-resource-budget:
    runs-on: ubuntu-24.04
    steps:
      - name: Run corrected resource-budget workflow against the Phase 8C ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/v1-phase8-android-resource-budget.yml/dispatches \
            -f ref='v1-p8c-android-deep-audit'
