name: Brick V1 Phase 8C — Android 10 Device Owner Policy Regression

on:
  push:
    branches: [v1-p8c-android-deep-audit]
    paths:
      - '.github/workflows/v1-phase8c-api29-policy.yml'
      - 'app/src/main/java/com/brick/safety/managed/**'
      - 'app/src/main/java/com/brick/safety/maintenance/**'
      - 'app/src/main/java/com/brick/safety/beta/**'
      - 'app/src/androidTest/java/com/brick/safety/managed/Phase8Api29AutoTimePolicyInstrumentedTest.kt'
      - 'app/src/androidTest/java/com/brick/safety/maintenance/Phase8Api29WifiDeviceOwnerInstrumentedTest.kt'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api29-device-owner-policy:
    name: API29 DO auto-time provenance -> deprovision restore
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'

      - name: Locate Android SDK and AVD tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          AVD_HOME="$RUNNER_TEMP/brick-p8c-api29-avd"
          test -n "$SDKMANAGER_PATH" && test -x "$SDKMANAGER_PATH"
          test -n "$AVDMANAGER_PATH" && test -x "$AVDMANAGER_PATH"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER_PATH" >> "$GITHUB_ENV"
          echo "ADB=$SDK_ROOT/platform-tools/adb" >> "$GITHUB_ENV"
          echo "EMULATOR=$SDK_ROOT/emulator/emulator" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"

      - name: Install Android 10 AOSP image and build test APKs
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'emulator' 'system-images;android-29;default;x86_64'
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --console=plain

      - name: Boot clean Android 10 emulator and install Brick
        shell: bash
        run: |
          set -euo pipefail
          echo no | "$AVDMANAGER" create avd --force --name brick-p8c-api29 --package 'system-images;android-29;default;x86_64' --device 'pixel_2'
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          nohup "$EMULATOR" -avd brick-p8c-api29 -wipe-data -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/brick-p8c-api29-emulator.log 2>&1 &
          "$ADB" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          test "$("$ADB" shell getprop ro.build.version.sdk | tr -d '\r')" = "29"
          "$ADB" install -t app/build/outputs/apk/debug/app-debug.apk
          "$ADB" install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$ADB" shell pm path com.brick.safety | grep -F 'package:' >/dev/null
          "$ADB" shell dumpsys account | tee /tmp/p8c-api29-accounts.txt
          grep -F 'Accounts: 0' /tmp/p8c-api29-accounts.txt >/dev/null

      - name: Provision Brick as real Android 10 Device Owner
        shell: bash
        run: |
          set -euo pipefail
          # This workflow tests the API29 policy branch, not setup-wizard behavior. Put the disposable
          # AOSP test user back at the pre-setup boundary required by Android 10 Device Owner setup.
          "$ADB" shell settings put global device_provisioned 0
          "$ADB" shell settings put secure user_setup_complete 0
          "$ADB" shell dpm set-device-owner com.brick.safety/.managed.BrickDeviceAdminReceiver | tee /tmp/p8c-api29-set-owner.txt
          grep -E 'Success|Active admin set' /tmp/p8c-api29-set-owner.txt >/dev/null
          "$ADB" shell dumpsys device_policy | tee /tmp/p8c-api29-policy-before.txt
          grep -F 'com.brick.safety' /tmp/p8c-api29-policy-before.txt >/dev/null

      - name: Execute P8C-003 real Device Owner Wi-Fi state-transition regression
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" shell am instrument -w \
            -e class 'com.brick.safety.maintenance.Phase8Api29WifiDeviceOwnerInstrumentedTest' \
            com.brick.safety.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/p8c-api29-wifi-test.txt
          grep -E 'OK \(1 test\)|OK \(1 tests\)' /tmp/p8c-api29-wifi-test.txt >/dev/null

      - name: Execute P8C-009 provenance and reversal regression
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" shell am instrument -w \
            -e class 'com.brick.safety.managed.Phase8Api29AutoTimePolicyInstrumentedTest' \
            com.brick.safety.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/p8c-api29-test.txt
          grep -E 'OK \(1 test\)|OK \(1 tests\)' /tmp/p8c-api29-test.txt >/dev/null

          # The production deprovision path inside the test must have relinquished ownership.
          "$ADB" shell dumpsys device_policy | tee /tmp/p8c-api29-policy-after.txt
          ! grep -F 'Device Owner' /tmp/p8c-api29-policy-after.txt | grep -F 'com.brick.safety' >/dev/null

      - name: Capture API29 evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p p8c-api29-evidence
          cp /tmp/p8c-api29-emulator.log p8c-api29-evidence/emulator.txt 2>/dev/null || true
          cp /tmp/p8c-api29-accounts.txt p8c-api29-evidence/accounts.txt 2>/dev/null || true
          cp /tmp/p8c-api29-set-owner.txt p8c-api29-evidence/set-owner.txt 2>/dev/null || true
          cp /tmp/p8c-api29-policy-before.txt p8c-api29-evidence/device-policy-before.txt 2>/dev/null || true
          cp /tmp/p8c-api29-test.txt p8c-api29-evidence/instrumentation.txt 2>/dev/null || true
          cp /tmp/p8c-api29-wifi-test.txt p8c-api29-evidence/wifi-transition-instrumentation.txt 2>/dev/null || true
          cp /tmp/p8c-api29-policy-after.txt p8c-api29-evidence/device-policy-after.txt 2>/dev/null || true
          timeout 15s "$ADB" logcat -d > p8c-api29-evidence/logcat.txt 2>&1 || true

      - name: Upload API29 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p8c-api29-policy-${{ github.run_id }}
          path: p8c-api29-evidence
          retention-days: 30
          if-no-files-found: warn
