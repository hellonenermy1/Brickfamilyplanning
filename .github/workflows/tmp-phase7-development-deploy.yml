name: TEMP Brick Phase 7 Development Deploy

on:
  push:
    branches: [v1-p7-cloud-ux]

permissions:
  contents: read

concurrency:
  group: brick-v1-phase7-development-temp
  cancel-in-progress: false

jobs:
  deploy-phase7-development:
    if: ${{ !contains(github.event.head_commit.message, 'remove temporary Phase 7 deploy workflow') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Phase 7 development preflight
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          test "$GITHUB_REF_NAME" = "v1-p7-cloud-ux"
          git merge-base --is-ancestor 1a4e9c6c19ba372b49a500e0b227dbefe7bdac73 HEAD
          grep -F '"name": "brick-family-v1-dev"' wrangler.development.template.jsonc >/dev/null
          grep -F '"main": "src/worker-v10.ts"' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"r2_buckets"' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"queues"' wrangler.development.template.jsonc >/dev/null
          ! grep -F 'CF_ACCESS_' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"triggers"' wrangler.development.template.jsonc >/dev/null
          grep -F 'parentV7Html' src/worker-v10.ts >/dev/null
          grep -F 'phase7-beta1' src/worker-v10.ts >/dev/null
          ! grep -F '"main": "src/worker-v10.ts"' wrangler.template.jsonc >/dev/null

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Re-run Phase 7 qualification before deployment
        shell: bash
        run: |
          set -euo pipefail
          npm run build:parent-assets
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit
          node scripts/check-phase7-parent-presentation.mjs
          node scripts/check-phase7-health-presentation.mjs
          node scripts/check-phase7-safety-quality.mjs
          bash scripts/phase6-cloud-regression.sh

      - name: Provision or reuse card-free development resources
        run: npm run setup:development

      - name: Verify generated runtime remains card-free
        shell: bash
        run: |
          set -euo pipefail
          test -s setup-development-state.json
          ! grep -F 'r2_buckets' wrangler.development.jsonc >/dev/null
          ! grep -F '"queues"' wrangler.development.jsonc >/dev/null
          ! grep -F 'CF_ACCESS_' wrangler.development.jsonc >/dev/null
          ! grep -F '"triggers"' wrangler.development.jsonc >/dev/null
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s = JSON.parse(fs.readFileSync('setup-development-state.json','utf8'));
          if (s.sourceGitSha !== process.env.GITHUB_SHA) throw new Error(`setup SHA ${s.sourceGitSha} != workflow ${process.env.GITHUB_SHA}`);
          if (s.workerName !== 'brick-family-v1-dev' || s.workerEntry !== 'src/worker-v10.ts') throw new Error('wrong development worker identity');
          if (s.storageMode !== 'd1-chunked-no-r2') throw new Error('card-free storage mode lost');
          if (s.queueMode !== 'direct-synchronous-no-cloudflare-queue') throw new Error('card-free queue mode lost');
          if (s.parentAuthMode !== 'd1-session-v1-no-zero-trust') throw new Error('card-free parent auth mode lost');
          NODE

      - name: Deploy exact Phase 7 development SHA
        shell: bash
        run: |
          set -euo pipefail
          tag="brick-dev-phase7-git-${GITHUB_SHA:0:12}"
          npx wrangler deploy --strict --config wrangler.development.jsonc --tag "$tag" --message "Brick Phase 7 development source $GITHUB_SHA"
          npx wrangler deployments list --json --config wrangler.development.jsonc > worker-phase7-development-deployments.json
          grep -F "$GITHUB_SHA" worker-phase7-development-deployments.json >/dev/null

      - name: Verify live authenticated Phase 7 contract
        run: node scripts/verify-phase7-development-live.mjs

      - name: Verify unauthenticated parent boundary remains closed
        shell: bash
        run: |
          set -euo pipefail
          host="$(node --input-type=module -e "import fs from 'node:fs';console.log(JSON.parse(fs.readFileSync('setup-development-state.json','utf8')).workerHost)")"
          code="$(curl -sS -o /tmp/p7-parent-unauth -w '%{http_code}' "https://$host/parent")"
          case "$code" in
            301|302|303|307|308|401) ;;
            *) echo "Unexpected unauthenticated parent status: $code" >&2; exit 1 ;;
          esac
          forged="$(curl -sS -o /tmp/p7-parent-forged -w '%{http_code}' "https://$host/parent" -H 'X-Brick-Dev-Parent-Verified: session-v1')"
          case "$forged" in
            301|302|303|307|308|401) ;;
            *) echo "Forged internal auth marker returned unexpected status: $forged" >&2; exit 1 ;;
          esac

      - name: Upload non-secret deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brick-phase7-development-live-${{ github.sha }}
          path: |
            setup-development-state.json
            worker-phase7-development-deployments.json
          if-no-files-found: warn
          retention-days: 30
