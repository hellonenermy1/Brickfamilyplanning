name: Brick V1 Phase 7 — Device Owner Release Helper

on:
  push:
    branches: [v1-p7-android-ux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER_PATH" && test -x "$SDKMANAGER_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"

      - name: Install SDK tools
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build one-purpose Device Owner release helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p helper-src helper-classes helper-out
          cat > helper-src/ClearBrickOwner.java <<'JAVA'
          import android.app.admin.DevicePolicyManager;
          import android.content.Context;
          import android.os.Process;

          public final class ClearBrickOwner {
              private static final String PACKAGE = "com.brick.safety";

              public static void main(String[] args) throws Exception {
                  Class<?> activityThread = Class.forName("android.app.ActivityThread");
                  Object thread = activityThread.getDeclaredMethod("systemMain").invoke(null);
                  Context context = (Context) activityThread.getDeclaredMethod("getSystemContext").invoke(thread);
                  DevicePolicyManager dpm = context.getSystemService(DevicePolicyManager.class);

                  boolean ownerBefore = dpm.isDeviceOwnerApp(PACKAGE);
                  System.out.println("uid=" + Process.myUid());
                  System.out.println("owner_before=" + ownerBefore);

                  boolean clear = args.length == 1 && "--clear".equals(args[0]);
                  if (!clear) {
                      System.out.println("dry_run=true");
                      System.out.println("No policy was changed. Re-run with --clear only after owner_before=true.");
                      return;
                  }

                  if (!ownerBefore) {
                      throw new IllegalStateException("Brick is not the current Device Owner; refusing to clear anything.");
                  }

                  dpm.clearDeviceOwnerApp(PACKAGE);
                  boolean ownerAfter = dpm.isDeviceOwnerApp(PACKAGE);
                  System.out.println("owner_after=" + ownerAfter);
                  if (ownerAfter) {
                      throw new IllegalStateException("Android still reports Brick as Device Owner.");
                  }
                  System.out.println("SUCCESS: Brick relinquished Device Owner.");
              }
          }
          JAVA

          javac -source 8 -target 8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d helper-classes helper-src/ClearBrickOwner.java

          D8="$ANDROID_HOME/build-tools/35.0.0/d8"
          "$D8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output helper-out helper-classes/ClearBrickOwner.class

          (cd helper-out && zip -q ../ClearBrickOwner.jar classes.dex)
          sha256sum ClearBrickOwner.jar | tee ClearBrickOwner.jar.sha256

      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: brick-device-owner-release-helper
          path: |
            ClearBrickOwner.jar
            ClearBrickOwner.jar.sha256
          if-no-files-found: error
          retention-days: 7
