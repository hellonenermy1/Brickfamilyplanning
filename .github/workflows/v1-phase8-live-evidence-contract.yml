name: Brick V1 Phase 8 — Live Evidence Harness Contract

on:
  push:
    branches: [v1-p8-cloud-hardening]
  pull_request:
    branches: [v1-p8-cloud-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-evidence-contract:
    name: Verify live restore and cloud-usage evidence harnesses before manual execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install exactly locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Syntax-check both live evidence collectors
        run: |
          set -euo pipefail
          node --check scripts/phase8-live-brick-backup-restore.mjs
          node --check scripts/phase8-cloud-usage-metrics.mjs
          npx esbuild src/backup-restore-v6.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-backup-restore-live-contract.mjs

      - name: Prove live restore uses the actual Brick application recovery path
        shell: bash
        run: |
          set -euo pipefail
          restore=scripts/phase8-live-brick-backup-restore.mjs
          grep -F "'schema/001_init.sql'" "$restore" >/dev/null
          grep -F "'schema/015_phase8_device_identity.sql'" "$restore" >/dev/null
          grep -F "'brick-d1-snapshot-v1'" "$restore" >/dev/null
          grep -F 'restoreBackupToFreshD1' "$restore" >/dev/null
          grep -F 'await deleteDatabase(source.id);' "$restore" >/dev/null
          grep -F 'canonicalTables(restoredTables) === canonicalTables(originalTables)' "$restore" >/dev/null
          grep -F 'idx_devices_public_key_spki_unique' "$restore" >/dev/null

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const backup = fs.readFileSync('src/backup-v6.ts', 'utf8');
          const restore = fs.readFileSync('scripts/phase8-live-brick-backup-restore.mjs', 'utf8');
          const expected = [
            'devices', 'device_location_control', 'geofences', 'geofence_state', 'ble_anchors', 'trips',
            'retention_settings', 'safety_events', 'health_incidents', 'crash_reports', 'audit_log', 'device_replay_state'
          ];
          for (const table of expected) {
            if (!backup.includes(`"${table}"`)) throw new Error(`production backup table missing: ${table}`);
            if (!restore.includes(`'${table}'`)) throw new Error(`live restore fixture missing: ${table}`);
          }
          if (!fs.readFileSync('src/backup-restore-v6.ts', 'utf8').includes('restoreBackupToFreshD1')) {
            throw new Error('production fresh-D1 restore entry point disappeared');
          }
          console.log('Live restore harness tracks the exact Brick backup table set and application restore entry point.');
          NODE

      - name: Prove cloud usage evidence measures actual configured production resources
        shell: bash
        run: |
          set -euo pipefail
          metrics=scripts/phase8-cloud-usage-metrics.mjs
          grep -F "const workerName = 'brick-family-v1';" "$metrics" >/dev/null
          grep -F "const d1Name = 'brick-family-v1';" "$metrics" >/dev/null
          grep -F "'brick-family-v1-history'" "$metrics" >/dev/null
          grep -F "'brick-family-v1-maps'" "$metrics" >/dev/null
          grep -F "'brick-family-v1-events'" "$metrics" >/dev/null
          grep -F "'brick-family-v1-dlq'" "$metrics" >/dev/null
          grep -F 'workersInvocationsAdaptive' "$metrics" >/dev/null
          grep -F 'd1AnalyticsAdaptiveGroups' "$metrics" >/dev/null
          grep -F 'd1StorageAdaptiveGroups' "$metrics" >/dev/null
          grep -F 'databaseSizeBytes' "$metrics" >/dev/null
          grep -F 'r2OperationsAdaptiveGroups' "$metrics" >/dev/null
          grep -F 'queueMessageOperationsAdaptiveGroups' "$metrics" >/dev/null

      - name: Verify manual live workflows keep Cloudflare credentials step-scoped
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              '.github/workflows/v1-phase8-cloud-live-restore.yml',
              '.github/workflows/v1-phase8-cloud-usage-metrics.yml',
          ]:
              text = Path(name).read_text()
              if 'workflow_dispatch:' not in text:
                  raise SystemExit(f'{name}: live evidence workflow is no longer explicit/manual')
              # Do not embed a GitHub ${{ ... }} expression in this checker: Actions expands and masks
              # such expressions before the shell runs. Structural placement is the property we need.
              if 'CLOUDFLARE_API_TOKEN:' not in text:
                  raise SystemExit(f'{name}: scoped Cloudflare credential wiring missing')
              before_steps = text.split('    steps:', 1)[0]
              if 'CLOUDFLARE_API_TOKEN' in before_steps:
                  raise SystemExit(f'{name}: Cloudflare token leaked to job-level env')
          print('Live Cloudflare evidence credentials remain step-scoped.');
          PY

      - name: Verify workflow actions remain commit-pinned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'uses:[[:space:]]+[^[:space:]#]+@v[0-9]+' \
            .github/workflows/v1-phase8-live-evidence-contract.yml \
            .github/workflows/v1-phase8-cloud-live-restore.yml \
            .github/workflows/v1-phase8-cloud-usage-metrics.yml
