name: Brick V1 Phase 7 — APK Export

on:
  push:
    branches: [v1-p7-android-ux]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-apk:
    name: Build and export installable Phase 7 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER_PATH" && test -x "$SDKMANAGER_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"

      - name: Install compile SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build Phase 7 debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Record APK hash
        shell: bash
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-sha256.txt

      - name: Upload Phase 7 APK
        uses: actions/upload-artifact@v4
        with:
          name: brick-phase7-latest-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
