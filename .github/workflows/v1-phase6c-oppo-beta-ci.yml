name: Brick V1 Phase 6C — OPPO Beta CI

on:
  pull_request:
    branches: [v1-p6-device-control-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-audit-apk:
    name: Phase 6C build, lint, R8, privacy and beta APK
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify Phase 6 qualified base is retained
        run: git merge-base --is-ancestor 00dfa7a6e2f449c4632453e678fd8f1df1c88554 HEAD
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER_PATH" && test -x "$SDKMANAGER_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
      - name: Install compile and APK analysis SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Verify dependency lock is unchanged
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          gradle --no-daemon :app:dependencies --write-locks
          after="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          test "$before" = "$after"
          git diff --exit-code -- app/gradle.lockfile
      - name: Build beta, instrumentation APK, tests, lint and R8 release
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:lintRelease --stacktrace
      - name: Verify Phase 6C diagnostic privacy and contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 7' app/build.gradle.kts >/dev/null
          grep -F 'versionName = "0.6.0-phase6c-beta1"' app/build.gradle.kts >/dev/null
          grep -F 'Brick 6C Diagnostics' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'MAX_EVENTS = 12_000' app/src/main/java/com/brick/safety/diagnostics/DiagnosticStore.kt >/dev/null
          grep -F 'NORMAL_RETENTION_MS = 48L' app/src/main/java/com/brick/safety/diagnostics/DiagnosticStore.kt >/dev/null
          grep -F 'ERROR_RETENTION_MS = 7L' app/src/main/java/com/brick/safety/diagnostics/DiagnosticStore.kt >/dev/null
          ! grep -R -n -E 'anchorLatBits|anchorLonBits|latitude|longitude|deviceId\s*=|apiBase\s*=' app/src/main/java/com/brick/safety/diagnostics
          grep -R -n 'DiagnosticStore' app/src/main/java/com/brick/safety/reliability >/dev/null
      - name: Inspect and package installable Phase 6C debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p6c-beta
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk" && test -s "$apk"
          cp "$apk" p6c-beta/Brick-Phase6C-Beta.apk
          sha256sum p6c-beta/Brick-Phase6C-Beta.apk | tee p6c-beta/Brick-Phase6C-Beta.apk.sha256
          printf 'git_sha=%s\nversion=0.6.0-phase6c-beta1\nversion_code=7\nbase_phase6_sha=00dfa7a6e2f449c4632453e678fd8f1df1c88554\n' "$GITHUB_SHA" > p6c-beta/provenance.txt
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging p6c-beta/Brick-Phase6C-Beta.apk > p6c-beta/apk-badging.txt
          grep -F "package: name='com.brick.safety' versionCode='7' versionName='0.6.0-phase6c-beta1'" p6c-beta/apk-badging.txt >/dev/null
      - name: Upload Phase 6C beta APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: brick-phase6c-oppo-beta-apk
          path: p6c-beta/
          if-no-files-found: error
          retention-days: 30

  emulator-regression:
    name: Phase 2-6C cumulative Android instrumentation
    needs: build-audit-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Locate Android SDK and AVD
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          AVD_HOME="$RUNNER_TEMP/brick-p6c-avd"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER_PATH" >> "$GITHUB_ENV"
          echo "ADB=$SDK_ROOT/platform-tools/adb" >> "$GITHUB_ENV"
          echo "EMULATOR=$SDK_ROOT/emulator/emulator" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
      - name: Install and boot emulator
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | "$AVDMANAGER" create avd --force --name brick-p6c --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          nohup "$EMULATOR" -avd brick-p6c -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/brick-p6c-emulator.log 2>&1 &
          "$ADB" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"
      - name: Run all retained Phase 2-6C Android tests
        run: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
      - name: Preserve emulator diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p p6c-failure
          cp /tmp/brick-p6c-emulator.log p6c-failure/emulator.log || true
          "$ADB" logcat -d > p6c-failure/logcat.txt || true
          cp -R app/build/reports/androidTests p6c-failure/androidTests || true
      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brick-phase6c-emulator-failure
          path: p6c-failure/
          if-no-files-found: warn
          retention-days: 14
