name: Brick Beta APK — Build, Sign and Verify

on:
  push:
    branches: [beta/apk]
    paths:
      - '.github/workflows/beta-apk.yml'
      - 'beta/**'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

env:
  BRICK_BUILD_SOURCE_SHA: ${{ github.sha }}

permissions:
  contents: read
  statuses: write

jobs:
  beta-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'

      - name: Preserve baseline APK features and beta isolation
        run: python3 beta/check-apk-parity.py

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          APKANALYZER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer 2>/dev/null | sort | tail -n 1)"
          test -x "$SDKMANAGER_PATH" && test -x "$APKANALYZER_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "APKANALYZER=$APKANALYZER_PATH" >> "$GITHUB_ENV"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt2"
          echo "AAPT2=$SDK_ROOT/build-tools/35.0.0/aapt2" >> "$GITHUB_ENV"
          echo "APKSIGNER=$SDK_ROOT/build-tools/35.0.0/apksigner" >> "$GITHUB_ENV"
          echo "BRICK_KEYSTORE_PATH=$RUNNER_TEMP/brick-v1-rc.jks" >> "$GITHUB_ENV"
          mkdir -p beta-apk-results

      - name: Require permanent Brick signing identity
        shell: bash
        env:
          BRICK_ANDROID_KEYSTORE_B64: ${{ secrets.BRICK_ANDROID_KEYSTORE_B64 }}
          BRICK_KEYSTORE_PASSWORD: ${{ secrets.BRICK_ANDROID_KEYSTORE_PASSWORD }}
          BRICK_KEY_ALIAS: ${{ secrets.BRICK_ANDROID_KEY_ALIAS }}
          BRICK_KEY_PASSWORD: ${{ secrets.BRICK_ANDROID_KEY_PASSWORD }}
          BRICK_EXPECTED_SIGNING_CERT_SHA256: ${{ secrets.BRICK_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$BRICK_ANDROID_KEYSTORE_B64"
          test -n "$BRICK_KEYSTORE_PASSWORD"
          test -n "$BRICK_KEY_ALIAS"
          test -n "$BRICK_KEY_PASSWORD"
          test -n "$BRICK_EXPECTED_SIGNING_CERT_SHA256"
          expected="$(printf '%s' "$BRICK_EXPECTED_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          pinned='bfdeb49714fea714536c47f8126deed700f00b2dd113c5c0d452992d7ed5f790'
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          test "$expected" = "$pinned"
          echo "BRICK_EXPECTED_SIGNING_CERT_NORMALIZED=$expected" >> "$GITHUB_ENV"
          printf '%s' "$BRICK_ANDROID_KEYSTORE_B64" | base64 --decode > "$BRICK_KEYSTORE_PATH"
          test -s "$BRICK_KEYSTORE_PATH"
          chmod 600 "$BRICK_KEYSTORE_PATH"

      - name: Install build SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
          test -x "$APKSIGNER"

      - name: Refuse tracked private signing material
        shell: bash
        run: |
          set -euo pipefail
          ! git ls-files | grep -Ei '\.(jks|keystore|p12|pfx|pem|key)$|\.jks\.b64$'
          node scripts/phase8d-current-private-key-scan.mjs

      - name: Build current signed release candidate
        env:
          BRICK_KEYSTORE_PASSWORD: ${{ secrets.BRICK_ANDROID_KEYSTORE_PASSWORD }}
          BRICK_KEY_ALIAS: ${{ secrets.BRICK_ANDROID_KEY_ALIAS }}
          BRICK_KEY_PASSWORD: ${{ secrets.BRICK_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease :app:lintRelease --stacktrace --console=plain

      - name: Verify exact APK identity, manifest and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          # Android apkanalyzer's XML decoder can choke on valid app text containing '&'.
          # AAPT2 reads the compiled binary manifest directly; a successful release build
          # is not sufficient proof of the APK's final packaged identity or security flags.
          "$AAPT2" dump badging "$APK" > beta-apk-results/badging.txt
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > beta-apk-results/merged-manifest-tree.txt
          manifest_tree=beta-apk-results/merged-manifest-tree.txt
          badging=beta-apk-results/badging.txt
          package_line="$(grep -m1 '^package: name=' "$badging")"
          [[ "$package_line" == *"name='com.brick.safety'"* ]]
          [[ "$package_line" == *"versionCode='11'"* ]]
          [[ "$package_line" == *"versionName='1.0.0-beta.1'"* ]]
          ! grep -q '^application-debuggable' "$badging"
          # AAPT2 v35 prints android attributes as e.g.:
          # A: http://schemas.android.com/apk/res/android:allowBackup(0x01010280)=false
          # Parse the exact compiled value, independent of spacing/namespace formatting. Reject
          # missing/duplicate required attributes, any true value and unknown representations.
          python3 - "$manifest_tree" <<'PY'
          import re
          import sys
          from pathlib import Path
          tree = Path(sys.argv[1]).read_text(encoding="utf-8")
          attributes = {}
          for line in tree.splitlines():
              found = re.search(
                  r'\bA:\s+\S*/apk/res/android:(allowBackup|usesCleartextTraffic|debuggable|testOnly)'
                  r'\([^)]*\)\s*=\s*(.+?)\s*$',
                  line
              )
              if found:
                  attributes.setdefault(found.group(1), []).append(found.group(2).strip())
          false_values = {"false", "(type 0x12)0x0", "(type 0x12)0x00000000"}
          for key in ("allowBackup", "usesCleartextTraffic"):
              values = attributes.get(key, [])
              assert len(values) == 1 and values[0] in false_values, (
                  f"packaged {key} is not verifiably false: {values}"
              )
          for key in ("debuggable", "testOnly"):
              values = attributes.get(key, [])
              assert not values or len(values) == 1 and values[0] in false_values, (
                  f"packaged {key} must be absent or false: {values}"
              )
          print("Binary APK manifest explicitly forbids backups and cleartext; no debug/test-only mode")
          PY
          ! grep -F 'Phase8ResourceHarnessReceiver' "$manifest_tree"
          ! grep -F 'Phase8RetirementHarnessReceiver' "$manifest_tree"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee beta-apk-results/apk-signing-cert.txt
          ! grep -qi 'Android Debug' beta-apk-results/apk-signing-cert.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' beta-apk-results/apk-signing-cert.txt | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "$BRICK_EXPECTED_SIGNING_CERT_NORMALIZED"
          printf '%s\n' "$actual" > beta-apk-results/apk-signing-cert-sha256.txt
          cp "$APK" beta-apk-results/Brick-V1-1.0.0-beta.1.apk
          (cd beta-apk-results && sha256sum Brick-V1-1.0.0-beta.1.apk) | tee beta-apk-results/apk-sha256.txt
          cp beta/contract-v1.json beta-apk-results/beta-contract-v1.json
          cp beta/INSTALL.md beta-apk-results/INSTALL.md
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          apk=Path("beta-apk-results/Brick-V1-1.0.0-beta.1.apk")
          contract=json.loads(Path("beta/contract-v1.json").read_text())
          manifest={"releaseId":contract["releaseId"],"baseSha":contract["baseSha"],"apkSourceSha":os.environ["GITHUB_SHA"],"versionName":"1.0.0-beta.1","versionCode":11,"applicationId":"com.brick.safety","apkSha256":hashlib.sha256(apk.read_bytes()).hexdigest(),"signingCertSha256":os.environ["BRICK_EXPECTED_SIGNING_CERT_NORMALIZED"],"automaticExpiry":False,"phase2Status":"NOT_DEPLOYED","fieldReadiness":"PENDING_ACTUAL_PHONE_AND_PHASE2"}
          Path("beta-apk-results/build-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
          PY
          "$AAPT2" dump permissions "$APK" > beta-apk-results/permissions.txt
          printf 'git_sha=%s\napplication_id=com.brick.safety\nversion_code=11\nversion_name=1.0.0-beta.1\nsigning_cert_sha256=%s\n' "$GITHUB_SHA" "$actual" > beta-apk-results/provenance.txt

      - name: Remove materialized keystore
        if: always()
        shell: bash
        run: rm -f "$BRICK_KEYSTORE_PATH"

      - name: Upload public APK manifest diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-beta-public-manifest-diagnostics-${{ github.run_id }}
          path: |
            beta-apk-results/badging.txt
            beta-apk-results/merged-manifest-tree.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed RC and non-secret evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-beta-apk-${{ github.sha }}
          path: beta-apk-results/
          if-no-files-found: error
          retention-days: 30

      - name: Publish exact-commit Phase 8C status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f "state=$state" \
            -f "context=brick/beta/signed-apk" \
            -f "description=Beta exact-commit CI: $JOB_STATUS" \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brick-beta-test-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
