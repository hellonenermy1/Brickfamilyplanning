name: TEMP Phase 6C Card-Free Beta Deploy

on:
  pull_request:
    branches: [v1-p6-device-control-cloud]

permissions:
  contents: read

concurrency:
  group: brick-v1-phase6-development
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'v1-p6c-parent-beta-cloud'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install and qualify exact source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN' >&2; exit 1; }
          npm ci --no-audit --no-fund
          npm run build:parent-assets
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit
          bash scripts/phase6-cloud-regression.sh
          ! grep -F '"r2_buckets"' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"queues"' wrangler.development.template.jsonc >/dev/null
      - name: Provision and deploy card-free beta
        run: npm run setup:development
      - name: Verify no-R2 deployment state
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s = JSON.parse(fs.readFileSync('setup-development-state.json','utf8'));
          if (s.sourceGitSha !== process.env.GITHUB_SHA) throw new Error(`state SHA mismatch ${s.sourceGitSha}`);
          if (s.storageMode !== 'd1-chunked-no-r2') throw new Error('no-R2 storage not active');
          if (s.queueMode !== 'direct-synchronous-no-cloudflare-queue') throw new Error('direct queue mode not active');
          if (s.mapMode !== 'same-origin-worker-range-proxy') throw new Error('map proxy not active');
          console.log(`PARENT=https://${s.workerHost}/parent`);
          console.log(`API=https://${s.workerHost}`);
          NODE
          ! grep -F 'r2_buckets' wrangler.development.jsonc >/dev/null
          ! grep -F '"queues"' wrangler.development.jsonc >/dev/null
          npx wrangler d1 execute brick-family-v1-dev --remote --command "SELECT COUNT(*) AS n FROM dev_object_store" --config wrangler.development.jsonc
      - name: Strict final deploy with exact source tag
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --strict --config wrangler.development.jsonc --tag "brick-dev-free-git-${GITHUB_SHA:0:12}" --message "Brick Phase 6C card-free beta $GITHUB_SHA"
      - name: Security and API smoke
        shell: bash
        run: |
          set -euo pipefail
          host="$(node --input-type=module -e "import fs from 'node:fs';console.log(JSON.parse(fs.readFileSync('setup-development-state.json','utf8')).workerHost)")"
          parent_code="$(curl -sS -o /tmp/parent -w '%{http_code}' "https://$host/parent")"
          case "$parent_code" in 301|302|303|307|308|401|403) ;; 200) echo 'Parent portal unexpectedly public' >&2; exit 1;; *) echo "Unexpected parent status $parent_code" >&2; exit 1;; esac
          api_code="$(curl -sS -o /tmp/api -w '%{http_code}' -X POST "https://$host/api/pair/complete" -H 'content-type: application/json' --data '{"token":"invalid"}')"
          case "$api_code" in 400|401|403|404|409|422|429) ;; 5??) echo "Child API server error $api_code" >&2; exit 1;; esac
          echo "Parent beta: https://$host/parent"
          echo "Child beta API: https://$host"
