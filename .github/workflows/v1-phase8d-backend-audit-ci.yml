name: Brick V1 Phase 8D — Backend Trust Boundary Audit CI

on:
  push:
    branches: [v1-p8d-backend-deep-audit]
    paths:
      - 'src/**'
      - 'schema/**'
      - 'scripts/**'
      - 'wrangler.template.jsonc'
      - '.github/workflows/deploy-brick.yml'
      - '.github/workflows/v1-phase8d-backend-audit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brick-phase8d-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment-contract:
    name: P8D-001 — Reproduce production deployment/schema drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Require reproducible production entry, schema and deploy contract
        run: node scripts/audit-phase8d-contract.mjs deployment

  backup-inventory:
    name: P8D-002 — Reproduce backup coverage drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Require explicit and complete essential-state backup/restore inventory
        run: node scripts/audit-phase8d-contract.mjs backup

  source-build:
    name: Phase 8D source baseline TypeScript and locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install exact package lock
        run: npm ci --no-audit --no-fund
      - name: Typecheck all Cloudflare Worker TypeScript
        run: npm run typecheck
      - name: Build parent/browser assets
        run: npm run build:parent-assets
      - name: P8D-002 versioned backup restore regression
        run: |
          npx --no-install esbuild src/backup-restore-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-restore.mjs
          node scripts/test-backup-restore.mjs /tmp/brick-p8d-restore.mjs
          node scripts/test-phase8d-isolated-sqlite-restore.mjs /tmp/brick-p8d-restore.mjs
      - name: Verify strict schema 016 transform and repeatable migration on SQLite
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-phase8d-schema-compat.mjs --write-sql
          db=/tmp/brick-phase8d-schema-replay.sqlite
          for file in \
            schema/001_init.sql \
            schema/002_phase2_health.sql \
            schema/003_phase4_safety.sql \
            schema/004_phase5_operations.sql \
            schema/007_phase5c_hardening.sql \
            schema/008_v1_phase2_evidence.sql \
            schema/009_v1_phase5_fusion.sql \
            schema/010_phase5b_closure.sql \
            schema/011_v1_phase6_location_control.sql \
            schema/015_phase8_device_identity.sql; do
            sqlite3 "$db" < "$file"
          done
          sqlite3 "$db" < /tmp/brick-p8d-016-columns.sql
          for iteration in first repeat; do
            sqlite3 "$db" < /tmp/brick-p8d-016-remainder.sql
            sqlite3 "$db" < schema/017_p8b_provider_rate.sql
            sqlite3 "$db" < schema/018_p8b_pin_pairing.sql
          done
          actual="$(sqlite3 "$db" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('device_live_track_control','device_wifi_schedules','device_wifi_schedule_result','device_capability_profile','screen_time_daily','commute_summaries','provider_cache','provider_rate_window','pairing_pin_sessions')")"
          test "$actual" = "9"
          echo "PASS schema 001-018 additive migration + repeated 016 CREATE/index statements"
