name: Brick V1 Phase 8D — Backend Trust Boundary Audit CI

on:
  push:
    branches: [v1-p8d-backend-deep-audit]
    paths:
      - 'src/**'
      - 'schema/**'
      - 'scripts/**'
      - 'audit/phase8d/PHASE8D_ENDPOINT_MATRIX_V2.csv'
      - 'audit/phase8d/PHASE8D_DEVELOPMENT_ENDPOINTS.csv'
      - 'wrangler.template.jsonc'
      - 'wrangler.development.template.jsonc'
      - 'audit/phase8d/PHASE8D_R2_LIFECYCLE_TARGET.json'
      - 'audit/phase8d/PHASE8D_R2_LIFECYCLE_TARGET.md'
      - '.github/workflows/deploy-brick.yml'
      - '.github/workflows/deploy-brick-development.yml'
      - '.github/workflows/v1-phase8d-backend-audit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brick-phase8d-source-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment-contract:
    name: P8D-001 — Reproduce production deployment/schema drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Require reproducible production entry, schema and deploy contract
        run: node scripts/audit-phase8d-contract.mjs deployment

  backup-inventory:
    name: P8D-002 — Reproduce backup coverage drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Require explicit and complete essential-state backup/restore inventory
        run: node scripts/audit-phase8d-contract.mjs backup

  source-build:
    name: Phase 8D source baseline TypeScript and locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - name: Install exact package lock
        run: npm ci --no-audit --no-fund
      - name: Typecheck all Cloudflare Worker TypeScript
        run: npm run typecheck
      - name: Build parent/browser assets
        run: npm run build:parent-assets
      - name: P8D-050 actual routed Fast Live and durable DO revoke fence
        run: |
          npx --no-install esbuild src/worker-p8b.ts --bundle --format=esm --platform=node --target=node22 --alias:cloudflare:workers=./scripts/phase8d-cloudflare-workers-shim.mjs --outfile=/tmp/brick-p8d-prod-worker.mjs
          node scripts/test-phase8d-fast-live-revoke.mjs /tmp/brick-p8d-prod-worker.mjs
      - name: P8D-051 current development route schema and interrupted upgrade parity
        run: |
          npx --no-install esbuild src/worker-v10.ts --bundle --format=esm --platform=node --target=node22 --alias:cloudflare:workers=./scripts/phase8d-cloudflare-workers-shim.mjs --outfile=/tmp/brick-p8d-dev-worker.mjs
          node scripts/test-phase8d-development-parity.mjs /tmp/brick-p8d-dev-worker.mjs
          node scripts/test-phase8d-development-migration-retry.mjs
      - name: P8D-002 full schema recovery policy and nonempty durable-state roundtrip
        run: |
          npx --no-install esbuild src/backup-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-backup.mjs
          npx --no-install esbuild src/backup-restore-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-restore.mjs
          node scripts/test-phase8d-recovery-coverage.mjs /tmp/brick-p8d-backup.mjs /tmp/brick-p8d-restore.mjs
          node scripts/test-phase8d-recovery-preflight.mjs /tmp/brick-p8d-backup.mjs /tmp/brick-p8d-restore.mjs
          node scripts/test-phase8d-backup-limits.mjs /tmp/brick-p8d-backup.mjs
      - name: Native workerd D1 Queue R2 DO Access WebSocket and recovery integration
        run: node scripts/test-phase8d-workerd-integration.mjs
      - name: 8D.15 check built public assets for server-only credentials
        run: node scripts/test-phase8d-public-secret-surface.mjs
      - name: P8D-007 concurrent R2 segment durability regression
        run: |
          npx --no-install esbuild src/history-store.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-history.mjs
          node scripts/test-phase8d-history-concurrent-r2.mjs /tmp/brick-p8d-history.mjs
          node scripts/test-phase8d-history-idempotence.mjs /tmp/brick-p8d-history.mjs
      - name: P8D-024 enforce Queue success before live DO publication
        run: |
          npx --no-install esbuild src/location-ingest-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-location.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-location-queue-before-live.mjs /tmp/brick-p8d-location.mjs
      - name: P8D-021 prevent revoked device location D1, Queue, and DO writes
        run: |
          npx --no-install esbuild src/location-ingest-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-location.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-location-revoke-ingest.mjs /tmp/brick-p8d-location.mjs
      - name: 8D.5-7 actual SQLite epoch sequence and current-state ordering matrix
        run: |
          npx --no-install esbuild src/location-ingest-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-location.mjs
          npx --no-install esbuild src/live-state-order.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-live-order.mjs
          node scripts/test-phase8d-location-epoch-sqlite.mjs /tmp/brick-p8d-location.mjs /tmp/brick-p8d-live-order.mjs
      - name: P8D-018 reject oversized or invalid pre-auth fall event JSON
        run: |
          npx --no-install esbuild src/fall-event-route.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-fall.mjs
          node scripts/test-phase8d-fall-bounds.mjs /tmp/brick-p8d-fall.mjs
      - name: P8D-019 validate signed screen time monotonicity and revoke race on real SQLite
        run: |
          npx --no-install esbuild src/screen-time-route.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-screen.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-screen-time-replay-sqlite.mjs /tmp/brick-p8d-screen.mjs
      - name: P8D-020 reject signed health replay updates after revocation interleaving
        run: |
          npx --no-install esbuild src/device-json-security.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-device-auth.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-health-revoke-race.mjs /tmp/brick-p8d-device-auth.mjs
      - name: P8D.3-5 device ECDSA P-256 signed replay, revocation and invalid input
        run: |
          npx --no-install esbuild src/device-json-security.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-device-auth.mjs
          node scripts/test-phase8d-device-auth-replay.mjs /tmp/brick-p8d-device-auth.mjs
      - name: 8D.9 poison, D1 outage, durable and missing safety receipt replay through DLQ
        run: |
          npx --no-install esbuild src/queue-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-dlq.mjs
          node scripts/test-phase8d-dlq-poison.mjs /tmp/brick-p8d-dlq.mjs
      - name: P8D-004 R2/Queue safety ACK fault matrix
        run: |
          npx --no-install esbuild src/history-store.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-history.mjs
          npx --no-install esbuild src/queue-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-queue.mjs
          node scripts/test-phase8d-ack-faults.mjs /tmp/brick-p8d-history.mjs /tmp/brick-p8d-queue.mjs
      - name: P8D-009 fallback pairing valid P-256 key and bounded request
        run: |
          npx --no-install esbuild src/pin-pairing.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-pin-pairing.mjs
          node scripts/test-phase8d-pin-key-validation.mjs /tmp/brick-p8d-pin-pairing.mjs
          node scripts/test-phase8d-pin-confirm-race.mjs /tmp/brick-p8d-pin-pairing.mjs
      - name: P8D-047 release must require verified Access login challenge (never arbitrary 303)
        run: node scripts/test-phase8d-access-challenge-policy.mjs
      - name: P8D-044 actual live parent security probe mock denies forged/public/unsafe URLs
        run: node scripts/test-phase8d-live-parent-denial.mjs
      - name: P8D-045 Cloudflare GET-only D1 metadata and prod-dev isolation contract
        run: node scripts/test-phase8d-d1-catalog-readonly.mjs
      - name: P8D-038 Cloudflare GET-only audit API shapes, version provenance, Queue pagination and denial cases
        run: node scripts/test-phase8d-cloudflare-readonly.mjs
      - name: P8D-042 prevent production auto-deploy and obsolete Phase 6C dev deploy contract
        run: node scripts/test-phase8d-deployment-workflow-safety.mjs
      - name: P8D-041 deterministic non-mutating seven-target Cloudflare remediation contract
        run: node scripts/test-phase8d-remediation-plan.mjs
      - name: P8D-040 source configuration parity for prod/dev D1, R2, Queue, DO and rate bindings
        run: node scripts/test-phase8d-config-parity.mjs
      - name: 8D.13 signed command result finality, Wi-Fi freshness, capability profile and wrong-device cases
        run: |
          set -u
          npx --no-install esbuild src/phase6-location-control.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-location-control.mjs
          npx --no-install esbuild src/p8b-controls.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-controls.mjs
          fail=0
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-location-command-finality.mjs /tmp/brick-p8d-location-control.mjs || fail=1
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-live-command-finality.mjs /tmp/brick-p8d-controls.mjs || fail=1
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-wifi-result-freshness.mjs /tmp/brick-p8d-controls.mjs || fail=1
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-capability-profile-order.mjs /tmp/brick-p8d-controls.mjs || fail=1
          exit "$fail"
      - name: 8D.9 reject malformed Queue history poison without losing valid sibling
        run: |
          npx --no-install esbuild src/history-store.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-history.mjs
          node scripts/test-phase8d-queue-malformed-body.mjs /tmp/brick-p8d-history.mjs
      - name: 8D.16 actual D1 snapshot-to-restore plus byte-identical R2 history drill
        run: |
          npx --no-install esbuild src/backup-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-backup.mjs
          npx --no-install esbuild src/backup-restore-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-restore.mjs
          npx --no-install esbuild src/history-store.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-history.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-d1-r2-roundtrip.mjs /tmp/brick-p8d-backup.mjs /tmp/brick-p8d-restore.mjs /tmp/brick-p8d-history.mjs
      - name: 8D.2 production parent endpoint method inventory denies unauthenticated calls
        run: |
          npx --no-install esbuild src/worker-p8b.ts --bundle --format=esm --platform=node --target=node22 --alias:cloudflare:workers=./scripts/phase8d-cloudflare-workers-shim.mjs --outfile=/tmp/brick-p8d-prod-worker.mjs
          node scripts/test-phase8d-parent-method-auth.mjs /tmp/brick-p8d-prod-worker.mjs
      - name: 8D.15 public parent/browser asset leakage gate
        run: |
          npx --no-install esbuild src/parent-v8.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-prod-parent.mjs
          npx --no-install esbuild src/parent-v7-live.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-dev-parent.mjs
          node scripts/test-phase8d-public-secret-exposure.mjs /tmp/brick-p8d-prod-parent.mjs /tmp/brick-p8d-dev-parent.mjs
      - name: P8D-016 reject location-control command if device revoked between read and UPSERT
        run: |
          npx --no-install esbuild src/phase6-location-control.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-location-control.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-location-control-revoke-race.mjs /tmp/brick-p8d-location-control.mjs
      - name: P8D-006 deny mutations for revoked child identity
        run: |
          npx --no-install esbuild src/p8b-controls.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-controls.mjs
          node scripts/test-phase8d-revoked-control.mjs /tmp/brick-p8d-controls.mjs
          node scripts/test-phase8d-controls-sqlite.mjs /tmp/brick-p8d-controls.mjs
      - name: 8D.2 discover layered production routes and separate development login/logout
        run: node scripts/test-phase8d-layered-route-coverage.mjs
      - name: P8D-012 require 49 source endpoint rows have unambiguous named CSV schema
        run: node scripts/test-phase8d-endpoint-matrix.mjs
      - name: P8D-027 deduplicate costly per-device commute refreshes
        run: |
          npx --no-install esbuild src/commute-refresh-claim.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-refresh-claim.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-commute-refresh-claim.mjs /tmp/brick-p8d-refresh-claim.mjs
      - name: P8D-028 validate bounded commute and screen-time query parameters
        run: |
          npx --no-install esbuild src/commute-summary.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-commute.mjs
          npx --no-install esbuild src/screen-time-route.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-screen.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-parent-query-inputs.mjs /tmp/brick-p8d-commute.mjs /tmp/brick-p8d-screen.mjs
      - name: P8D-023 prove bounded commute scheduler rotates across 100+ devices
        run: |
          npx --no-install esbuild src/commute-scheduler.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-commute-scheduler.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-commute-scheduler-sqlite.mjs /tmp/brick-p8d-commute-scheduler.mjs
      - name: 8D.19 enforce immutable CI actions, accepted-branch deployment gate and source SHA
        run: node scripts/test-phase8d-release-gates.mjs
      - name: P8D-029 fail-closed OneMap and commute parent quotas
        run: |
          npx --no-install esbuild src/worker-p8b.ts --bundle --format=esm --platform=node --target=node22 --alias:cloudflare:workers=./scripts/phase8d-cloudflare-workers-shim.mjs --outfile=/tmp/brick-p8d-prod-worker.mjs
          node scripts/test-phase8d-parent-expensive-route-rate.mjs /tmp/brick-p8d-prod-worker.mjs
      - name: P8D-022 verify OneMap missing and malformed reverse coordinates fail closed
        run: |
          npx --no-install esbuild src/onemap-client.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-onemap.mjs
          node scripts/test-phase8d-onemap-params.mjs /tmp/brick-p8d-onemap.mjs
      - name: 8D.14 require isolated fail-closed history and WebSocket rate guards
        run: |
          npx --no-install esbuild src/worker-p8b.ts --bundle --format=esm --platform=node --target=node22 --alias:cloudflare:workers=./scripts/phase8d-cloudflare-workers-shim.mjs --outfile=/tmp/brick-p8d-prod-worker.mjs
          node scripts/test-phase8d-parent-read-rate.mjs /tmp/brick-p8d-prod-worker.mjs
      - name: 8D.12 reject cross-site Origin on every known parent mutation
        run: |
          npx --no-install esbuild src/worker-p8b.ts --bundle --format=esm --platform=node --target=node22 --alias:cloudflare:workers=./scripts/phase8d-cloudflare-workers-shim.mjs --outfile=/tmp/brick-p8d-prod-worker.mjs
          node scripts/test-phase8d-global-csrf.mjs /tmp/brick-p8d-prod-worker.mjs
      - name: 8D.10 browser production and dev WebSocket device-switch, terminal revoke and reconnect
        run: |
          npx --no-install esbuild src/parent-v8.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-prod-parent.mjs
          npx --no-install esbuild src/parent-v7-live.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-dev-parent.mjs
          node scripts/test-phase8d-browser-ws-switch.mjs /tmp/brick-p8d-prod-parent.mjs /tmp/brick-p8d-dev-parent.mjs
      - name: 8D.10 full Worker websocket auth, Origin, internal lease and device scope
        run: |
          npx --no-install esbuild src/worker-p8b.ts --bundle --format=esm --platform=node --target=node22 --alias:cloudflare:workers=./scripts/phase8d-cloudflare-workers-shim.mjs --outfile=/tmp/brick-p8d-prod-worker.mjs
          node scripts/test-phase8d-ws-worker-boundary.mjs /tmp/brick-p8d-prod-worker.mjs
      - name: P8D-011 existing WebSocket expiry, hibernation and revocation negative regression
        run: |
          npx --no-install esbuild src/device-do.ts --bundle --format=esm --platform=node --target=node22 --alias:cloudflare:workers=./scripts/phase8d-cloudflare-workers-shim.mjs --outfile=/tmp/brick-p8d-do.mjs
          node scripts/test-phase8d-ws-session.mjs /tmp/brick-p8d-do.mjs
      - name: 8D.11 production Cloudflare Access RS256 JWT adversarial checks
        run: |
          npx --no-install esbuild src/access-auth.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-access-jwt.mjs
          node scripts/test-phase8d-cloudflare-access-jwt.mjs /tmp/brick-p8d-access-jwt.mjs
      - name: P8D-003 development credential and session security regression
        run: |
          node scripts/test-phase8d-development-login-source.mjs
          npx --no-install esbuild src/dev-parent-auth.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-dev-auth.mjs
          node scripts/test-phase8d-development-login.mjs /tmp/brick-p8d-dev-auth.mjs
          node scripts/test-phase8d-dev-multi-session.mjs /tmp/brick-p8d-dev-auth.mjs
      - name: 8D.8 production SQLite schema and constraints, including revocation history
        run: node --disable-warning=ExperimentalWarning scripts/test-phase8d-sqlite-integrity.mjs
      - name: P8D-025 exactly-once bounded backend incident alerting
        run: |
          npx --no-install esbuild src/phase5-ops.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-ops.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-incident-alert-race.mjs /tmp/brick-p8d-ops.mjs
      - name: P8D-026 truthful delivery metric on extreme signed sequence jumps
        run: |
          npx --no-install esbuild src/phase5-ops.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-ops.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-delivery-denominator-sqlite.mjs /tmp/brick-p8d-ops.mjs
      - name: 8D.17 validate retention merge preserves all existing R2 lifecycle rules
        run: node scripts/test-phase8d-r2-lifecycle-merge.mjs
      - name: 8D.17 validate bounded R2 raw/trusted 30/90-day lifecycle target
        run: node scripts/test-phase8d-r2-lifecycle-target.mjs
      - name: 8D.17 per-device retention, cross-family isolation and crash/health/audit cleanup
        run: |
          npx --no-install esbuild src/phase4.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-retention.mjs
          npx --no-install esbuild src/phase5c.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-phase5c.mjs
          npx --no-install esbuild src/phase5-ops.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-ops.mjs
          node --disable-warning=ExperimentalWarning scripts/test-phase8d-retention-sqlite.mjs /tmp/brick-p8d-retention.mjs /tmp/brick-p8d-phase5c.mjs /tmp/brick-p8d-ops.mjs
      - name: P8D-013 redaction of identifiers in D1 audit path and detail
        run: |
          npx --no-install esbuild src/phase5c.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-phase5c.mjs
          node scripts/test-phase8d-audit-path-privacy.mjs /tmp/brick-p8d-phase5c.mjs
      - name: P8D-002 require atomic cross-table D1 snapshot under synthetic concurrent mutation
        run: |
          npx --no-install esbuild src/backup-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-backup.mjs
          node scripts/test-phase8d-atomic-backup.mjs /tmp/brick-p8d-backup.mjs
      - name: P8D-002 versioned backup restore regression
        run: |
          npx --no-install esbuild src/backup-restore-v6.ts --bundle --format=esm --platform=node --target=node22 --outfile=/tmp/brick-p8d-restore.mjs
          node scripts/test-backup-restore.mjs /tmp/brick-p8d-restore.mjs
          node scripts/test-phase8d-isolated-sqlite-restore.mjs /tmp/brick-p8d-restore.mjs
      - name: Verify strict schema 016 transform and repeatable migration on SQLite
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test-phase8d-schema-compat.mjs --write-sql
          db=/tmp/brick-phase8d-schema-replay.sqlite
          for file in \
            schema/001_init.sql \
            schema/002_phase2_health.sql \
            schema/003_phase4_safety.sql \
            schema/004_phase5_operations.sql \
            schema/007_phase5c_hardening.sql \
            schema/008_v1_phase2_evidence.sql \
            schema/009_v1_phase5_fusion.sql \
            schema/010_phase5b_closure.sql \
            schema/011_v1_phase6_location_control.sql \
            schema/015_phase8_device_identity.sql; do
            sqlite3 "$db" < "$file"
          done
          sqlite3 "$db" < /tmp/brick-p8d-016-columns.sql
          for iteration in first repeat; do
            sqlite3 "$db" < /tmp/brick-p8d-016-remainder.sql
            sqlite3 "$db" < schema/017_p8b_provider_rate.sql
            sqlite3 "$db" < schema/018_p8b_pin_pairing.sql
          done
          actual="$(sqlite3 "$db" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('device_live_track_control','device_wifi_schedules','device_wifi_schedule_result','device_capability_profile','screen_time_daily','commute_summaries','provider_cache','provider_rate_window','pairing_pin_sessions')")"
          test "$actual" = "9"
