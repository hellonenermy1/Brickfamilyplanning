name: Brick P6 — Account Prerequisite Preflight

on:
  pull_request:
    branches: [v1-p6-device-control-cloud]

permissions:
  contents: read

jobs:
  cloudflare-prerequisites:
    name: Cloudflare D1 R2 Queues Access prerequisite check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check all required Cloudflare account capabilities
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'MISSING: CLOUDFLARE_API_TOKEN'; exit 1; }
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const API = 'https://api.cloudflare.com/client/v4';
          async function call(path) {
            try {
              const r = await fetch(API + path, { headers: { authorization: `Bearer ${token}` } });
              const b = await r.json().catch(() => ({}));
              return { ok: r.ok && b.success !== false, status: r.status, body: b };
            } catch (e) {
              return { ok: false, status: 0, body: { errors: [{ message: String(e) }] } };
            }
          }
          const accounts = await call('/accounts?per_page=50');
          if (!accounts.ok || !Array.isArray(accounts.body.result) || accounts.body.result.length !== 1) {
            console.error(`ACCOUNT: FAIL — token must expose exactly one account for unattended qualification (visible=${Array.isArray(accounts.body.result) ? accounts.body.result.length : 'unknown'})`);
            process.exit(1);
          }
          const id = accounts.body.result[0].id;
          const checks = [
            ['D1', `/accounts/${id}/d1/database?per_page=1`],
            ['R2', `/accounts/${id}/r2/buckets?per_page=1`],
            ['QUEUES', `/accounts/${id}/queues?per_page=1`],
            ['ZERO_TRUST_ACCESS', `/accounts/${id}/access/organizations`]
          ];
          let failed = false;
          for (const [name, path] of checks) {
            const x = await call(path);
            if (x.ok) {
              console.log(`${name}: PASS`);
            } else {
              failed = true;
              const errors = Array.isArray(x.body?.errors) ? x.body.errors.map(e => `${e.code ?? ''} ${e.message ?? ''}`.trim()).join(' | ') : JSON.stringify(x.body);
              console.error(`${name}: FAIL — HTTP ${x.status} ${errors}`);
            }
          }
          if (failed) process.exit(1);
          console.log('CLOUDFLARE_PREREQUISITES_PASS');
          NODE

  android-signing-prerequisites:
    name: Android stable signing secret prerequisite check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KEYSTORE_B64: ${{ secrets.BRICK_ANDROID_KEYSTORE_B64 }}
      KEYSTORE_PASSWORD: ${{ secrets.BRICK_ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.BRICK_ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.BRICK_ANDROID_KEY_PASSWORD }}
    steps:
      - name: Report missing signing secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for pair in \
            "BRICK_ANDROID_KEYSTORE_B64:KEYSTORE_B64" \
            "BRICK_ANDROID_KEYSTORE_PASSWORD:KEYSTORE_PASSWORD" \
            "BRICK_ANDROID_KEY_ALIAS:KEY_ALIAS" \
            "BRICK_ANDROID_KEY_PASSWORD:KEY_PASSWORD"; do
            name="${pair%%:*}"
            var="${pair##*:}"
            if [ -n "${!var:-}" ]; then
              echo "$name: PASS"
            else
              echo "$name: MISSING"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo 'ANDROID_SIGNING_PREREQUISITES_PASS'
