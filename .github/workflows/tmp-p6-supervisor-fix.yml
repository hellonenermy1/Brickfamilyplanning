name: TEMP Phase 6 supervisor recovery fix

on:
  push:
    branches: [v1-p6-device-control-android]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch recovery and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/brick/safety/location/BrickLocationService.kt')
          text = p.read_text()
          old = '''            if (ManagedPolicy.isDeviceOwner(this) && locationEnabled != desiredLocationEnabled) {
                runCatching { ManagedPolicy.apply(this) }
            }
'''
          new = '''            // Reconcile any desired/actual mismatch regardless of Device Owner state. ManagedPolicy
            // uses Device Owner first when available and otherwise retries the optional typed
            // privileged bridge. This makes a temporary Shizuku outage self-heal after reconnect.
            if (locationEnabled != desiredLocationEnabled) {
                runCatching { ManagedPolicy.apply(this) }
            }
'''
          if text.count(old) != 1:
              raise SystemExit('expected exact supervisor block once')
          p.write_text(text.replace(old, new))
          PY
          rm .github/workflows/tmp-p6-supervisor-fix.yml
          git diff --check
          git diff --exit-code --quiet && { echo 'No change produced' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/brick/safety/location/BrickLocationService.kt .github/workflows/tmp-p6-supervisor-fix.yml
          git commit -m 'fix(p6): retry location control reconciliation after bridge recovery'
          git push origin HEAD:v1-p6-device-control-android
