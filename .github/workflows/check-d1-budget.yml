name: Check Brick D1 Free-Tier Budget

on:
  push:
    branches: [phase5c-hardening-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Type-check optimized D1 compatibility layer
        run: npm run typecheck
      - name: Validate D1 steady-state write budget and SQL guard
        run: |
          npx esbuild src/d1-r2-compat.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-d1-compat.mjs
          npx esbuild src/phase5c-d1-guard.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-d1-guard.mjs
          node scripts/test-d1-budget.mjs file:///tmp/brick-d1-compat.mjs file:///tmp/brick-d1-guard.mjs
