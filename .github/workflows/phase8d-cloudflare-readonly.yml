name: "Brick Phase 8D — Cloudflare READ-ONLY Account Attestation"
on:
  workflow_dispatch:
  push:
    branches: [v1-p8d-backend-deep-audit]
    paths:
      - 'scripts/phase8d-cloudflare-readonly.mjs'
      - 'scripts/test-phase8d-cloudflare-readonly.mjs'
      - 'scripts/phase8d-live-parent-denial.mjs'
      - 'scripts/test-phase8d-live-parent-denial.mjs'
      - '.github/workflows/phase8d-cloudflare-readonly.yml'
permissions:
  contents: read
concurrency:
  group: brick-phase8d-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  read-only-test:
    name: "Seven audit assertions — synthetic negative/positive contract"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - run: node scripts/test-phase8d-cloudflare-readonly.mjs
      - run: node scripts/test-phase8d-live-parent-denial.mjs
  live-metadata:
    name: "Cloudflare seven read-only metadata checks (live required)"
    needs: read-only-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Use a dedicated scoped READ ONLY token, never the existing deployment token.
    # No R2 objects, user D1 rows, raw logs, Worker source or secret values are accessed.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Inspect actual Cloudflare deployment and configuration (GET only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/phase8d-cloudflare-readonly.mjs
      - name: Generate non-mutating remediation plan for actual LIVE account results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s phase8d-live-readonly-result.json ]; then
            echo "Cloudflare attestation report was not produced; no remediation is authorized"
            exit 1
          fi
          # Exit 2 signifies unresolved drift, never an automatic repair or a PASS.
          code=0
          node scripts/phase8d-remediation-plan.mjs phase8d-live-readonly-result.json || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          test -s phase8d-remediation-plan.json
      - name: Attach sanitized PASS/DRIFT/BLOCKED audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-phase8d-cloudflare-readonly-${{ github.sha }}
          path: |
            phase8d-live-readonly-result.json
            phase8d-remediation-plan.json
          if-no-files-found: warn
          retention-days: 14

  parent-public-denial:
    name: "Live parent endpoints reject unauthenticated requests (no bodies)"
    needs: read-only-test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: GET-only actual Workers.dev parent auth smoke (no family data)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_READ_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/phase8d-live-parent-denial.mjs
      - name: Preserve sanitized public response status evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-phase8d-parent-denial-${{ github.sha }}
          path: phase8d-parent-denial-result.json
          if-no-files-found: warn
          retention-days: 14
