name: Brick V1 Phase 8 — Device Owner Reboot-Safe Retirement Emulator

on:
  push:
    branches: [v1-p8-android-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-owner-lifecycle:
    name: Pre-setup DO -> Stage 1 -> reboot -> automatic Stage 2 -> Stage 3 UI
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'

      - name: Locate Android SDK and AVD tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          AVD_HOME="$RUNNER_TEMP/brick-p8-do-avd"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER_PATH" >> "$GITHUB_ENV"
          echo "ADB=$SDK_ROOT/platform-tools/adb" >> "$GITHUB_ENV"
          echo "EMULATOR=$SDK_ROOT/emulator/emulator" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"

      - name: Install clean AOSP SDK image and build test APKs
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'emulator' 'system-images;android-35;default;x86_64'
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Boot fresh AOSP emulator in true pre-provisioning state
        shell: bash
        run: |
          set -euo pipefail
          echo no | "$AVDMANAGER" create avd --force --name brick-p8-do --package 'system-images;android-35;default;x86_64' --device 'pixel_6'
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          nohup "$EMULATOR" -avd brick-p8-do -wipe-data -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/brick-p8-do-emulator.log 2>&1 &
          "$ADB" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"

          # DevicePolicyManagerService caches setup/provisioning state during boot. Changing these
          # settings after the service has initialized is not enough: reboot once so the policy
          # service itself starts in the pre-setup state that a real zero-touch/ADB provisioning
          # flow requires.
          "$ADB" shell settings put secure user_setup_complete 0
          "$ADB" shell settings put global device_provisioned 0
          "$ADB" reboot
          "$ADB" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          test "$("$ADB" shell settings get secure user_setup_complete | tr -d '\r')" = "0"
          test "$("$ADB" shell settings get global device_provisioned | tr -d '\r')" = "0"
          "$ADB" shell dumpsys account | tee /tmp/p8-do-accounts-before.txt
          grep -F 'Accounts: 0' /tmp/p8-do-accounts-before.txt >/dev/null
          "$ADB" shell dpm list-owners | tee /tmp/p8-do-owners-initial.txt
          ! grep -F 'com.brick.safety' /tmp/p8-do-owners-initial.txt >/dev/null

      - name: Install Brick and provision real Device Owner before setup completes
        shell: bash
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          "$ADB" install -t "$APP_APK"
          "$ADB" shell dumpsys account | tee /tmp/p8-do-accounts-after-install.txt
          grep -F 'Accounts: 0' /tmp/p8-do-accounts-after-install.txt >/dev/null
          "$ADB" shell dpm set-device-owner com.brick.safety/.managed.BrickDeviceAdminReceiver | tee /tmp/p8-do-set-owner.txt
          "$ADB" shell dpm list-owners | tee /tmp/p8-do-owners-before.txt
          grep -F 'com.brick.safety' /tmp/p8-do-owners-before.txt >/dev/null

          "$ADB" shell settings put secure user_setup_complete 1
          "$ADB" shell settings put global device_provisioned 1
          test "$("$ADB" shell settings get secure user_setup_complete | tr -d '\r')" = "1"
          test "$("$ADB" shell settings get global device_provisioned | tr -d '\r')" = "1"
          "$ADB" install -t "$TEST_APK"

      - name: Execute Stage 1 only and prove ownership remains until after durable disarm
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" shell am instrument -w \
            -e p8RetirementMode disarm \
            -e class 'com.brick.safety.beta.Phase8BetaSafetyInstrumentedTest#testExternalRebootDisarm' \
            com.brick.safety.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/p8-stage1.txt
          grep -E 'OK \(1 test\)|OK \(1 tests\)|OK \(' /tmp/p8-stage1.txt >/dev/null
          "$ADB" shell dpm list-owners | tee /tmp/p8-do-owners-stage1.txt
          grep -F 'com.brick.safety' /tmp/p8-do-owners-stage1.txt >/dev/null

      - name: Reboot across Stage 1 and require automatic Stage 2 recovery
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" reboot
          "$ADB" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          for i in $(seq 1 60); do
            owners="$("$ADB" shell dpm list-owners 2>&1 | tr -d '\r')"
            if ! grep -Fq 'com.brick.safety' <<<"$owners"; then break; fi
            sleep 2
          done
          "$ADB" shell dpm list-owners | tee /tmp/p8-do-owners-after-reboot.txt
          ! grep -F 'com.brick.safety' /tmp/p8-do-owners-after-reboot.txt >/dev/null

      - name: Verify Stage 2 persisted and Stage 3 only requests Android uninstall UI
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" shell am instrument -w \
            -e p8RetirementMode verify \
            -e class 'com.brick.safety.beta.Phase8BetaSafetyInstrumentedTest#testExternalRebootRecoveryAndStage3Request' \
            com.brick.safety.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/p8-stage23.txt
          grep -E 'OK \(1 test\)|OK \(1 tests\)|OK \(' /tmp/p8-stage23.txt >/dev/null
          "$ADB" shell pm path com.brick.safety | grep -F 'package:' >/dev/null

      - name: Prove package is removable after management release
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" shell pm uninstall com.brick.safety | tee /tmp/p8-do-uninstall.txt
          grep -F 'Success' /tmp/p8-do-uninstall.txt >/dev/null

      - name: Preserve Device Owner diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          mkdir -p p8-do-failure
          cp /tmp/brick-p8-do-emulator.log p8-do-failure/emulator.log || true
          for f in accounts-before accounts-after-install set-owner owners-initial owners-before owners-stage1 owners-after-reboot stage1 stage23 do-uninstall; do
            cp "/tmp/p8-do-$f.txt" "p8-do-failure/$f.txt" 2>/dev/null || cp "/tmp/p8-$f.txt" "p8-do-failure/$f.txt" 2>/dev/null || true
          done
          if timeout 10s "$ADB" get-state >/dev/null 2>&1; then
            timeout 10s "$ADB" shell settings get secure user_setup_complete > p8-do-failure/user-setup-complete.txt 2>&1 || true
            timeout 10s "$ADB" shell settings get global device_provisioned > p8-do-failure/device-provisioned.txt 2>&1 || true
            timeout 10s "$ADB" shell dumpsys account > p8-do-failure/accounts-current.txt 2>&1 || true
            timeout 10s "$ADB" shell dpm list-owners > p8-do-failure/owners-current.txt 2>&1 || true
            timeout 15s "$ADB" logcat -d > p8-do-failure/logcat.txt 2>&1 || true
          else
            printf 'No responsive emulator was available at failure collection time.\n' > p8-do-failure/no-device.txt
          fi

      - name: Upload Device Owner failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-phase8-device-owner-reboot-retirement-failure
          path: p8-do-failure/
          if-no-files-found: warn
          retention-days: 14
