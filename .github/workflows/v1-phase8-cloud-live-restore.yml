name: Brick V1 Phase 8 — Live D1 Destructive Restore Rehearsal

on:
  workflow_dispatch:
    inputs:
      cloudflare_account_id:
        description: 'Cloudflare Account ID for a disposable D1 restore rehearsal'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: brick-v1-phase8-live-d1-restore
  cancel-in-progress: false

jobs:
  live-d1-restore:
    name: Disposable D1 seed -> destructive mutation -> Time Travel restore -> exact compare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
      BRICK_RESTORE_STATE_PATH: phase8-live-restore-state.json
      BRICK_RESTORE_EVIDENCE_PATH: phase8-live-restore-evidence.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Require exact Phase 8 cloud branch and credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'v1-p8-cloud-hardening'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          node --check scripts/phase8-live-d1-restore.mjs

      - name: Execute disposable live D1 destructive restore rehearsal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/phase8-live-d1-restore.mjs

      - name: Verify non-secret restore evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s "$BRICK_RESTORE_EVIDENCE_PATH"
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const e = JSON.parse(fs.readFileSync(process.env.BRICK_RESTORE_EVIDENCE_PATH, 'utf8'));
          if (e.sourceGitSha !== process.env.GITHUB_SHA) throw new Error('restore evidence SHA mismatch');
          if (e.exactStateComparison !== true) throw new Error('exact restore comparison was not proven');
          if (e.productionDatabaseTouched !== false || e.fixtureOnly !== true) throw new Error('rehearsal safety boundary missing');
          if (!Array.isArray(e.restoredCriticalClasses) || e.restoredCriticalClasses.length < 5) throw new Error('critical restore classes incomplete');
          if (!e.bookmark || !e.undoBookmark) throw new Error('Time Travel bookmarks missing');
          if (!Number.isFinite(e.databaseFileSizeBytes) || e.databaseFileSizeBytes < 0) throw new Error('D1 size measurement missing');
          console.log('Disposable live D1 restore evidence verified.');
          NODE

      - name: Delete disposable D1 database
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          if [ ! -s "$BRICK_RESTORE_STATE_PATH" ]; then
            echo 'No disposable database was created.'
            exit 0
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const state = JSON.parse(fs.readFileSync(process.env.BRICK_RESTORE_STATE_PATH, 'utf8'));
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account || !state.databaseId) process.exit(0);
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${state.databaseId}`, {
            method: 'DELETE',
            headers: { authorization: `Bearer ${token}` },
            signal: AbortSignal.timeout(30_000)
          });
          if (response.ok) {
            console.log('Disposable D1 database deleted.');
            process.exit(0);
          }
          const body = await response.text().catch(() => '');
          console.error(`Disposable D1 cleanup failed: HTTP ${response.status} ${body.slice(0, 500)}`);
          process.exit(1);
          NODE

      - name: Mark cleanup in evidence
        if: always()
        shell: bash
        run: |
          if [ -s "$BRICK_RESTORE_EVIDENCE_PATH" ]; then
            node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const p = process.env.BRICK_RESTORE_EVIDENCE_PATH;
          const e = JSON.parse(fs.readFileSync(p, 'utf8'));
          e.cleanupAttempted = true;
          fs.writeFileSync(p, JSON.stringify(e, null, 2));
          NODE
          fi

      - name: Upload non-secret live restore evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-phase8-live-d1-restore-${{ github.sha }}-${{ github.run_id }}
          path: |
            phase8-live-restore-evidence.json
            phase8-live-restore-state.json
          if-no-files-found: warn
          retention-days: 30
