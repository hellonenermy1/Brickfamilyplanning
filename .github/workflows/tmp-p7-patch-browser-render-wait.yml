name: TEMP Phase 7 Browser Outage Console Patch

on:
  push:
    branches: [v1-p7-cloud-ux]
    paths:
      - '.github/workflows/tmp-p7-patch-browser-render-wait.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1-p7-cloud-ux
          fetch-depth: 0

      - name: Apply guarded intentional-offline console handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-phase7-development-browser.mjs')
          s = p.read_text()
          old1 = """    // Simulate a real network loss and require automatic recovery without page reload/manual sync.\n    await cdp.send('Emulation.setDeviceMetricsOverride', { width: 1440, height: 1100, deviceScaleFactor: 1, mobile: false }, pageSession);\n    await cdp.send('Network.emulateNetworkConditions', { offline: true, latency: 0, downloadThroughput: 0, uploadThroughput: 0, connectionType: 'none' }, pageSession);\n"""
          new1 = """    // Simulate a real network loss and require automatic recovery without page reload/manual sync.\n    // Record the console boundary so only ERR_INTERNET_DISCONNECTED generated by this intentional\n    // outage is exempted later; the same error before this point remains a test failure.\n    const consoleErrorCountBeforeIntentionalOffline = consoleErrors.length;\n    await cdp.send('Emulation.setDeviceMetricsOverride', { width: 1440, height: 1100, deviceScaleFactor: 1, mobile: false }, pageSession);\n    await cdp.send('Network.emulateNetworkConditions', { offline: true, latency: 0, downloadThroughput: 0, uploadThroughput: 0, connectionType: 'none' }, pageSession);\n"""
          old2 = """    const actionableConsoleErrors = consoleErrors.filter(x => x && !/favicon[^\\n]*404|Failed to load resource[^\\n]*404/i.test(x));\n"""
          new2 = """    const actionableConsoleErrors = consoleErrors.filter((x, index) => {\n      if (!x) return false;\n      if (/favicon[^\\n]*404|Failed to load resource[^\\n]*404/i.test(x)) return false;\n      if (index >= consoleErrorCountBeforeIntentionalOffline && /Failed to load resource: net::ERR_INTERNET_DISCONNECTED/i.test(x)) return false;\n      return true;\n    });\n"""
          if s.count(old1) != 1: raise SystemExit(f'outage anchor count={s.count(old1)}')
          if s.count(old2) != 1: raise SystemExit(f'console filter anchor count={s.count(old2)}')
          s = s.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(s)
          PY
          node --check scripts/verify-phase7-development-browser.mjs
          git diff --check

      - name: Commit verifier fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-phase7-development-browser.mjs
          git commit -m 'test(p7): ignore only intentional offline console noise'
          git push origin HEAD:v1-p7-cloud-ux
