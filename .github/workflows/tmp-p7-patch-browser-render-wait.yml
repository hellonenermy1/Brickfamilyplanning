name: TEMP Phase 7 Browser Render Wait Patch

on:
  push:
    branches: [v1-p7-cloud-ux]
    paths:
      - '.github/workflows/tmp-p7-patch-browser-render-wait.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1-p7-cloud-ux
          fetch-depth: 0

      - name: Apply exact guarded wait before Phase 7 render assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/verify-phase7-development-browser.mjs')
          s = p.read_text()
          needle = """    const rendered = await evaluate(`(() => ({\n"""
          if s.count(needle) != 1:
              raise SystemExit(f'Expected exactly one rendered-state assertion anchor, found {s.count(needle)}')
          wait = """    await waitFor(async () => {\n      const state = await evaluate(`(() => ({\n        confidence:document.querySelector('#p7Confidence')?.textContent?.trim()||'',\n        geometry:document.querySelector('#p7Geometry')?.textContent?.trim()||'',\n        source:document.querySelector('#p7PresentationSource')?.textContent?.trim()||'',\n        positionHealth:document.querySelector('#p7PositionHealthSummary')?.textContent?.trim()||'',\n        gpsActual:document.querySelector('#gpsActual')?.textContent?.trim()||'',\n        gpsAck:document.querySelector('#gpsAck')?.textContent?.trim()||'',\n        gpsObserved:document.querySelector('#gpsObserved')?.textContent?.trim()||''\n      }))()`);\n      const ready = value => Boolean(value && value !== '—');\n      return ready(state.confidence) && ready(state.geometry) && ready(state.source) &&\n        ready(state.positionHealth) && !/^Waiting/i.test(state.positionHealth) &&\n        ready(state.gpsActual) && ready(state.gpsAck) && ready(state.gpsObserved);\n    }, { timeoutMs: 25_000, label: 'authenticated Phase 7 state render' });\n\n"""
          p.write_text(s.replace(needle, wait + needle, 1))
          PY
          node --check scripts/verify-phase7-development-browser.mjs
          git diff --check
          git diff --exit-code -- scripts/verify-phase7-development-browser.mjs && { echo 'Patch made no change' >&2; exit 1; } || true

      - name: Commit browser harness fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify-phase7-development-browser.mjs
          git commit -m 'test(p7): wait for authenticated state render in Chrome'
          git push origin HEAD:v1-p7-cloud-ux
