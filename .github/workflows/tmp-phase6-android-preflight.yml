name: Temporary Phase 6 Android preflight

on:
  push:
    branches: [v1-p6-device-control-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Generate exact Gradle lock
        run: gradle --no-daemon :app:dependencies --write-locks
      - name: Commit exact generated lock when needed
        shell: bash
        run: |
          if git diff --quiet -- app/gradle.lockfile; then
            echo "Gradle lock is already canonical."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/gradle.lockfile
            git commit -m "build: refresh Phase 6 Gradle dependency lock"
            git push origin HEAD:v1-p6-device-control-android
          fi
          git diff --exit-code -- app/gradle.lockfile
      - name: Build debug and instrumentation APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleAndroidTest
      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug
      - name: Run JVM unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Create auditable source snapshot
        shell: bash
        run: |
          tar --exclude=.git --exclude=.gradle --exclude='*/build' --exclude='*/build/*' -czf /tmp/phase6-android-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: phase6-android-source
          path: /tmp/phase6-android-source.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Upload build and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-android-preflight-evidence
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
            app/build/reports/tests
          if-no-files-found: warn
          retention-days: 1
