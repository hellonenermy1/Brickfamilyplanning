name: Phase 6 One-Shot Refresh Lockfile

on:
  push:
    branches: [phase6-cloud-final-audit]
    paths: [.github/workflows/phase6-refresh-lock.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase6-cloud-final-audit
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Regenerate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Phase 6: lock QR dependency graph'
          git push origin HEAD:phase6-cloud-final-audit
