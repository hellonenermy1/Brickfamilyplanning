name: Brick V1 Phase 8 — Cloud Hardening CI

on:
  push:
    branches: [v1-p8-cloud-hardening]
  pull_request:
    branches: [v1-p8-cloud-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-hardening:
    name: Phase 8 cloud security, durability, privacy, supply-chain and retained regression
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify exact Phase 7 cloud baseline is retained
        run: git merge-base --is-ancestor 820fb8974ae185d74b4963b31b18a7fa0eafedf6 HEAD

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm

      - name: Install exactly locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Phase 8 dependency and workflow supply-chain gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE 'uses:[[:space:]]+[^[:space:]#]+@v[0-9]+' .github/workflows/v1-phase8-*.yml
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const exact = /^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/;
          const forbidden = /(analytics|amplitude|mixpanel|appsflyer|facebook.*sdk|google-ads|doubleclick|segment(?:-|$)|sentry)/i;
          for (const group of ['dependencies', 'devDependencies']) {
            for (const [name, version] of Object.entries(pkg[group] ?? {})) {
              if (!exact.test(String(version))) throw new Error(`non-exact ${group} version: ${name}=${version}`);
              if (forbidden.test(name)) throw new Error(`telemetry/ads dependency forbidden in Brick Phase 8: ${name}`);
              const locked = lock.packages?.[`node_modules/${name}`]?.version;
              if (locked !== version) throw new Error(`package-lock mismatch for ${name}: package.json=${version}, lock=${locked}`);
            }
          }
          if (lock.lockfileVersion !== 3) throw new Error(`unexpected npm lockfile version: ${lock.lockfileVersion}`);
          console.log('Phase 8 exact dependency and lock consistency gate OK');
          NODE

      - name: Typecheck and build retained parent assets
        run: |
          npm run build:parent-assets
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit

      - name: Retain Phase 7 parent/health/live/safety contracts
        run: |
          node scripts/check-phase7-parent-presentation.mjs
          node scripts/check-phase7-health-presentation.mjs
          node scripts/check-phase7-live-sync.mjs
          node scripts/check-phase7-safety-quality.mjs

      - name: Run full retained Phase 2-6 durability/security/privacy regression
        run: bash scripts/phase6-cloud-regression.sh

      - name: Phase 8 same-origin parent mutation tests
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild src/dev-parent-auth.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-dev-parent-auth-p8.mjs
          node scripts/test-phase8-parent-origin.mjs /tmp/brick-dev-parent-auth-p8.mjs

      - name: Phase 8 development architecture truth gate
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"main": "src/worker-v10.ts"' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"r2_buckets"' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"queues"' wrangler.development.template.jsonc >/dev/null
          ! grep -F 'CF_ACCESS_' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"triggers"' wrangler.development.template.jsonc >/dev/null
          grep -F '"main": "src/worker-v9.ts"' wrangler.template.jsonc >/dev/null
          ! grep -F 'worker-v10' wrangler.template.jsonc >/dev/null

          # Phase 8 has no WebSocket transport today. Treat that requirement as VERIFIED UNSUPPORTED,
          # not as a fake auth test. A future endpoint must remove this gate and add real auth tests.
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = "\n".join(
              p.read_text(encoding="utf-8", errors="ignore")
              for root in (Path("src"), Path("web"))
              for p in root.rglob("*") if p.is_file()
          )
          patterns = [
              r"\bWebSocketPair\b",
              r"\bnew\s+WebSocket\s*\(",
              r"(?i)\bupgrade\b.{0,80}\bwebsocket\b",
          ]
          hits = [pattern for pattern in patterns if re.search(pattern, text, flags=re.S)]
          if hits:
              raise SystemExit(f"WebSocket transport appeared without Phase 8 auth qualification: {hits}")
          print("Phase 8 WebSocket surface: VERIFIED UNSUPPORTED")
          PY

      - name: Phase 8 parent session security source gate
        shell: bash
        run: |
          set -euo pipefail
          auth=src/dev-parent-auth.ts
          grep -F 'HttpOnly; Secure; SameSite=Strict' "$auth" >/dev/null
          grep -F 'devParentOriginAllowed(req)' "$auth" >/dev/null
          grep -F 'constantTimeEqual' "$auth" >/dev/null
          grep -F 'PARENT_LOGIN_RATE' "$auth" >/dev/null
          grep -F 'headers.delete(INTERNAL_HEADER)' "$auth" >/dev/null
          grep -F 'headers.set(INTERNAL_HEADER, INTERNAL_VALUE)' "$auth" >/dev/null

      - name: Phase 8 source privacy / accidental telemetry gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -nE '(google-analytics\.com|googletagmanager\.com|doubleclick\.net|api\.segment\.io|api\.amplitude\.com|api\.mixpanel\.com)' src web
          node scripts/audit-privacy.mjs

      - name: Dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high
