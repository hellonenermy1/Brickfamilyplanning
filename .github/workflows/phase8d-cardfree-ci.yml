name: Phase 8D D1 storage and recovery audit (no cloud writes)
on:
  push:
    branches: [audit/phase8d-d1-qualification]
    paths: ['src/**', 'scripts/**', 'schema/**', '.github/workflows/phase8d-cardfree-ci.yml']
  pull_request:
    branches: [beta/backend-portal]
    paths: ['src/**', 'scripts/**', 'schema/**', '.github/workflows/phase8d-cardfree-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase8d-cardfree-${{ github.ref }}
  cancel-in-progress: false
jobs:
  d1-storage-and-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Beta provisioner and shared compatibility schema syntax
        run: |
          node --check scripts/setup-beta-d1.mjs
          node --check scripts/ensure-beta-d1-columns.mjs
          node --check scripts/beta-compat-columns.mjs
      - run: npm run build:parent-assets
      - name: D1 object read integrity and atomic conditional-write regressions
        run: node scripts/test-phase8d-d1-object-integrity.mjs
      - name: Protected off-platform archive authentication identity and CLI
        run: node scripts/test-phase8d-protected-backup.mjs
      - name: Destroy source and recover both D1 stores and beta DO from encrypted package
        run: node scripts/test-phase8d-cardfree-recovery.mjs
      - name: Signed D1 history ACK partial-batch retry and exact revoke race
        run: node scripts/test-phase8d-d1-ack-faults.mjs
      - name: Receipt-age retention cleanup race and bounded statement envelope
        run: node scripts/test-phase8d-d1-retention.mjs
      - name: Scheduler delayed failure and automatic retry
        run: node scripts/test-phase8d-maintenance-failure.mjs
      - name: Versioned leases nested work and release-outage recovery
        run: node scripts/test-phase8d-maintenance-leases.mjs
      - name: Existing beta auth history map and WebSocket regressions
        run: node scripts/test-beta-workerd.mjs
      - name: Original production DO and multi-store recovery regressions
        run: node scripts/test-phase8d-full-store-recovery.mjs
      - name: Existing native production trust-boundary regressions
        run: node scripts/test-phase8d-workerd-integration.mjs
