name: Brick V1 Phase 8 — Android Resource Budget Evidence

on:
  push:
    branches: [v1-p8-android-hardening, v1-p8c-android-deep-audit]
    paths:
      - '.github/workflows/v1-phase8-android-resource-budget.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  emulator-resource-budget:
    name: Sustained-failure CPU, RAM, storage, wakeup and retry guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'

      - name: Locate Android SDK and AVD tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          test -x "$SDKMANAGER_PATH" && test -x "$AVDMANAGER_PATH"
          AVD_HOME="$RUNNER_TEMP/brick-p8-resource-avd"
          mkdir -p "$AVD_HOME" resource-evidence
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER_PATH" >> "$GITHUB_ENV"
          echo "ADB=$SDK_ROOT/platform-tools/adb" >> "$GITHUB_ENV"
          echo "EMULATOR=$SDK_ROOT/emulator/emulator" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"

      - name: Build and boot clean Android 15 emulator
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'emulator' 'system-images;android-35;google_apis;x86_64'
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          echo no | "$AVDMANAGER" create avd --force --name brick-p8-resource --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          nohup "$EMULATOR" -avd brick-p8-resource -wipe-data -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > resource-evidence/emulator.log 2>&1 &
          "$ADB" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          "$ADB" install -t app/build/outputs/apk/debug/app-debug.apk
          "$ADB" install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

          # Android 14+ foreground-location services require the corresponding runtime state. Grant
          # what the testOnly APK normally receives through Device Owner policy before measuring it.
          for permission in \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.ACTIVITY_RECOGNITION \
            android.permission.POST_NOTIFICATIONS \
            android.permission.BLUETOOTH_SCAN \
            android.permission.NEARBY_WIFI_DEVICES; do
            "$ADB" shell pm grant com.brick.safety "$permission" >/dev/null 2>&1 || true
          done
          "$ADB" shell cmd location set-location-enabled true >/dev/null 2>&1 || \
            "$ADB" shell settings put secure location_mode 3 >/dev/null 2>&1 || true

          # Briefly launch the app so Android has a clean foreground-start context before the debug
          # harness requests its location FGS; measurement itself happens after returning Home.
          "$ADB" shell am start -W -n com.brick.safety/.ui.MainActivity > resource-evidence/start-activity.txt
          "$ADB" shell input keyevent KEYCODE_HOME || true

      - name: Seed 1000-row durable failure workload and verify service start
        shell: bash
        run: |
          set -euo pipefail
          "$ADB" logcat -c
          # Android goAsync() still has a broadcast timeout: the previous 1000-row receiver
          # was killed by a real broadcast ANR before its 90-second status poll completed.
          # Instrumentation owns the heavy seeding operation, with no BroadcastReceiver deadline.
          "$ADB" shell am force-stop com.brick.safety >/dev/null 2>&1 || true
          "$ADB" shell am instrument -w \
            -e class com.brick.safety.testing.Phase8ResourceSeedInstrumentedTest \
            com.brick.safety.test/androidx.test.runner.AndroidJUnitRunner | tee resource-evidence/seed-instrumentation.txt
          grep -E 'OK \(1 test\)|OK \(1 tests\)' resource-evidence/seed-instrumentation.txt >/dev/null
          status="$("$ADB" shell run-as com.brick.safety cat files/phase8_resource_seed_status.txt 2>/dev/null | tr -d '\r')"
          printf '%s\n' "$status" | tee resource-evidence/seed-status.txt
          [[ "$status" == seeded=1000* ]]

          # The tracking service is intentionally not exported. ADB/shell cannot start it
          # directly (SecurityException: not exported), and we must NOT export it to satisfy CI.
          # Enter the actual exported Activity, whose normal child-role path starts the private FGS
          # under a valid visible-app Android 15 location permission context.
          "$ADB" shell am start -W -n com.brick.safety/.ui.MainActivity \
            | tee resource-evidence/foreground-activity-start.txt
          for i in $(seq 1 30); do
            if "$ADB" shell dumpsys activity services com.brick.safety | grep -F 'BrickLocationService' >/dev/null; then break; fi
            sleep 1
          done
          "$ADB" shell dumpsys activity services com.brick.safety | grep -F 'BrickLocationService' >/dev/null
          "$ADB" shell input keyevent KEYCODE_HOME >/dev/null

          pid="$("$ADB" shell pidof com.brick.safety | tr -d '\r')"
          test -n "$pid"
          printf '%s\n' "$pid" | tee resource-evidence/pid.txt
          "$ADB" logcat -d | grep -F 'BrickP8Resource' > resource-evidence/resource-harness-log.txt || true

      - name: Measure three-minute sustained-failure resource envelope
        shell: bash
        run: |
          set -euo pipefail
          baseline_pid="$(cat resource-evidence/pid.txt | tr -d '\r')"
          test -n "$baseline_pid"
          hz="$("$ADB" shell getconf CLK_TCK 2>/dev/null | tr -d '\r' || true)"
          [[ "$hz" =~ ^[0-9]+$ ]] || hz=100
          start_ticks="$("$ADB" shell cat /proc/$baseline_pid/stat | awk '{print $14+$15}' | tr -d '\r')"
          [[ "$start_ticks" =~ ^[0-9]+$ ]]
          start_sec="$(date +%s)"

          printf 'sample,rss_kb,cpu_percent,storage_kb\n' > resource-evidence/samples.csv
          max_rss=0
          max_storage=0
          max_cpu_milli=0
          prev_ticks="$start_ticks"
          prev_sample_sec="$start_sec"
          for i in $(seq 1 18); do
            sleep 10
            pid="$("$ADB" shell pidof com.brick.safety | tr -d '\r')"
            test "$pid" = "$baseline_pid"

            mem="$("$ADB" shell dumpsys meminfo com.brick.safety | tr -d '\r')"
            rss="$(printf '%s\n' "$mem" | awk '/TOTAL RSS:/{for (i=1; i<=NF; i++) if ($i=="RSS:") {print $(i+1); exit}}')"
            if ! [[ "$rss" =~ ^[0-9]+$ ]]; then
              rss="$(printf '%s\n' "$mem" | awk '/TOTAL PSS:/{print $3; exit}')"
            fi
            [[ "$rss" =~ ^[0-9]+$ ]]

            # Do not silently report 0% CPU if Android top changes its column layout.
            # Calculate process CPU from /proc/<pid>/stat tick deltas over a timed sample.
            now_ticks="$("$ADB" shell cat /proc/$pid/stat | awk '{print $14+$15}' | tr -d '\r')"
            now_sec="$(date +%s)"
            [[ "$now_ticks" =~ ^[0-9]+$ ]]
            test "$now_ticks" -ge "$prev_ticks"
            delta_sec=$((now_sec - prev_sample_sec))
            test "$delta_sec" -gt 0
            cpu_milli="$(awk -v previous="$prev_ticks" -v now="$now_ticks" -v hz="$hz" -v sec="$delta_sec" 'BEGIN { if (hz <= 0 || sec <= 0) exit 1; printf "%d", ((now-previous)/hz/sec*100)*1000 }')"
            [[ "$cpu_milli" =~ ^[0-9]+$ ]]
            cpu="$(awk -v milli="$cpu_milli" 'BEGIN { printf "%.3f", milli/1000 }')"
            prev_ticks="$now_ticks"
            prev_sample_sec="$now_sec"

            storage="$("$ADB" shell run-as com.brick.safety du -sk . 2>/dev/null | tr -d '\r' | awk 'NR==1 {print $1}')"
            [[ "$storage" =~ ^[0-9]+$ ]]
            printf '%s,%s,%s,%s\n' "$i" "$rss" "$cpu" "$storage" >> resource-evidence/samples.csv
            [ "$rss" -gt "$max_rss" ] && max_rss="$rss"
            [ "$storage" -gt "$max_storage" ] && max_storage="$storage"
            [ "$cpu_milli" -gt "$max_cpu_milli" ] && max_cpu_milli="$cpu_milli"
          done

          end_ticks="$("$ADB" shell cat /proc/$baseline_pid/stat | awk '{print $14+$15}' | tr -d '\r')"
          [[ "$end_ticks" =~ ^[0-9]+$ ]]
          end_sec="$(date +%s)"
          elapsed=$((end_sec - start_sec))
          test "$elapsed" -ge 175
          avg_cpu_milli="$(awk -v s="$start_ticks" -v e="$end_ticks" -v hz="$hz" -v sec="$elapsed" 'BEGIN { if (sec <= 0 || hz <= 0) exit 1; printf "%d", ((e-s)/hz/sec*100)*1000 }')"

          prefs="$("$ADB" shell run-as com.brick.safety cat shared_prefs/brick.xml 2>/dev/null | tr -d '\r' || true)"
          streak="$(printf '%s\n' "$prefs" \
            | grep -o 'name="coreUploadFailureStreak" value="[0-9]*"' \
            | grep -o '[0-9]*' \
            | tail -n 1 || true)"
          if ! [[ "$streak" =~ ^[0-9]+$ ]]; then streak=0; fi
          alarm_lines="$("$ADB" shell dumpsys alarm | grep -c 'com.brick.safety' || true)"

          # CI regression guardrails only. Real phone battery/radio/GNSS/sensor/OEM power belongs to Phase 9.
          test "$max_rss" -le 262144
          test "$max_storage" -le 32768
          test "$max_cpu_milli" -le 80000
          test "$avg_cpu_milli" -le 20000
          test "$streak" -ge 1
          test "$streak" -le 8
          test "$alarm_lines" -le 40

          python3 - <<PY
          import json
          evidence = {
            'version': 4,
            'gitSha': '${GITHUB_SHA}',
            'platform': 'Android 15 API 35 x86_64 emulator',
            'physicalDevice': False,
            'workload': '1000 durable location rows + persistent loopback-refusal upload failure',
            'durationSeconds': int('$elapsed'),
            'processStayedAlive': True,
            'foregroundServiceVerified': True,
            'maxRssKb': int('$max_rss'),
            'maxStorageKb': int('$max_storage'),
            'maxObservedCpuPercent': int('$max_cpu_milli') / 1000,
            'averageProcessCpuPercent': int('$avg_cpu_milli') / 1000,
            'coreUploadFailureStreak': int('$streak'),
            'alarmDumpPackageLineCount': int('$alarm_lines'),
            'guardrails': {
              'maxRssKb': 262144,
              'maxStorageKb': 32768,
              'maxObservedCpuPercent': 80.0,
              'averageProcessCpuPercent': 20.0,
              'failureStreakRangeAfter180s': [1, 8],
              'maxAlarmDumpPackageLines': 40
            },
            'scope': 'CI regression proxy only',
            'notProvenHere': [
              'physical battery drain / mAh',
              'GNSS power and satellite behavior',
              'sensor-hub power and wakeup cost',
              'cellular/Wi-Fi modem and radio power',
              'OPPO/ColorOS OEM background behavior'
            ]
          }
          open('resource-evidence/phase8-android-resource-budget.json','w').write(json.dumps(evidence, indent=2))
          PY

      - name: Prove resource harness cannot ship in release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease --stacktrace
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT2="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          test -x "$AAPT2"
          "$AAPT2" dump xmltree "$APK" --file AndroidManifest.xml > resource-evidence/release-manifest-tree.txt
          ! grep -F 'Phase8ResourceHarnessReceiver' resource-evidence/release-manifest-tree.txt
          ! grep -F 'PHASE8_RESOURCE_SEED' resource-evidence/release-manifest-tree.txt

      - name: Capture inspectable diagnostics
        if: always()
        shell: bash
        run: |
          "$ADB" shell dumpsys meminfo com.brick.safety > resource-evidence/meminfo-final.txt 2>&1 || true
          "$ADB" shell dumpsys batterystats com.brick.safety > resource-evidence/batterystats.txt 2>&1 || true
          "$ADB" shell dumpsys sensorservice | grep -i -C 3 'brick\|com.brick.safety' > resource-evidence/sensorservice-brick.txt 2>&1 || true
          "$ADB" shell dumpsys package com.brick.safety > resource-evidence/package.txt 2>&1 || true
          "$ADB" shell dumpsys activity services com.brick.safety > resource-evidence/services.txt 2>&1 || true
          "$ADB" logcat -d > resource-evidence/logcat.txt 2>&1 || true

      - name: Upload non-secret resource evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-phase8-android-resource-budget-${{ github.sha }}
          path: resource-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish exact-commit Phase 8C status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f "state=$state" \
            -f "context=brick/p8c/resource-budget" \
            -f "description=Phase 8C exact-commit CI: $JOB_STATUS" \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
