name: Brick V1 Phase 6B — Stabilization Qualification

on:
  pull_request:
    branches: [v1-p6-device-control-cloud]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PHASE6B_SHA: 1dc7c815deedd9de05330f4812a5f6abbacd571d
  CLOUD_PHASE6B_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: brick-v1-phase6b-${{ github.event.pull_request.number || github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  cloud:
    name: Phase 2-6B cumulative Cloud security/recovery gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.CLOUD_PHASE6B_SHA }}
      - name: Verify exact Cloud candidate
        run: test "$(git rev-parse HEAD)" = "$CLOUD_PHASE6B_SHA"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Runtime dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Run cumulative Phase 2-6 regressions
        run: bash scripts/phase6-cloud-regression.sh
      - name: Verify Phase 6B control and revocation boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'device_location_control' schema/011_v1_phase6_location_control.sql >/dev/null
          grep -F 'same-origin request required' src/worker-v6.ts >/dev/null
          grep -F 'if (life.revoked_at !== null) return archivedRead(req, env, deviceId, suffix);' src/worker-v6.ts >/dev/null
          grep -F 'parentSetLocationControl' src/worker-v6.ts >/dev/null
          grep -F 'parentSetBleAnchor' src/worker-v6.ts >/dev/null
          grep -F 'validateSafetyReplayWindow' src/worker-v6.ts >/dev/null
          grep -F 'processDeadLetterBatch' src/worker-v6.ts >/dev/null
          grep -F 'snapshotD1ToR2' src/worker-v6.ts >/dev/null
          ! grep -R -E 'remote shell|newProcess\(' src >/dev/null
      - name: Render parent dashboard smoke test
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild src/parent-v6.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-parent-v6b.mjs
          node --input-type=module - <<'NODE'
          const m = await import('file:///tmp/brick-parent-v6b.mjs');
          const html = m.parentV6Html();
          for (const required of [
            'id="gpsOn"','id="gpsOff"','id="gpsDesired"','id="gpsActual"',
            '/location-control','refreshPhase5State','loadLocationControl',
            'phase5StateTimer=setInterval','WebSocket'
          ]) if (!html.includes(required)) throw new Error('missing Phase 6B dashboard behavior: '+required);
          NODE

  android-build:
    name: Android lock/build/lint/unit/release/security gate
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.ANDROID_PHASE6B_SHA }}
      - name: Verify exact Android candidate
        run: test "$(git rev-parse HEAD)" = "$ANDROID_PHASE6B_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER_PATH" && test -x "$SDKMANAGER_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
      - name: Install compile/build SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'
      - name: Prepare optional stable release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BRICK_ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BRICK_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BRICK_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BRICK_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_B64:-}" && -n "${KEYSTORE_PASSWORD:-}" && -n "${KEY_ALIAS:-}" && -n "${KEY_PASSWORD:-}" ]]; then
            keyfile="$RUNNER_TEMP/brick-release.jks"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$keyfile"
            chmod 600 "$keyfile"
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "BRICK_KEYSTORE_PATH=$keyfile" >> "$GITHUB_ENV"
            echo "BRICK_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BRICK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "BRICK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify dependency lock is reproducible
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          gradle --no-daemon :app:dependencies --write-locks
          after="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          test "$before" = "$after"
          git diff --exit-code -- app/gradle.lockfile
      - name: Build debug, instrumentation, unit tests, lint and release
        id: android_build
        shell: bash
        run: |
          set +e
          gradle --no-daemon \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleRelease \
            :app:lintRelease \
            --stacktrace 2>&1 | tee p6b-android-build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Preserve Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6b-android-build-diagnostics-${{ env.ANDROID_PHASE6B_SHA }}
          path: |
            p6b-android-build.log
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify release hardening and Android boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'isMinifyEnabled = true' app/build.gradle.kts >/dev/null
          grep -F 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'android:allowBackup="false"' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'rikka.shizuku.ShizukuProvider' app/src/main/AndroidManifest.xml >/dev/null
          grep -F 'interface IBrickPrivilegedService' app/src/main/aidl/com/brick/safety/privileged/IBrickPrivilegedService.aidl >/dev/null
          grep -F 'attemptSosLocationEnable()' app/src/main/java/com/brick/safety/reliability/ServiceControl.kt >/dev/null
          grep -F 'command.deviceId != deviceId' app/src/main/java/com/brick/safety/location/BrickLocationService.kt >/dev/null
          ! grep -R -F 'newProcess(' app/src/main >/dev/null
          if grep -RniE 'firebase[-_ ]?analytics|google[-_ ]?analytics|googletagmanager|facebook.*pixel|meta.*pixel|mixpanel|amplitude|appsflyer|adjust\.com|doubleclick' app/src/main; then
            echo 'Analytics/ad tracker reference found in child app.' >&2
            exit 1
          fi
      - name: Verify APKs and provenance
        shell: bash
        env:
          RELEASE_AVAILABLE: ${{ steps.signing.outputs.available }}
        run: |
          set -euo pipefail
          mkdir -p p6b-apk-evidence
          debug_apk='app/build/outputs/apk/debug/app-debug.apk'
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -f "$debug_apk"
          test -n "$release_apk" && test -f "$release_apk"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner_bin"
          sha256sum "$debug_apk" "$release_apk" > p6b-apk-evidence/sha256.txt
          {
            echo "android_sha=$ANDROID_PHASE6B_SHA"
            echo "stable_signing_available=$RELEASE_AVAILABLE"
            echo "java=$(java -version 2>&1 | head -n1)"
            echo "gradle=$(gradle --version | grep '^Gradle ' | head -n1)"
          } > p6b-apk-evidence/provenance.txt
          if [[ "$RELEASE_AVAILABLE" == 'true' ]]; then
            "$apksigner_bin" verify --verbose --print-certs "$release_apk" > p6b-apk-evidence/release-signing.txt
          else
            echo 'UNSIGNED RELEASE CANDIDATE — stable signing secrets were unavailable.' > p6b-apk-evidence/release-signing.txt
          fi
      - name: Upload APK/evidence
        uses: actions/upload-artifact@v4
        with:
          name: p6b-apk-evidence-${{ env.ANDROID_PHASE6B_SHA }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/*.apk
            p6b-apk-evidence/
          if-no-files-found: error
          retention-days: 30

  android-instrumentation:
    name: Phase 2-6B full Android emulator regression
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.ANDROID_PHASE6B_SHA }}
      - name: Verify exact Android candidate
        run: test "$(git rev-parse HEAD)" = "$ANDROID_PHASE6B_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Locate Android SDK and AVD
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          AVD_HOME="$RUNNER_TEMP/brick-p6b-avd"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER_PATH" >> "$GITHUB_ENV"
          echo "ADB=$SDK_ROOT/platform-tools/adb" >> "$GITHUB_ENV"
          echo "EMULATOR=$SDK_ROOT/emulator/emulator" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
      - name: Install and boot clean emulator
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'emulator' 'system-images;android-35;google_apis;x86_64'
          echo no | "$AVDMANAGER" create avd --force --name brick-p6b --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          nohup "$EMULATOR" -avd brick-p6b -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/brick-p6b-emulator.log 2>&1 &
          "$ADB" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
      - name: Run every retained Android instrumentation test
        id: instrumentation
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace 2>&1 | tee p6b-instrumentation.log
          code=${PIPESTATUS[0]}
          exit "$code"
      - name: Capture emulator diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p p6b-emulator-evidence
          cp /tmp/brick-p6b-emulator.log p6b-emulator-evidence/emulator.log || true
          cp p6b-instrumentation.log p6b-emulator-evidence/instrumentation.log || true
          "$ADB" devices -l > p6b-emulator-evidence/adb-devices.txt || true
          "$ADB" logcat -d -t 3000 > p6b-emulator-evidence/logcat.txt || true
          "$ADB" shell getprop > p6b-emulator-evidence/getprop.txt || true
      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6b-instrumentation-evidence-${{ env.ANDROID_PHASE6B_SHA }}
          path: |
            p6b-emulator-evidence/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  qualification:
    name: Phase 6B exact-pair qualification
    needs: [cloud, android-build, android-instrumentation]
    runs-on: ubuntu-latest
    steps:
      - name: Record qualified pair
        run: |
          echo "PHASE6B_COMPUTER_QUALIFIED"
          echo "cloud=$CLOUD_PHASE6B_SHA"
          echo "android=$ANDROID_PHASE6B_SHA"
