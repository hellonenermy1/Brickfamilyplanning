name: Brick V1 Phase 4 — One-time Android lock refresh

on:
  push:
    branches: [v1-p4-atlas-trust-cloud]
    paths: ['.github/workflows/v1-phase4-onetime-lock-refresh.yml']

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v1-p4-atlas-trust-android
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER_PATH" && test -x "$SDKMANAGER_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER_PATH")" >> "$GITHUB_PATH"
      - name: Install compile SDK explicitly
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36'
      - name: Regenerate exact Gradle lock
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:dependencies --write-locks
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'app/gradle.lockfile'
          grep -F 'androidx.test:runner:1.7.0=' app/gradle.lockfile >/dev/null
      - name: Commit exact generated lock to Android staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Brick Phase 4 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add app/gradle.lockfile
          git commit -m 'build: lock AndroidX instrumentation runner dependencies'
          git push origin HEAD:v1-p4-atlas-trust-android
