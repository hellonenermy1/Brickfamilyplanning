name: Deploy Brick V1 Phase 2 Candidate

on:
  workflow_dispatch:
    inputs:
      cloudflare_account_id:
        description: 'Cloudflare Account ID'
        required: true
        type: string
      install_map:
        description: 'Install/update the private Singapore map after deployment'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: brick-v1-phase2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
    steps:
      - name: Checkout selected Phase 2 ref
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Preflight credentials and selected source
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN' >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Missing workflow input: cloudflare_account_id' >&2
            exit 1
          fi
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$GITHUB_SHA" ]; then
            echo "Checked-out SHA $checked_out does not match workflow SHA $GITHUB_SHA" >&2
            exit 1
          fi
          echo "Deploy Phase 2 candidate source SHA: $checked_out"
          echo 'Cloudflare scoped token and Account ID are present (secret values not printed).'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Enforce V1 Phase 2 architecture before deployment
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"main": "src/worker-v7.ts"' wrangler.template.jsonc >/dev/null
          grep -F '"r2_buckets"' wrangler.template.jsonc >/dev/null
          grep -F '"binding": "HISTORY"' wrangler.template.jsonc >/dev/null
          grep -F '"binding": "MAPS"' wrangler.template.jsonc >/dev/null
          grep -F '"binding": "EVENTS"' wrangler.template.jsonc >/dev/null
          grep -F '"dead_letter_queue": "brick-family-v1-dlq"' wrangler.template.jsonc >/dev/null
          grep -F '"CF_ACCESS_TEAM_DOMAIN": "__CF_ACCESS_TEAM_DOMAIN__"' wrangler.template.jsonc >/dev/null
          grep -F '"CF_ACCESS_AUD": "__CF_ACCESS_AUD__"' wrangler.template.jsonc >/dev/null
          grep -F '/access/apps' scripts/setup.mjs >/dev/null
          grep -F 'setup.mjs' scripts/setup-v1-phase2.mjs >/dev/null
          grep -F 'schema/008_v1_phase2_evidence.sql' scripts/setup-v1-phase2.mjs >/dev/null
          grep -F 'brick-raw-evidence-30d' scripts/setup-v1-phase2.mjs >/dev/null
          grep -F 'evidence_batches' schema/008_v1_phase2_evidence.sql >/dev/null
          grep -F 'evidence_records' schema/008_v1_phase2_evidence.sql >/dev/null
          grep -F 'evidence_provider_health' schema/008_v1_phase2_evidence.sql >/dev/null
          grep -F 'decodeEvidenceBatch' src/evidence-protocol.ts >/dev/null
          grep -F 'persistEvidenceBatch' src/evidence-ingest.ts >/dev/null
          grep -F 'stored batch link does not match evidence record identity' src/evidence-ingest.ts >/dev/null
          grep -F 'readBoundedBody(req, EVIDENCE_MAX_BATCH_BYTES)' src/evidence-route.ts >/dev/null
          ! grep -F 'await req.arrayBuffer()' src/evidence-route.ts >/dev/null
          grep -F 'handleEvidenceRequest(req, env, deviceId)' src/worker-v7.ts >/dev/null
          grep -F 'verifyAccessRequest' src/access-auth.ts >/dev/null
          grep -F 'readBoundedBody(req, MAX_BLE_ANCHOR_BODY_BYTES)' src/ble-anchors.ts >/dev/null
          if grep -E 'D1MapBucket|withD1ObjectStores|D1QueueProducer|BRICK_PARENT_PASSWORD' src/worker-v5b.ts wrangler.template.jsonc scripts/setup.mjs scripts/setup-v1-phase2.mjs; then
            echo 'Temporary cardless Phase 5 compatibility/auth path leaked into the V1 Phase 2 deployment.' >&2
            exit 1
          fi

      - name: Run V1 Phase 2 validation gates
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/setup.mjs
          node --check scripts/setup-v1-phase2.mjs
          node --check scripts/test-phase2-evidence.mjs
          node --check scripts/test-phase2-evidence-link-integrity.mjs
          node --check scripts/test-phase2-evidence-route.mjs
          node --check scripts/install-private-map.mjs
          node --check scripts/verify-cloudflare-deployment.mjs
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit

          npx esbuild src/evidence-protocol.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-evidence-protocol.mjs
          npx esbuild src/evidence-ingest.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-evidence-ingest.mjs
          node scripts/test-phase2-evidence.mjs /tmp/brick-evidence-protocol.mjs /tmp/brick-evidence-ingest.mjs
          node scripts/test-phase2-evidence-link-integrity.mjs /tmp/brick-evidence-ingest.mjs

          npx esbuild src/evidence-route.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-evidence-route.mjs
          node scripts/test-phase2-evidence-route.mjs /tmp/brick-evidence-route.mjs

          npm run build:parent-assets
          node scripts/audit-privacy.mjs
          node scripts/check-parent-module.mjs

          npx esbuild src/access-auth.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-access-auth.mjs
          node scripts/test-phase6-access.mjs file:///tmp/brick-access-auth.mjs

          npx esbuild src/device-json-security.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-device-json-security.mjs
          node scripts/test-public-pairing-limits.mjs /tmp/brick-device-json-security.mjs

          npx esbuild src/phase5c.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5c.mjs
          node scripts/test-phase5c.mjs file:///tmp/brick-phase5c.mjs

          npx esbuild src/phase5-ops.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5-ops.mjs
          node scripts/test-phase5-ops.mjs /tmp/brick-phase5-ops.mjs

          npx esbuild src/history-codec.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-history-codec.mjs
          node scripts/test-history-codec.mjs /tmp/brick-history-codec.mjs

          # Preserve every proven Phase 6 durability/fallback gate while adding Phase 2 evidence.
          npx esbuild src/battery-health.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-battery-health.mjs
          npx esbuild src/backup-v6.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-backup-v6.mjs
          npx esbuild src/backup-restore-v6.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-backup-restore-v6.mjs
          npx esbuild src/route-constraint.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-route-constraint.mjs
          npx esbuild src/history-store.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-history-store.mjs
          npx esbuild src/queue-v6.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-queue-v6.mjs
          node scripts/test-phase6-ops.mjs /tmp/brick-battery-health.mjs /tmp/brick-backup-v6.mjs
          node scripts/test-backup-restore.mjs /tmp/brick-backup-restore-v6.mjs
          node scripts/test-route-constraint.mjs /tmp/brick-route-constraint.mjs
          node scripts/test-route-history.mjs /tmp/brick-history-store.mjs
          node scripts/test-dlq-recovery.mjs /tmp/brick-queue-v6.mjs

      - name: Provision and deploy V1 Phase 2 cloud candidate
        run: npm run setup

      - name: Install private Singapore map
        if: ${{ inputs.install_map }}
        run: npm run map:install

      - name: Strict final deploy tagged with exact Git SHA
        shell: bash
        run: |
          set -euo pipefail
          tag="brick-git-${GITHUB_SHA:0:12}"
          npx wrangler deploy --strict --config wrangler.jsonc --tag "$tag" --message "Brick V1 Phase 2 candidate source $GITHUB_SHA"
          npx wrangler deployments list --json --config wrangler.jsonc > worker-deployments.json
          test -s worker-deployments.json
          grep -F "$GITHUB_SHA" worker-deployments.json >/dev/null
          echo "Verified active deployment evidence contains source SHA $GITHUB_SHA"

      - name: Verify deployed Cloudflare resources and public attack surface
        env:
          BRICK_REQUIRE_PRIVATE_MAP: ${{ inputs.install_map }}
        run: node scripts/verify-cloudflare-deployment.mjs

      - name: Show deployment result
        if: always()
        shell: bash
        run: |
          if [ -f setup-state.json ]; then
            node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('setup-state.json', 'utf8'));
          console.log('Brick V1 Phase 2 deployment state');
          console.log('Source Git SHA:       ' + (s.sourceGitSha || 'NOT VERIFIED'));
          console.log('Release state:        ' + s.releaseState);
          console.log('V1 program phase:     ' + (s.v1ProgramPhase || 'NOT VERIFIED'));
          console.log('Evidence protocol:    ' + (s.v1Phase2EvidenceProtocol || 'NOT VERIFIED'));
          console.log('Parent dashboard:     https://' + s.workerHost + '/parent');
          console.log('Child API base:       https://' + s.workerHost);
          console.log('Main D1:              ' + s.resources.D1_NAME);
          console.log('History R2:           ' + s.resources.HISTORY_BUCKET);
          console.log('Private map R2:       ' + s.resources.MAPS_BUCKET);
          console.log('Event Queue:          ' + s.resources.EVENT_QUEUE);
          console.log('Dead Letter Queue:    ' + s.resources.DLQ);
          console.log('Access destination:   ' + s.access.destination);
          console.log('Private map installed:' + Boolean(s.privateMap?.installed));
          console.log('Deployment verified:  ' + Boolean(s.deploymentVerification?.ok));
          console.log('Current app release:  ' + s.currentRelease);
          NODE
          else
            echo 'setup-state.json was not created; inspect the failed step above.'
          fi

      - name: Upload non-secret deployment evidence
        if: ${{ always() && hashFiles('setup-state.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: brick-v1-phase2-deployment-evidence-${{ github.sha }}
          path: |
            setup-state.json
            deployment-verification.json
            worker-deployments.json
          if-no-files-found: warn
          retention-days: 30
