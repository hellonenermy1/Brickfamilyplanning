name: Deploy Brick Phase 5C

on:
  workflow_dispatch:
    inputs:
      cloudflare_account_id:
        description: 'Cloudflare Account ID'
        required: true
        type: string
      install_map:
        description: 'Install/update the private Singapore map after deployment'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: brick-phase5c-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BRICK_PARENT_PASSWORD: ${{ secrets.BRICK_PARENT_PASSWORD }}
      CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare_account_id }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Preflight credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo 'Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN' >&2
            exit 1
          fi
          if [ -z "${BRICK_PARENT_PASSWORD:-}" ]; then
            echo 'Missing GitHub Actions secret: BRICK_PARENT_PASSWORD' >&2
            exit 1
          fi
          if [ "${#BRICK_PARENT_PASSWORD}" -lt 16 ]; then
            echo 'BRICK_PARENT_PASSWORD must be at least 16 characters.' >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Missing workflow input: cloudflare_account_id' >&2
            exit 1
          fi
          echo 'Cloudflare token, parent password, and Account ID are present (secret values not printed).'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate deployment source
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit
          npm run build:parent-assets
          node scripts/audit-privacy.mjs
          node scripts/check-parent-module.mjs

          npx esbuild src/parent-auth.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-parent-auth.mjs
          node scripts/test-parent-auth.mjs file:///tmp/brick-parent-auth.mjs

          npx esbuild src/phase5c.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5c.mjs
          node scripts/test-phase5c.mjs file:///tmp/brick-phase5c.mjs

          npx esbuild src/phase5-ops.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5-ops.mjs
          node scripts/test-phase5-ops.mjs /tmp/brick-phase5-ops.mjs

          npx esbuild src/history-codec.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-history-codec.mjs
          node scripts/test-history-codec.mjs /tmp/brick-history-codec.mjs

          npx esbuild src/d1-r2-compat.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-d1-compat.mjs
          node scripts/test-d1-budget.mjs file:///tmp/brick-d1-compat.mjs

          if grep -F '/access/' scripts/setup.mjs; then
            echo 'Cloudflare Access dependency found in no-card setup.' >&2
            exit 1
          fi
          if grep -E 'R2_BUCKET|r2_buckets|queues|dead_letter|brick-family-v1-history' wrangler.template.jsonc scripts/setup.mjs; then
            echo 'Billing-gated R2/Queue dependency found in no-card deployment.' >&2
            exit 1
          fi

      - name: Provision and deploy Brick
        run: npm run setup

      - name: Install private Singapore map
        if: ${{ inputs.install_map }}
        run: npm run map:install

      - name: Show deployment result
        if: always()
        shell: bash
        run: |
          if [ -f setup-state.json ]; then
            node - <<'NODE'
          const fs = require('fs');
          const s = JSON.parse(fs.readFileSync('setup-state.json', 'utf8'));
          console.log('Brick deployment state');
          console.log('Parent dashboard: https://' + s.workerHost + '/parent');
          console.log('Child API base:    https://' + s.workerHost);
          console.log('Main D1:           ' + s.resources.D1_NAME);
          console.log('Private map D1:    ' + s.resources.MAP_D1_NAME);
          console.log('Parent auth:       Brick secure session (no Zero Trust required)');
          NODE
          else
            echo 'setup-state.json was not created; inspect the failed step above.'
          fi

      - name: Upload non-secret deployment state
        if: ${{ always() && hashFiles('setup-state.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: brick-phase5c-deployment-state
          path: setup-state.json
          retention-days: 7
