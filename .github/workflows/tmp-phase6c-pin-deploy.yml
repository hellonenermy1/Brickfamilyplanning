name: TEMP Phase 6C Reusable PIN Deploy

on:
  push:
    branches: [v1-p6c-parent-beta-cloud]
    paths: [.github/workflows/tmp-phase6c-pin-deploy.yml]

permissions:
  contents: read

concurrency:
  group: brick-v1-phase6-development
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Qualify reusable-PIN beta source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:parent-assets
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit
          bash scripts/phase6-cloud-regression.sh
          grep -F '"CURRENT_APP_VERSION": "0.6.0-phase6c-beta4-cardfree"' wrangler.development.template.jsonc >/dev/null
          grep -F '"DEV_PARENT_PIN_HASH": "931967fb6beab2e36f903438e73707c7e34bfec84c2492bb5cabc197e7bbc77d"' wrangler.development.template.jsonc >/dev/null
          grep -F '"name": "PARENT_LOGIN_RATE"' wrangler.development.template.jsonc >/dev/null
          grep -F 'reusable 6-digit beta access code' src/dev-parent-auth.ts >/dev/null
          ! grep -F 'consumed after the first successful login' src/dev-parent-auth.ts >/dev/null
      - name: Deploy isolated card-free beta
        run: npm run setup:development
      - name: Verify live reusable-PIN login boundary
        shell: bash
        run: |
          set -euo pipefail
          host="$(node --input-type=module -e "import fs from 'node:fs';console.log(JSON.parse(fs.readFileSync('setup-development-state.json','utf8')).workerHost)")"
          test -n "$host"
          parent_code="$(curl -sS -o /tmp/parent -w '%{http_code}' "https://$host/parent")"
          case "$parent_code" in 301|302|303|307|308|401) ;; *) echo "unexpected parent status $parent_code" >&2; exit 1;; esac
          login_code="$(curl -sS -o /tmp/login -w '%{http_code}' "https://$host/parent/login")"
          test "$login_code" = 200
          grep -F 'reusable 6-digit beta access code' /tmp/login >/dev/null
          ! grep -F 'one-time bootstrap code' /tmp/login >/dev/null
          wrong_code="$(curl -sS -o /tmp/wrong -w '%{http_code}' -X POST "https://$host/parent/login" -H 'content-type: application/x-www-form-urlencoded' --data 'token=000000')"
          test "$wrong_code" = 401
          echo "LIVE_PARENT=https://$host/parent"
          echo "parent=$parent_code login=$login_code wrong_pin=$wrong_code"
