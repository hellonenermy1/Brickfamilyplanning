name: Brick Beta Backend and Parent Portal
on:
  push:
    branches: [beta/backend-portal]
    paths: ['src/**', 'scripts/**', 'schema/**', 'beta/**', 'wrangler.beta.template.jsonc', '.github/workflows/beta-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brick-isolated-beta-cloud
  cancel-in-progress: false
jobs:
  cloud-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Read account capabilities without changing any resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/beta-cloud-preflight.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: beta-cloud-preflight-${{ github.sha }}
          path: beta-cloud-preflight.json
          if-no-files-found: ignore
