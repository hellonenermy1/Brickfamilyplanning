name: Brick Beta Backend and Parent Portal
on:
  push:
    branches: [beta/backend-portal, feat/v1-phase2-beta2-compat-20261106]
    paths: ['src/**', 'scripts/**', 'schema/**', 'beta/**', 'wrangler.beta.template.jsonc', '.github/workflows/beta-backend.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: brick-isolated-beta-cloud
  cancel-in-progress: false
jobs:
  cloud-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Read only Workers/D1 capability and parent-secret presence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          BRICK_DEV_PARENT_ACCESS_TOKEN: ${{ secrets.BRICK_BETA_PARENT_ACCESS_TOKEN || secrets.BRICK_DEV_PARENT_ACCESS_TOKEN }}
        run: node scripts/beta-cloud-preflight.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: beta-cloud-preflight-${{ github.sha }}
          path: beta-cloud-preflight.json
          if-no-files-found: ignore
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Stage exact signed D1 APK for real chunked download tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/13502684166/zip > /tmp/brick-beta-signed-artifact.zip
          python scripts/stage-beta-apk.py /tmp/brick-beta-signed-artifact.zip
      - name: Current Phase8D and beta trust-boundary qualification
        run: bash scripts/beta-cloud-regression.sh
      - name: Refuse high-severity dependency advisories
        run: npm audit --audit-level=high
      - name: Bundle the exact beta Worker without cloud writes
        run: npx --no-install wrangler deploy --dry-run --config wrangler.beta.template.jsonc --outdir /tmp/brick-beta-worker
  deploy:
    if: github.ref == 'refs/heads/beta/backend-portal'
    needs: [cloud-preflight, test, apk-currency]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      BRICK_DEV_PARENT_ACCESS_TOKEN: ${{ secrets.BRICK_BETA_PARENT_ACCESS_TOKEN || secrets.BRICK_DEV_PARENT_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Provision isolated card-free beta D1 and private parent sessions
        run: node scripts/setup-beta-d1.mjs
      - name: Download and verify the exact already-signed Phase1 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/13502684166/zip > /tmp/brick-beta-signed-artifact.zip
          python scripts/stage-beta-apk.py /tmp/brick-beta-signed-artifact.zip
      - name: Publish APK through authenticated beta download route
        run: node scripts/publish-beta-d1-release.mjs
      - name: Deploy exact source annotation
        run: npx --no-install wrangler deploy --strict --config wrangler.beta.jsonc --tag "brick-git-${GITHUB_SHA:0:12}" --message "Brick beta source $GITHUB_SHA APK dda193f7"
      - name: Verify private attack surface and actual deployment address
        run: node scripts/verify-beta-live.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: beta-deployment-${{ github.sha }}
          path: |
            beta-setup-state.json
            beta-live-verification.json
            beta-parent-login.encrypted.json
          if-no-files-found: ignore
  apk-currency:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Require current independently validated APK runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gate-beta-apk-currency.mjs
