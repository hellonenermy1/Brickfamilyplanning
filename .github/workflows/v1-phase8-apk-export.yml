name: Brick V1 Phase 8 — Stable Signed Device Owner Beta Export

on:
  push:
    branches: [v1-p8-android-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-stable-beta:
    name: Export testOnly Device Owner beta with pinned persistent signing
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          APKANALYZER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name apkanalyzer 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER_PATH" && test -x "$SDKMANAGER_PATH"
          test -n "$APKANALYZER_PATH" && test -x "$APKANALYZER_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "APKANALYZER=$APKANALYZER_PATH" >> "$GITHUB_ENV"
          echo "BRICK_KEYSTORE_PATH=$RUNNER_TEMP/brick-phase8-stable.jks" >> "$GITHUB_ENV"

      - name: Require persistent signing secrets and pinned certificate
        shell: bash
        env:
          BRICK_ANDROID_KEYSTORE_B64: ${{ secrets.BRICK_ANDROID_KEYSTORE_B64 }}
          BRICK_KEYSTORE_PASSWORD: ${{ secrets.BRICK_ANDROID_KEYSTORE_PASSWORD }}
          BRICK_KEY_ALIAS: ${{ secrets.BRICK_ANDROID_KEY_ALIAS }}
          BRICK_KEY_PASSWORD: ${{ secrets.BRICK_ANDROID_KEY_PASSWORD }}
          BRICK_EXPECTED_SIGNING_CERT_SHA256: ${{ secrets.BRICK_ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$BRICK_ANDROID_KEYSTORE_B64"
          test -n "$BRICK_KEYSTORE_PASSWORD"
          test -n "$BRICK_KEY_ALIAS"
          test -n "$BRICK_KEY_PASSWORD"
          test -n "$BRICK_EXPECTED_SIGNING_CERT_SHA256"
          expected="$(printf '%s' "$BRICK_EXPECTED_SIGNING_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          echo "BRICK_EXPECTED_SIGNING_CERT_NORMALIZED=$expected" >> "$GITHUB_ENV"
          printf '%s' "$BRICK_ANDROID_KEYSTORE_B64" | base64 --decode > "$BRICK_KEYSTORE_PATH"
          test -s "$BRICK_KEYSTORE_PATH"
          chmod 600 "$BRICK_KEYSTORE_PATH"

      - name: Install SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Refuse unsafe beta source
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'android:testOnly="true"' app/src/main/AndroidManifest.xml >/dev/null
          grep -F '0.8.0-phase8-beta1-test' app/build.gradle.kts >/dev/null
          ! grep -R -n -E 'wipeData[[:space:]]*\(|RecoverySystem|ACTION_FACTORY_RESET|MASTER_CLEAR' app/src/main app/src/androidTest
          ! git ls-files | grep -Ei '\.(jks|keystore|p12|pfx|pem|key)$|\.jks\.b64$'
          ! git grep -n -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'

      - name: Build stable-signed release beta
        env:
          BRICK_KEYSTORE_PASSWORD: ${{ secrets.BRICK_ANDROID_KEYSTORE_PASSWORD }}
          BRICK_KEY_ALIAS: ${{ secrets.BRICK_ANDROID_KEY_ALIAS }}
          BRICK_KEY_PASSWORD: ${{ secrets.BRICK_ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify release APK package, merged manifest and pinned certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p8-beta
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"

          # Verify the artifact that will actually be installed, not only the source manifest.
          test "$("$APKANALYZER" manifest application-id "$APK" | tr -d '\r')" = 'com.brick.safety'
          test "$("$APKANALYZER" manifest version-code "$APK" | tr -d '\r')" = '9'
          test "$("$APKANALYZER" manifest version-name "$APK" | tr -d '\r')" = '0.8.0-phase8-beta1-test'
          test "$("$APKANALYZER" manifest debuggable "$APK" | tr -d '\r')" = 'false'
          "$APKANALYZER" manifest print "$APK" | tee p8-beta/merged-manifest.xml >/dev/null
          grep -F 'android:testOnly="true"' p8-beta/merged-manifest.xml >/dev/null
          grep -F 'android:allowBackup="false"' p8-beta/merged-manifest.xml >/dev/null
          grep -F 'android:usesCleartextTraffic="false"' p8-beta/merged-manifest.xml >/dev/null
          ! grep -F 'Phase8RetirementHarnessReceiver' p8-beta/merged-manifest.xml

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee p8-beta/apk-signing-cert.txt
          ! grep -qi 'Android Debug' p8-beta/apk-signing-cert.txt
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' p8-beta/apk-signing-cert.txt | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          [[ "$actual" =~ ^[0-9a-f]{64}$ ]]
          test "$actual" = "$BRICK_EXPECTED_SIGNING_CERT_NORMALIZED"
          printf '%s\n' "$actual" > p8-beta/apk-signing-cert-sha256.txt
          cp "$APK" p8-beta/Brick-Phase8-Hardening-Beta.apk
          sha256sum p8-beta/Brick-Phase8-Hardening-Beta.apk | tee p8-beta/apk-sha256.txt
          printf 'git_sha=%s\nversion=0.8.0-phase8-beta1-test\nversion_code=9\nandroid_phase7_base=8843bdae902050c8c1fd7e67ed7ac80662d0da93\ntest_only=true\nsigning=persistent_release_secret_required\nsigning_cert_sha256=%s\n' "$GITHUB_SHA" "$actual" > p8-beta/provenance.txt

      - name: Remove materialized keystore
        if: always()
        shell: bash
        run: rm -f "$BRICK_KEYSTORE_PATH"

      - name: Upload stable-signed Phase 8 beta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-phase8-stable-signed-testonly-device-owner-beta
          path: p8-beta/
          if-no-files-found: error
          retention-days: 30
