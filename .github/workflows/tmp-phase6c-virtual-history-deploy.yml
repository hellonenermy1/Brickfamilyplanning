name: TEMP Phase 6C Virtual History Deploy

on:
  pull_request:
    branches: [v1-p6-device-control-cloud]

permissions:
  contents: read

concurrency:
  group: brick-v1-phase6-development
  cancel-in-progress: false

jobs:
  deploy:
    if: github.head_ref == 'v1-p6c-parent-beta-cloud'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: '24', cache: npm }
      - name: Qualify exact source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:parent-assets
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit
          bash scripts/phase6-cloud-regression.sh
          grep -F 'dev_location_history' schema/014_phase6c_virtual_history.sql >/dev/null
          grep -F 'class DirectEventQueue' src/dev-free-runtime.ts >/dev/null
          grep -F 'virtualHistoryObject' src/dev-free-runtime.ts >/dev/null
          grep -F 'virtualHistoryList' src/dev-free-runtime.ts >/dev/null
          ! grep -F '"r2_buckets"' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"queues"' wrangler.development.template.jsonc >/dev/null
          ! grep -F 'CF_ACCESS_' wrangler.development.template.jsonc >/dev/null
          ! grep -F '"triggers"' wrangler.development.template.jsonc >/dev/null
      - name: Provision, migrate and deploy
        run: npm run setup:development
      - name: Verify virtual-history D1 schema
        shell: bash
        run: |
          set -euo pipefail
          test -s wrangler.development.jsonc
          npx wrangler d1 execute brick-family-v1-dev --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('dev_location_history','dev_object_store','dev_parent_sessions','dev_maintenance_state') ORDER BY name" --config wrangler.development.jsonc > /tmp/brick-schema.txt
          for table in dev_location_history dev_object_store dev_parent_sessions dev_maintenance_state; do grep -F "$table" /tmp/brick-schema.txt >/dev/null; done
          ! grep -F 'r2_buckets' wrangler.development.jsonc >/dev/null
          ! grep -F '"queues"' wrangler.development.jsonc >/dev/null
          ! grep -F 'CF_ACCESS_' wrangler.development.jsonc >/dev/null
          ! grep -F '"triggers"' wrangler.development.jsonc >/dev/null
      - name: Strict exact-SHA deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --strict --config wrangler.development.jsonc --tag "brick-dev-virtual-history-${GITHUB_SHA:0:12}" --message "Brick Phase 6C virtual-history beta $GITHUB_SHA"
      - name: Security and API smoke
        shell: bash
        run: |
          set -euo pipefail
          host="$(node --input-type=module -e "import fs from 'node:fs';console.log(JSON.parse(fs.readFileSync('setup-development-state.json','utf8')).workerHost)")"
          parent_code="$(curl -sS -o /tmp/parent -w '%{http_code}' "https://$host/parent")"
          case "$parent_code" in 301|302|303|307|308|401) ;; 200) echo 'Parent portal public' >&2; exit 1;; *) echo "Unexpected parent status $parent_code" >&2; exit 1;; esac
          forged_code="$(curl -sS -o /tmp/forged -w '%{http_code}' "https://$host/parent" -H 'X-Brick-Dev-Parent-Verified: session-v1')"
          case "$forged_code" in 301|302|303|307|308|401) ;; 200) echo 'Forged auth bypass' >&2; exit 1;; *) echo "Unexpected forged status $forged_code" >&2; exit 1;; esac
          login_code="$(curl -sS -o /tmp/login -w '%{http_code}' "https://$host/parent/login")"
          test "$login_code" = 200
          api_code="$(curl -sS -o /tmp/api -w '%{http_code}' -X POST "https://$host/api/pair/complete" -H 'content-type: application/json' --data '{"token":"invalid"}')"
          case "$api_code" in 400|401|403|404|409|422|429) ;; 5??) echo "Child API server error $api_code" >&2; exit 1;; esac
          echo "Parent beta: https://$host/parent"
          echo "Child API: https://$host"
          echo "parent=$parent_code forged=$forged_code login=$login_code api=$api_code"
