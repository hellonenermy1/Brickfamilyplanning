name: TEMP Repair Development Device Columns

on:
  push:
    branches: [v1-p6c-parent-beta-cloud]
    paths: [.github/workflows/tmp-repair-development-device-columns.yml]

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRICK_DEV_PARENT_ORIGIN: https://brick-family-v1-dev.lumjayvian.workers.dev
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Repair D1 columns in place
        run: node scripts/ensure-development-legacy-columns.mjs
      - name: Run permanent authenticated live parent smoke
        run: node scripts/verify-development-parent-live.mjs
