name: Brick V1 Phase 8C — Emulator Durability Torture

on:
  push:
    branches: [v1-p8c-android-deep-audit]
    paths:
      - '.github/workflows/v1-phase8c-emulator-torture.yml'
      - 'app/src/main/**'
      - 'app/src/androidTest/**'
      - 'app/src/test/**'
      - 'app/build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  emulator-torture:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'

      - name: Locate Android SDK and AVD tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          AVD_HOME="$RUNNER_TEMP/brick-p8c-avd"
          mkdir -p "$AVD_HOME"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
          echo "AVDMANAGER=$AVDMANAGER_PATH" >> "$GITHUB_ENV"
          echo "ADB=$SDK_ROOT/platform-tools/adb" >> "$GITHUB_ENV"
          echo "EMULATOR=$SDK_ROOT/emulator/emulator" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"

      - name: Install AOSP image and build instrumentation APKs
        shell: bash
        run: |
          set -euo pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          retry_sdk_package() {
            local package="$1"
            if "$SDKMANAGER" "$package"; then
              return 0
            fi
            echo "First sdkmanager attempt failed for $package; clearing partial download state and retrying once" >&2
            rm -rf "$ANDROID_SDK_ROOT/.temp" "$HOME/.android/cache" || true
            case "$package" in
              emulator)
                rm -rf "$ANDROID_SDK_ROOT/emulator" || true
                ;;
              'system-images;android-35;default;x86_64')
                rm -rf "$ANDROID_SDK_ROOT/system-images/android-35/default/x86_64" || true
                ;;
            esac
            "$SDKMANAGER" "$package"
          }

          retry_sdk_package 'platform-tools'
          retry_sdk_package 'platforms;android-36'
          if [ ! -x "$EMULATOR" ]; then retry_sdk_package 'emulator'; fi
          retry_sdk_package 'system-images;android-35;default;x86_64'
          test -x "$EMULATOR"
          test -d "$ANDROID_SDK_ROOT/system-images/android-35/default/x86_64"

          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --console=plain

      - name: Boot clean Android 15 emulator
        shell: bash
        run: |
          set -euo pipefail
          echo no | "$AVDMANAGER" create avd --force --name brick-p8c --package 'system-images;android-35;default;x86_64' --device 'pixel_6'
          sudo chmod 666 /dev/kvm || true
          "$ADB" start-server
          nohup "$EMULATOR" -avd brick-p8c -wipe-data -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/brick-p8c-emulator.log 2>&1 &
          "$ADB" wait-for-device
          for i in $(seq 1 120); do
            [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = "1"
          "$ADB" install -t app/build/outputs/apk/debug/app-debug.apk
          "$ADB" install -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

      - name: Execute Phase 8C durability/isolation instrumentation
        shell: bash
        run: |
          set -euo pipefail
          classes=(
            'com.brick.safety.data.Phase8DurabilityTortureInstrumentedTest'
            'com.brick.safety.data.Phase8LowStorageInstrumentedTest'
            'com.brick.safety.data.Phase8BacklogScaleInstrumentedTest'
            'com.brick.safety.reliability.Phase8NetworkChaosInstrumentedTest'
            'com.brick.safety.evidence.Phase8ProviderIsolationInstrumentedTest'
            'com.brick.safety.privileged.Phase6PrivilegedBridgeInstrumentedTest'
            'com.brick.safety.crypto.Phase8DeviceKeyContinuityInstrumentedTest'
            'com.brick.safety.activity.Phase8ActivityHysteresisInstrumentedTest'
            'com.brick.safety.location.Phase8FusedFreshnessInstrumentedTest'
            'com.brick.safety.location.Phase3ConsistencyInstrumentedTest'
            'com.brick.safety.location.Phase3CoreInstrumentedTest'
            'com.brick.safety.location.Phase3StateStoreInstrumentedTest'
            'com.brick.safety.atlas.Phase4AtlasCoreInstrumentedTest'
            'com.brick.safety.atlas.Phase4AtlasStateInstrumentedTest'
            'com.brick.safety.atlas.Phase4SignalTrustInstrumentedTest'
            'com.brick.safety.atlas.Phase4TransitionInstrumentedTest'
            'com.brick.safety.fusion.Phase5FusionInstrumentedTest'
            'com.brick.safety.fusion.Phase5CoarseNetworkInstrumentedTest'
            'com.brick.safety.managed.Phase8CommandValidationInstrumentedTest'
            'com.brick.safety.diagnostics.Phase6CDiagnosticsInstrumentedTest'
            'com.brick.safety.maintenance.Phase8PolicyLedgerIntegrityInstrumentedTest'
            'com.brick.safety.maintenance.Phase8DeprovisionStageIntegrityInstrumentedTest'
            'com.brick.safety.maintenance.Phase8WifiVerificationInstrumentedTest'
            'com.brick.safety.maintenance.Phase8PurgeInventoryInstrumentedTest'
            'com.brick.safety.maintenance.Phase8PostPurgeIsolationInstrumentedTest'
            'com.brick.safety.maintenance.Phase8WorkManagerDrainInstrumentedTest'
            'com.brick.safety.privileged.Phase8ShizukuDeprovisionFenceInstrumentedTest'
            'com.brick.safety.privileged.Phase8ShizukuHungCapabilityInstrumentedTest'
            'com.brick.safety.privileged.Phase8ShizukuStaleReplyAfterPurgeInstrumentedTest'
          )
          : > /tmp/p8c-instrumentation.txt
          for class in "${classes[@]}"; do
            # Every class gets a clean target-app persistence boundary. Several tests deliberately
            # mutate durable role/policy state; carrying that state into the next instrumentation
            # process can auto-start production services and turn one test into another test's setup.
            "$ADB" shell am force-stop com.brick.safety >/dev/null 2>&1 || true
            "$ADB" shell pm clear com.brick.safety >/dev/null
            echo "===== $class =====" | tee -a /tmp/p8c-instrumentation.txt
            output="$($ADB shell am instrument -w \
              -e class "$class" \
              com.brick.safety.test/androidx.test.runner.AndroidJUnitRunner)"
            printf '%s\n' "$output" | tee -a /tmp/p8c-instrumentation.txt
            grep -E 'OK \([0-9]+ test|OK \([0-9]+ tests' <<<"$output" >/dev/null
          done

      - name: Prove corrupted deprovision stage stays fail-closed across independent cold start
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p8c-emulator-evidence
          "$ADB" shell am force-stop com.brick.safety || true
          "$ADB" shell pm clear com.brick.safety >/dev/null
          "$ADB" shell am instrument -w \
            -e class com.brick.safety.maintenance.Phase8CorruptStageColdStartSeedInstrumentedTest \
            com.brick.safety.test/androidx.test.runner.AndroidJUnitRunner \
            | tee p8c-emulator-evidence/corrupt-stage-fixture.txt
          grep -E 'OK \(1 test\)|OK \(1 tests\)' p8c-emulator-evidence/corrupt-stage-fixture.txt >/dev/null
          "$ADB" shell am force-stop com.brick.safety
          "$ADB" shell am start -W -n com.brick.safety/.ui.MainActivity \
            | tee p8c-emulator-evidence/corrupt-stage-cold-start.txt
          sleep 2
          # A successful Activity start is not enough: verify the failed-closed app restart did NOT
          # recreate the pre-purge diagnostics DB, pairing prefs or any sensor learning state.
          # run-as may start with a working directory outside the app package on some images.
          # Inspect a concrete absolute app-private directory; never weaken the no-recreation gate.
          app_data=/data/user/0/com.brick.safety
          "$ADB" shell run-as com.brick.safety pwd | tee p8c-emulator-evidence/run-as-working-directory.txt
          "$ADB" shell run-as com.brick.safety ls -l "$app_data/shared_prefs" \
            | tee p8c-emulator-evidence/cold-start-shared-prefs.txt
          if ! "$ADB" shell run-as com.brick.safety ls "$app_data/shared_prefs/brick_deprovision_v1.xml" >/dev/null 2>&1; then
            echo "::error::Corrupted stage record missing after cold-start; cannot assert fail-closed provenance"
            exit 1
          fi
          for path in \
            shared_prefs/brick.xml \
            shared_prefs/brick_position.xml \
            shared_prefs/brick_activity.xml \
            shared_prefs/brick_companion_presence.xml \
            shared_prefs/brick_diagnostics.xml \
            shared_prefs/brick_ble_anchors.xml \
            databases/brick_diagnostics.db \
            databases/brick_journal.db \
            databases/brick_evidence.db \
            files/brick_phase3_state.bin \
            files/brick_atlas_v1.bin \
            files/brick_learned_places_v1.bin; do
            if "$ADB" shell run-as com.brick.safety ls "$app_data/$path" >/dev/null 2>&1; then
              echo "::error::Corrupt-stage cold startup recreated forbidden store: $path"
              exit 1
            fi
          done
          echo 'PASS: cold restart with malformed deprovision stage did not recreate monitored stores' \
            | tee -a p8c-emulator-evidence/corrupt-stage-cold-start.txt

      - name: Capture package and database state
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p p8c-emulator-evidence
          cp /tmp/p8c-instrumentation.txt p8c-emulator-evidence/instrumentation.txt 2>/dev/null || true
          cp /tmp/brick-p8c-emulator.log p8c-emulator-evidence/emulator.txt 2>/dev/null || true
          timeout 10s "$ADB" shell dumpsys package com.brick.safety > p8c-emulator-evidence/package.txt 2>&1 || true
          timeout 15s "$ADB" logcat -d > p8c-emulator-evidence/logcat.txt 2>&1 || true

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p8c-emulator-torture-${{ github.run_id }}
          path: p8c-emulator-evidence
          retention-days: 30
          if-no-files-found: warn

      - name: Publish exact-commit Phase 8C status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f "state=$state" \
            -f "context=brick/p8c/emulator-torture" \
            -f "description=Phase 8C exact-commit CI: $JOB_STATUS" \
            -f "target_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
