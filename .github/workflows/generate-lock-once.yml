name: Generate Brick npm lockfile once

on:
  push:
    branches: [phase5c-hardening-audit]
    paths: [.github/workflows/generate-lock-once.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase5c-hardening-audit
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Generate lockfile without package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to Phase 5C branch
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current'
            exit 0
          fi
          git commit -m 'Phase 5C: lock npm dependency graph'
          git push origin HEAD:phase5c-hardening-audit
