name: Temporary Phase 6 lock refresh

on:
  push:
    branches: [v1-p6-device-control-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Generate exact Gradle lock
        run: gradle --no-daemon :app:dependencies --write-locks
      - name: Commit exact generated lock
        shell: bash
        run: |
          if git diff --quiet -- app/gradle.lockfile; then
            echo "Gradle lock is already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/gradle.lockfile
          git commit -m "build: refresh Phase 6 Gradle dependency lock"
          git push origin HEAD:v1-p6-device-control-android
      - name: Verify lock is clean after commit
        run: git diff --exit-code -- app/gradle.lockfile
