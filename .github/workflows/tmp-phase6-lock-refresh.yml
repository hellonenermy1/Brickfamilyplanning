name: Temporary Phase 6 lock refresh

on:
  push:
    branches: [v1-p6-device-control-android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Generate exact Gradle lock
        run: gradle --no-daemon :app:dependencies --write-locks
      - name: Upload generated lock
        uses: actions/upload-artifact@v4
        with:
          name: phase6-generated-gradle-lock
          path: app/gradle.lockfile
          if-no-files-found: error
          retention-days: 1
