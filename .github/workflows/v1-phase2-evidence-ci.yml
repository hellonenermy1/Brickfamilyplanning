name: Brick V1 Phase 2 — Evidence Foundation CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'schema/**'
      - 'scripts/**'
      - 'wrangler.template.jsonc'
      - 'package.json'
      - '.github/workflows/v1-phase2-evidence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_PHASE2_SHA: ca51b485743c2e4c39b535360feb3382a19f4043

concurrency:
  group: brick-v1-phase2-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cloud:
    name: Cloud protocol / persistence / regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Static and type checks
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/setup-v1-phase2.mjs
          node --check scripts/test-phase2-evidence.mjs
          node --check scripts/test-phase2-evidence-route.mjs
          npm run typecheck
          npx tsc -p tsconfig.web.json --noEmit
          grep -F '"main": "src/worker-v7.ts"' wrangler.template.jsonc >/dev/null
          grep -F 'evidence_batches' schema/008_v1_phase2_evidence.sql >/dev/null
          grep -F 'evidence_records' schema/008_v1_phase2_evidence.sql >/dev/null
          grep -F 'device_evidence_state' schema/008_v1_phase2_evidence.sql >/dev/null
          grep -F 'atlas_models' schema/008_v1_phase2_evidence.sql >/dev/null
          grep -F 'witness_authorizations' schema/008_v1_phase2_evidence.sql >/dev/null
          grep -F 'device_commands' schema/008_v1_phase2_evidence.sql >/dev/null
          grep -F 'refined_history_runs' schema/008_v1_phase2_evidence.sql >/dev/null

          # Phase 2 concurrency/replay/privacy/body-bound invariants. These complement the executable
          # harnesses below and deliberately fail if a later refactor removes the hard D1 claims,
          # content-addressed storage, bounded stream reader, canonical IDs or split rate buckets.
          grep -F '"INSERT INTO evidence_batches(' src/evidence-ingest.ts >/dev/null
          ! grep -F 'INSERT OR IGNORE INTO evidence_batches' src/evidence-ingest.ts >/dev/null
          grep -F '"INSERT INTO evidence_records(' src/evidence-ingest.ts >/dev/null
          ! grep -F 'INSERT OR IGNORE INTO evidence_records' src/evidence-ingest.ts >/dev/null
          grep -F '${batch.batchId}-${batchSha}.brev' src/evidence-ingest.ts >/dev/null
          grep -F 'duplicateRecords: true' src/evidence-ingest.ts >/dev/null
          grep -F 'allowRaceRetry' src/evidence-ingest.ts >/dev/null
          grep -F 'raced: true' src/evidence-ingest.ts >/dev/null
          grep -F 'readBoundedBody(req, EVIDENCE_MAX_BATCH_BYTES)' src/evidence-route.ts >/dev/null
          ! grep -F 'await req.arrayBuffer()' src/evidence-route.ts >/dev/null
          grep -F 'evidence-attempt:' src/evidence-route.ts >/dev/null
          grep -F 'evidence-device:${deviceId}' src/evidence-route.ts >/dev/null
          grep -F 'DEVICE_ID_RE' src/evidence-route.ts >/dev/null
          grep -F 'handleEvidenceRequest(req, env, deviceId)' src/worker-v7.ts >/dev/null
          grep -F 'p1363ToDer' scripts/test-phase2-evidence-route.mjs >/dev/null
          grep -F 'signLikeAndroid' scripts/test-phase2-evidence-route.mjs >/dev/null
          grep -F 'Buffer.alloc(65_537' scripts/test-phase2-evidence-route.mjs >/dev/null
          grep -F 'identical requests racing' scripts/test-phase2-evidence.mjs >/dev/null
          grep -F 'mixed-race' scripts/test-phase2-evidence.mjs >/dev/null

      - name: Phase 2 protocol + durable idempotency integration tests
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild src/evidence-protocol.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-evidence-protocol.mjs
          npx esbuild src/evidence-ingest.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-evidence-ingest.mjs
          node scripts/test-phase2-evidence.mjs /tmp/brick-evidence-protocol.mjs /tmp/brick-evidence-ingest.mjs

      - name: Phase 2 signed HTTP route integration tests
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild src/evidence-route.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-evidence-route.mjs
          node scripts/test-phase2-evidence-route.mjs /tmp/brick-evidence-route.mjs

      - name: Existing Phase 6 regression gates
        shell: bash
        run: |
          set -euo pipefail
          npm run build:parent-assets
          node scripts/audit-privacy.mjs
          node scripts/check-parent-module.mjs
          npx esbuild src/access-auth.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-access-auth.mjs
          node scripts/test-phase6-access.mjs file:///tmp/brick-access-auth.mjs
          npx esbuild src/device-json-security.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-device-json-security.mjs
          node scripts/test-public-pairing-limits.mjs /tmp/brick-device-json-security.mjs
          npx esbuild src/phase5-ops.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-phase5-ops.mjs
          node scripts/test-phase5-ops.mjs /tmp/brick-phase5-ops.mjs
          npx esbuild src/history-codec.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-history-codec.mjs
          node scripts/test-history-codec.mjs /tmp/brick-history-codec.mjs
          npx esbuild src/battery-health.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-battery-health.mjs
          npx esbuild src/backup-v6.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-backup-v6.mjs
          npx esbuild src/backup-restore-v6.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-backup-restore-v6.mjs
          npx esbuild src/route-constraint.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-route-constraint.mjs
          npx esbuild src/history-store.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-history-store.mjs
          npx esbuild src/queue-v6.ts --bundle --platform=node --format=esm --outfile=/tmp/brick-queue-v6.mjs
          node scripts/test-phase6-ops.mjs /tmp/brick-battery-health.mjs /tmp/brick-backup-v6.mjs
          node scripts/test-backup-restore.mjs /tmp/brick-backup-restore-v6.mjs
          node scripts/test-route-constraint.mjs /tmp/brick-route-constraint.mjs
          node scripts/test-route-history.mjs /tmp/brick-history-store.mjs
          node scripts/test-dlq-recovery.mjs /tmp/brick-queue-v6.mjs

  android-build:
    name: Android compile / lint / dependency lock
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.ANDROID_PHASE2_SHA }}

      - name: Verify exact paired Android source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ANDROID_PHASE2_SHA"
          echo "Phase 2 Android source $(git rev-parse HEAD)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Verify exact dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test -s app/gradle.lockfile
          before="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          gradle --no-daemon :app:dependencies --write-locks
          after="$(sha256sum app/gradle.lockfile | awk '{print $1}')"
          test "$before" = "$after"
          git diff --exit-code -- app/gradle.lockfile

      - name: Compile app and Phase 2 instrumentation tests
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace

      - name: Verify evidence code did not replace Brick Core or weaken priority
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const val VERSION: Byte = 2' app/src/main/java/com/brick/safety/data/Protocol.kt >/dev/null
          grep -F 'const val LIVE_PACKET_BYTES = 90' app/src/main/java/com/brick/safety/data/Protocol.kt >/dev/null
          grep -F 'private fun pairedDeviceId()' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'UUID.fromString(value)' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'parsed.version() == 4' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'parsed.variant() == 2' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'journal.appendNew(epoch, observation)' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'SafetyDispatcher.pendingCount(appContext)' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'locationJournal.stats().pendingCount' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'CrashOutbox(appContext)' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'scheduleEvidenceSoon(appContext, 5)' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'fun drainDetailed' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'acked.size != expected.size || acked.toSet() != expected.toSet()' app/src/main/java/com/brick/safety/evidence/EvidenceDispatcher.kt >/dev/null
          grep -F 'ORDER BY epoch,seq,id' app/src/main/java/com/brick/safety/evidence/EvidenceJournal.kt >/dev/null
          grep -F 'fun refreshHealth()' app/src/main/java/com/brick/safety/evidence/EvidenceJournal.kt >/dev/null
          ! grep -F 'hasQuarantinedEvidence' app/src/main/java/com/brick/safety/evidence/EvidenceJournal.kt >/dev/null
          grep -F 'journal.refreshHealth()' app/src/main/java/com/brick/safety/reliability/HealthEvidence.kt >/dev/null
          grep -F 'testPendingRowsAreReadInWireOrderAfterRecoveryInsert' app/src/androidTest/java/com/brick/safety/evidence/Phase2EvidenceInstrumentedTest.kt >/dev/null
          grep -F 'testQuarantineDoesNotPermanentlyPoisonRecoveredJournalHealth' app/src/androidTest/java/com/brick/safety/evidence/Phase2EvidenceInstrumentedTest.kt >/dev/null
          grep -F 'testQuietReadableJournalRecoversAfterFailureHoldWithoutDroppingQuarantineHistory' app/src/androidTest/java/com/brick/safety/evidence/Phase2JournalHealthInstrumentedTest.kt >/dev/null
          grep -F 'OneTimeWorkRequestBuilder<EvidenceUploadWorker>()' app/src/main/java/com/brick/safety/reliability/RecoveryScheduler.kt >/dev/null
          grep -F 'ExistingWorkPolicy.KEEP' app/src/main/java/com/brick/safety/reliability/RecoveryScheduler.kt >/dev/null
          grep -F 'ExistingWorkPolicy.APPEND_OR_REPLACE' app/src/main/java/com/brick/safety/reliability/RecoveryScheduler.kt >/dev/null
          grep -F 'NetworkType.CONNECTED' app/src/main/java/com/brick/safety/reliability/RecoveryScheduler.kt >/dev/null
          grep -F 'dispatcher.drainDetailed(maxBatches = 8)' app/src/main/java/com/brick/safety/reliability/EvidenceUploadWorker.kt >/dev/null
          grep -F 'evidenceUploadFailureStreak' app/src/main/java/com/brick/safety/reliability/EvidenceUploadWorker.kt >/dev/null
          grep -F 'MAX_FAILURE_DELAY_SECONDS = 15 * 60L' app/src/main/java/com/brick/safety/reliability/EvidenceUploadWorker.kt >/dev/null
          grep -F 'scheduleEvidenceFollowUp' app/src/main/java/com/brick/safety/reliability/EvidenceUploadWorker.kt >/dev/null
          grep -F 'ServiceControl.ensureTracking(applicationContext)' app/src/main/java/com/brick/safety/reliability/RecoveryWorker.kt >/dev/null
          grep -F 'RecoveryScheduler.scheduleEvidenceSoon(applicationContext, 1)' app/src/main/java/com/brick/safety/reliability/RecoveryWorker.kt >/dev/null
          grep -F 'testCorruptOrNonV4DeviceIdCannotPersistOrDrainEvidence' app/src/androidTest/java/com/brick/safety/evidence/Phase2PairingGuardInstrumentedTest.kt >/dev/null
          grep -F 'Phase2SequenceAllocatorInstrumentedTest' app/src/androidTest/java/com/brick/safety/evidence/Phase2SequenceAllocatorInstrumentedTest.kt >/dev/null
          grep -F 'testWrongOrMissingAckNeverDeletesPendingEvidence' app/src/androidTest/java/com/brick/safety/evidence/Phase2DrainReliabilityInstrumentedTest.kt >/dev/null
          grep -F 'testPersistentFailureBackoffIsBounded' app/src/androidTest/java/com/brick/safety/evidence/Phase2DrainReliabilityInstrumentedTest.kt >/dev/null

  android-instrumentation:
    name: Android evidence journal / protocol instrumentation
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.ANDROID_PHASE2_SHA }}

      - name: Verify exact paired Android source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ANDROID_PHASE2_SHA"
          echo "Phase 2 Android source $(git rev-parse HEAD)"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install Android emulator image
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-35' 'system-images;android-35;google_apis;x86_64'
          echo no | avdmanager create avd --force --name brick-p2 --package 'system-images;android-35;google_apis;x86_64' --device 'pixel_6'

      - name: Boot emulator and run Phase 2 tests
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 666 /dev/kvm || true
          nohup "$ANDROID_HOME/emulator/emulator" -avd brick-p2 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > /tmp/brick-emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82 || true
          gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace

      - name: Emulator log on failure
        if: failure()
        run: tail -n 300 /tmp/brick-emulator.log || true
