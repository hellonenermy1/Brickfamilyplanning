name: Generate Brick Phase 6 Android Dependency Lock

on:
  push:
    branches: [phase6-final-hardening]
  pull_request:
    branches: [phase6-integration]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Resolve and write Brick Android dependency locks
        run: gradle --no-daemon :app:dependencies --write-locks
      - name: Require generated app lock state
        shell: bash
        run: |
          set -euo pipefail
          test -s app/gradle.lockfile
          grep -F 'releaseRuntimeClasspath' app/gradle.lockfile >/dev/null
          grep -F 'debugRuntimeClasspath' app/gradle.lockfile >/dev/null
          sha256sum app/gradle.lockfile
      - name: Upload candidate Gradle lockfile
        if: ${{ always() && hashFiles('app/gradle.lockfile') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: brick-phase6-android-gradle-lock-${{ github.sha }}
          path: app/gradle.lockfile
          if-no-files-found: error
          retention-days: 30
      - name: Commit exact generated lock state to hardening branch
        if: ${{ github.event_name == 'push' && github.ref_name == 'phase6-final-hardening' }}
        shell: bash
        run: |
          set -euo pipefail
          git add app/gradle.lockfile
          if git diff --cached --quiet; then
            echo 'Committed Gradle lock state is already exact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: lock Phase 6 Android dependencies'
          git push origin HEAD:phase6-final-hardening
