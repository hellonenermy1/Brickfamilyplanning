name: Brick Device Owner Recovery Helper

on:
  push:
    branches: [recovery/device-owner-phase6c]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -n "$SDKMANAGER_PATH" && test -x "$SDKMANAGER_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"
      - name: Install build tools
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'build-tools;35.0.0'
      - name: Build dex helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery/build/classes recovery/build/dex
          javac -source 8 -target 8 -d recovery/build/classes recovery/BrickOwnerRecovery.java
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/d8" --min-api 29 --output recovery/build/dex recovery/build/classes/BrickOwnerRecovery.class
          cd recovery/build/dex
          zip -q ../BrickOwnerRecovery.jar classes.dex
          cd ../../..
          sha256sum recovery/build/BrickOwnerRecovery.jar | tee recovery/build/sha256.txt
          unzip -l recovery/build/BrickOwnerRecovery.jar
      - name: Upload helper
        uses: actions/upload-artifact@v4
        with:
          name: brick-owner-recovery-helper
          path: |
            recovery/build/BrickOwnerRecovery.jar
            recovery/build/sha256.txt
          if-no-files-found: error
          retention-days: 7
