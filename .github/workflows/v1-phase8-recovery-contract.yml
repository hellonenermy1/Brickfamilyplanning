name: Brick V1 Phase 8 — Android Recovery Contract

on:
  push:
    branches: [v1-p8-android-hardening]
  pull_request:
    branches: [v1-p8-android-hardening]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    name: Reconnect, reboot, backlog and SOS recovery wiring
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Verify automatic recovery and bounded retry wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          location = Path('app/src/main/java/com/brick/safety/location/BrickLocationService.kt').read_text()
          delivery = Path('app/src/main/java/com/brick/safety/reliability/DurableLocationDelivery.kt').read_text()
          boot = Path('app/src/main/java/com/brick/safety/reliability/BootReceiver.kt').read_text()
          recovery = Path('app/src/main/java/com/brick/safety/reliability/RecoveryWorker.kt').read_text()
          scheduler = Path('app/src/main/java/com/brick/safety/reliability/RecoveryScheduler.kt').read_text()
          safety = Path('app/src/main/java/com/brick/safety/reliability/SafetyDispatcher.kt').read_text()

          required_location = [
              'override fun onAvailable(network: Network)',
              'override fun onCapabilitiesChanged(network: Network, networkCapabilities: NetworkCapabilities)',
              'networkCapabilities.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED)',
              'kickUploadPump(force = true)',
              'return START_STICKY',
              'SafetyDispatcher.drain(this, 100)',
              'failed = true',
              'nextCoreUploadFailureDelayMs()',
              'nextUploadAttemptElapsed',
              'CoreUploadRetryPolicy.delayMs(next)',
              'DurableLocationDelivery.sendOne',
              'DurableLocationDelivery.sendBatch',
          ]
          for marker in required_location:
              assert marker in location, f'missing location recovery marker: {marker}'

          for marker in [
              'BASE_DELAY_MS = 5_000L',
              'MAX_DELAY_MS = 5L * 60L * 1_000L',
              'journal.ackExact',
              'journal.ackBatch',
              'acked.toSet() != expected.toSet()'
          ]:
              assert marker in delivery, f'missing durable delivery marker: {marker}'

          # A genuinely new network gets one immediate retry. Repeated capabilities callbacks for
          # the same network may wake the pump but must respect existing transport backoff.
          available = location.index('override fun onAvailable(network: Network)')
          capabilities = location.index('override fun onCapabilitiesChanged(network: Network, networkCapabilities: NetworkCapabilities)')
          callback_end = location.index('override fun onCreate()', capabilities)
          assert 'kickUploadPump(force = true)' in location[available:capabilities], 'new network no longer gets one immediate retry'
          capabilities_body = location[capabilities:callback_end]
          assert 'kickUploadPump()' in capabilities_body, 'validated-network callback no longer wakes upload pump'
          assert 'kickUploadPump(force = true)' not in capabilities_body, 'capabilities callback can still bypass retry backoff repeatedly'
          assert 'if (!force && nextUploadAttemptElapsed > now) return' in location, 'ordinary wakes no longer respect transport backoff'
          assert 'supervisor.schedule({ kickUploadPump() }, delayMs, TimeUnit.MILLISECONDS)' in location, 'bounded delayed retry missing'
          assert 'supervisor.schedule({ kickUploadPump() }, 2, TimeUnit.SECONDS)' not in location, 'fixed two-second failure retry storm reintroduced'

          # SOS/safety stays ahead of crash reports/history, and unreadable/pending safety work is
          # fail-closed instead of allowing normal history to jump the priority queue.
          pump = location.index('private fun kickUploadPump(force: Boolean = false)')
          safety_drain = location.index('SafetyDispatcher.drain(this, 100)', pump)
          safety_pending = location.index('SafetyDispatcher.pendingCount(this) > 0', safety_drain)
          safety_failure = location.index('failed = true', safety_pending)
          crash_drain = location.index('drainCrashReports(baseUrl, deviceId)', safety_failure)
          history_loop = location.index('while (true)', crash_drain)
          assert pump < safety_drain < safety_pending < safety_failure < crash_drain < history_loop, 'SOS-first upload ordering drifted'
          assert 'noteOutboxUnavailable(context)' in safety and '\n        1\n    }' in safety, 'safety outbox read failures are no longer fail-closed'

          for marker in [
              'Intent.ACTION_BOOT_COMPLETED',
              'Intent.ACTION_MY_PACKAGE_REPLACED',
              'ServiceControl.ensureTracking(app)',
              'RecoveryScheduler.scheduleSoon(app, 20)',
              'RecoveryScheduler.ensureScheduled(app)'
          ]:
              assert marker in boot, f'missing boot recovery marker: {marker}'

          assert 'ServiceControl.ensureTracking(applicationContext)' in recovery, 'periodic recovery no longer restarts tracking'
          for marker in [
              'PeriodicWorkRequestBuilder<RecoveryWorker>(15, TimeUnit.MINUTES)',
              'setRequiredNetworkType(NetworkType.NOT_REQUIRED)',
              'OneTimeWorkRequestBuilder<RecoveryWorker>()'
          ]:
              assert marker in scheduler, f'missing WorkManager recovery marker: {marker}'

          # Safety enqueue is durable-before-wake.
          append = safety.index('outbox.append(envelope.eventId, envelope.kind, envelope.payload, priority)')
          wake = safety.index('ServiceControl.ensureTracking(context)', append)
          assert append < wake, 'safety wake occurs before durable outbox persistence'
          print('Android automatic recovery + bounded retry contract OK')
          PY

      - name: Verify executable durability, chaos and low-storage tests exist
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/androidTest/java/com/brick/safety/data/Phase6DurabilityInstrumentedTest.kt
          test -f app/src/androidTest/java/com/brick/safety/data/Phase8DurabilityTortureInstrumentedTest.kt
          test -f app/src/androidTest/java/com/brick/safety/data/Phase8LowStorageInstrumentedTest.kt
          test -f app/src/androidTest/java/com/brick/safety/evidence/Phase2DrainReliabilityInstrumentedTest.kt
          test -f app/src/androidTest/java/com/brick/safety/reliability/Phase8NetworkChaosInstrumentedTest.kt
          test -f app/src/androidTest/java/com/brick/safety/managed/Phase8CommandValidationInstrumentedTest.kt
          test -f app/src/androidTest/java/com/brick/safety/activity/Phase8ActivityHysteresisInstrumentedTest.kt
          grep -F 'FOURTEEN_DAYS_MS' app/src/androidTest/java/com/brick/safety/data/Phase6DurabilityInstrumentedTest.kt >/dev/null
          grep -F 'testCorruptHighPrioritySafetyRowCannotStarveSos' app/src/androidTest/java/com/brick/safety/data/Phase8DurabilityTortureInstrumentedTest.kt >/dev/null
          # Low-storage coverage now uses deterministic SQLiteFullException injection at the exact
          # durable mutation boundary. This is stronger and less emulator-filesystem-dependent than
          # the old PRAGMA max_page_count harness, so verify the current executable fault path.
          grep -F 'SQLiteFullException' app/src/androidTest/java/com/brick/safety/data/Phase8LowStorageInstrumentedTest.kt >/dev/null
          grep -F 'writeFaultInjector = fullDisk()' app/src/androidTest/java/com/brick/safety/data/Phase8LowStorageInstrumentedTest.kt >/dev/null
          grep -F 'UnknownHostException' app/src/androidTest/java/com/brick/safety/reliability/Phase8NetworkChaosInstrumentedTest.kt >/dev/null
          grep -F 'SSLHandshakeException' app/src/androidTest/java/com/brick/safety/reliability/Phase8NetworkChaosInstrumentedTest.kt >/dev/null
          grep -F 'SocketTimeoutException' app/src/androidTest/java/com/brick/safety/reliability/Phase8NetworkChaosInstrumentedTest.kt >/dev/null
          grep -F 'synthetic rate limit' app/src/androidTest/java/com/brick/safety/reliability/Phase8NetworkChaosInstrumentedTest.kt >/dev/null
          grep -F 'testFutureExpiredAndImpossibleLifetimeCommandsAreRejectedAtDurableBoundary' app/src/androidTest/java/com/brick/safety/managed/Phase8CommandValidationInstrumentedTest.kt >/dev/null
          grep -F 'testWrongOrMissingAckNeverDeletesPendingEvidence' app/src/androidTest/java/com/brick/safety/evidence/Phase2DrainReliabilityInstrumentedTest.kt >/dev/null
          grep -F 'testTransitionWithoutConfidenceDegradesToUnknownUntilSampleConfirms' app/src/androidTest/java/com/brick/safety/activity/Phase8ActivityHysteresisInstrumentedTest.kt >/dev/null

      - name: Verify recovery workflow supply chain is pinned
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'uses:[[:space:]]+[^[:space:]#]+@v[0-9]+' .github/workflows/v1-phase8-recovery-contract.yml
