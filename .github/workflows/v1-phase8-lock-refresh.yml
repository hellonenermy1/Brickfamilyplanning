name: Brick V1 Phase 8 — Dependency Lock Refresh Evidence

on:
  push:
    branches: [v1-p8-android-hardening]
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/v1-phase8-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.13'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER_PATH="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          test -x "$SDKMANAGER_PATH"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER_PATH" >> "$GITHUB_ENV"

      - name: Install compile SDK
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0'

      - name: Resolve every configuration and regenerate dependency locks
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:dependencies --write-locks
          test -s app/gradle.lockfile
          cp app/gradle.lockfile phase8-generated-gradle.lockfile
          sha256sum phase8-generated-gradle.lockfile > phase8-generated-gradle.lockfile.sha256

      - name: Upload generated lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: brick-phase8-generated-gradle-lock-${{ github.sha }}
          path: |
            phase8-generated-gradle.lockfile
            phase8-generated-gradle.lockfile.sha256
          if-no-files-found: error
          retention-days: 7
