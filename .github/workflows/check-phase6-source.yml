name: Check Brick Phase 6 Source Inventory

on:
  push:
    branches: [phase6-cloud-final-audit, phase6-integration, phase6-final]
  pull_request:
    branches: [phase6-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Inventory, hash, and scan all Brick source/config files
        run: node scripts/source-inventory.mjs
      - name: Upload exact source inventory
        uses: actions/upload-artifact@v7
        with:
          name: brick-phase6-source-inventory
          path: phase6-source-inventory.json
          if-no-files-found: error
          retention-days: 30
